.legend{display:flex;gap:14px;font-size:.85em;color:var(--muted)}.legend .sw{display:inline-block;width:12px;height:3px;margin-right:5px;vertical-align:3px}
.sw.s0{background:var(--accent)}.sw.s1{background:var(--accent-2)}.sw.s2{background:var(--good)}.sw.s3{background:var(--bad)}
.bars{display:flex;flex-direction:column;gap:6px}
.bar-row{display:grid;grid-template-columns:minmax(120px,1.4fr) 2fr 90px;gap:10px;align-items:center}
.bar-l{font-size:.92em}.bar-v{text-align:right;font-family:var(--font-mono)}
.bar-t{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden}.bar-t i{display:block;height:100%}.bar-t i.pos{background:var(--good)}.bar-t i.neg{background:var(--bad)}
/* rankings / rivals / stakes / world / policies */
.rankings{display:flex;flex-direction:column;gap:3px}
.rank-row{display:grid;grid-template-columns:26px minmax(120px,1.4fr) 1fr 90px;gap:10px;align-items:center;border:0;background:transparent;padding:5px 4px;border-radius:var(--radius);text-align:left}
.rank-row:hover{background:var(--surface-2)}.rank-row.mine{background:color-mix(in srgb,var(--accent) 9%,transparent);font-weight:700}
.rk{color:var(--muted);font-family:var(--font-mono)}.rv{text-align:right;font-family:var(--font-mono)}
.rivals{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.rival{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.rival:hover{border-color:var(--accent)}.rival small{color:var(--muted)}
.rv-h{display:flex;align-items:center;gap:4px}.rv-h .chip{margin-left:auto}
.rv-stats{display:flex;gap:14px;margin-top:4px}.rv-stats span{display:flex;flex-direction:column}.rv-stats b{font-family:var(--font-mono)}
.stakes{display:flex;flex-direction:column;gap:6px}
.stake{display:grid;grid-template-columns:minmax(120px,1.2fr) 2fr 54px;gap:10px;align-items:center;border:0;background:transparent;padding:6px 4px;border-radius:var(--radius);text-align:left}
.stake:hover{background:var(--surface-2)}.sk-v{text-align:right;font-family:var(--font-mono);font-weight:600}
.world{display:flex;flex-direction:column;gap:10px}
.phase{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.phase span{grid-column:1;font-size:.78em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.phase b{grid-column:1;font-family:var(--font-display);font-size:1.3em}.phase small{grid-column:2;grid-row:1/3;color:var(--muted)}.phase svg{grid-column:3;grid-row:1/3}
.wvar{display:grid;grid-template-columns:1.2fr 1fr auto auto;gap:10px;align-items:center}.wvar b{font-family:var(--font-mono)}
.policies{display:flex;flex-direction:column;gap:14px}
.pol-h{display:flex;flex-direction:column;margin-bottom:6px}.pol-h small{color:var(--muted)}
.pol-d{color:var(--ink-2);font-size:.88em;margin-top:5px}
.kv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px 16px;margin:4px 0 12px}
.kv-grid div{display:flex;flex-direction:column}.kv-grid span{font-size:.74em;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.kv-grid b{font-family:var(--font-mono);font-size:1.08em}
.milestones{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.ms{display:flex;gap:10px;align-items:center;padding:8px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted)}
.ms.got{border-style:solid;color:var(--ink)}.ms.got .ic{color:var(--accent-2)}.ms div{display:flex;flex-direction:column}
.prose{line-height:1.6;color:var(--ink-2)}
.row{display:flex;gap:8px;align-items:center;margin:10px 0}
/* inspector */
.inspector{position:fixed;top:58px;right:0;bottom:0;width:min(440px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.1);z-index:20;display:flex;flex-direction:column;animation:slidein .18s ease-out}
@keyframes slidein{from{transform:translateX(30px);opacity:0}}
.insp-h{display:flex;gap:12px;align-items:flex-start;padding:16px;border-bottom:1px solid var(--line)}.insp-h>div:nth-child(2),.insp-h>div:first-child{flex:1;min-width:0}
.insp-h h2{font-size:1.35em}.insp-h p{margin:3px 0 0;color:var(--muted)}
.insp-k{font-size:.75em;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.insp-art{color:var(--accent);flex:none !important}
.insp-b{padding:14px 16px;overflow-y:auto;flex:1}
.insp-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;background:var(--surface-2)}
.pv-k{font-size:.74em;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 6px;font-weight:700}
.rel{display:flex;flex-wrap:wrap;gap:5px}
/* modals & dialogs */
.modal-back{position:fixed;inset:0;background:rgba(10,10,12,.48);display:grid;place-items:center;z-index:50;padding:18px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);color:var(--ink);border-radius:calc(var(--radius) * 2);box-shadow:0 30px 80px rgba(0,0,0,.35);width:min(620px,100%);max-height:92vh;overflow-y:auto;animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(8px) scale(.985);opacity:0}}
.modal.action-modal,.modal.neg-modal{width:min(980px,100%)}
.dlg-h{display:flex;gap:12px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}.dlg-h>.ic{width:26px;height:26px;color:var(--accent);margin-top:2px}.dlg-h>div{flex:1}.dlg-h p{margin:4px 0 0;color:var(--ink-2)}
.dlg-h h2 small{font-family:var(--font-body);font-weight:500;color:var(--muted);font-size:.6em}
.dlg-b{display:grid;grid-template-columns:1.25fr 1fr;gap:0}.dlg-b.noparams{grid-template-columns:1fr 1.5fr}
.dlg-params{padding:16px 20px;border-right:1px solid var(--line);max-height:62vh;overflow-y:auto}
.pfield{margin-bottom:16px;display:block}.pl{font-weight:650;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}.pl small{color:var(--muted);font-weight:500}.pval{font-family:var(--font-mono);color:var(--accent)}
.picks{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow-y:auto;margin-top:6px}
.pick{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:7px 10px}
.pick small{color:var(--muted)}.pick em{font-style:normal;color:var(--accent);font-size:.85em}.pick.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.dlg-params input[type=range]{width:100%}.range-ends{display:flex;justify-content:space-between;color:var(--muted);font-size:.8em}
.dlg-params>.pfield>.search{width:100%}
.pv{padding:16px 20px;background:var(--surface-2)}
.pv-cost{display:flex;flex-direction:column;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:10px}.pv-cost span{font-size:.75em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.pv-cost b{font-family:var(--font-mono);font-size:1.4em}.pv-cost small{color:var(--muted)}
.pv-items{display:flex;flex-direction:column;gap:5px}
.pv-item{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line)}.pv-item b{font-family:var(--font-mono)}
.pv-item.tone-good b{color:var(--good)}.pv-item.tone-bad b{color:var(--bad)}
.pv-note{margin-top:12px;padding:9px 11px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line)}.pv-note p{margin:3px 0 0;color:var(--ink-2)}
.pv-note.risk{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.pv-why{margin-top:12px;color:var(--bad);display:flex;flex-direction:column;gap:4px}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.event,.annual,.intro,.help,.explain{padding:22px 24px}.event .dlg-f,.help .dlg-f{padding:14px 0 0;border:0}
.ev-k,.intro-kicker{font-size:.75em;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.event h2,.annual h2,.intro h2{font-size:1.6em;margin:6px 0 10px}
.event.bad .ev-k{color:var(--bad)}.event.pri-critical h2{color:var(--bad)}
.ev-text{color:var(--ink-2);font-size:1.03em;line-height:1.55}
.ev-ctx{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ev-choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ev-choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:11px 14px}
.ev-choice:hover:not([disabled]){border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}.ev-choice small{color:var(--muted)}.ev-choice em{font-style:normal;font-size:.85em;color:var(--accent)}
.ev-choice[disabled]{opacity:.45}
.neg-last{margin-top:8px;padding:10px 12px;border-radius:var(--radius);border:1px solid var(--line)}
.neg-hist{list-style:none;padding:0;margin:0;font-size:.9em;display:flex;flex-direction:column;gap:6px}.neg-hist li.them{color:var(--ink-2);font-style:italic}
.moment-modal{width:min(560px,100%);text-align:center}
.moment{padding:38px 30px 30px}.moment-orn{color:var(--accent-2)}.moment-orn .ic{width:36px;height:36px}
.moment.bad .moment-orn{color:var(--bad)}.moment-date{color:var(--muted);font-size:.85em;text-transform:uppercase;letter-spacing:.1em;margin-top:6px}
.moment h2{font-size:2.1em;margin:10px 0}.moment p{font-size:1.1em;color:var(--ink-2)}.moment-stat{font-family:var(--font-mono);font-size:1.4em;margin:12px 0}
.moment .btn{margin-top:14px}
.intro-list{list-style:none;padding:0;margin:14px 0 20px;display:flex;flex-direction:column;gap:12px}
.intro-list li{display:flex;gap:12px;align-items:flex-start}.intro-list li>.ic{color:var(--accent);margin-top:2px}.intro-list li div{display:flex;flex-direction:column}.intro-list span{color:var(--ink-2)}
.obj-list{list-style:none;padding:0;margin:0}.obj-list li{padding:4px 0}
.annual .btn.lg,.intro .btn.lg{margin-top:12px}
.glossary dt{font-weight:700;margin-top:8px}.glossary dd{margin:2px 0 0;color:var(--ink-2)}
.palette-modal{align-self:start;margin-top:10vh}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 18px;font-size:1.1em}
.pal-list{max-height:55vh;overflow-y:auto;padding:6px}
.pal-row{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:9px 12px;border-radius:var(--radius);text-align:left}.pal-row small{margin-left:auto;color:var(--muted)}
.pal-row:hover,.pal-row.on{background:var(--surface-2)}
/* coach & toasts */
.coach{position:fixed;left:calc(var(--nav-w) + 16px);bottom:16px;width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--accent);border-radius:calc(var(--radius) + 2px);box-shadow:var(--shadow);padding:14px 16px 12px;z-index:30}
.coach-k{font-size:.72em;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:700}.coach p{margin:6px 0 10px}
.coach-b{display:flex;gap:6px}.coach-prog{height:3px;background:var(--surface-2);border-radius:2px;margin-top:10px;overflow:hidden}.coach-prog i{display:block;height:100%;background:var(--accent)}
.coach-pulse{animation:pulse 1.2s ease-out 2;position:relative;z-index:2}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(420px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:var(--radius);box-shadow:var(--shadow);animation:pop .2s ease-out;transition:opacity .35s,transform .35s}
.toast.good .ic{color:var(--good)}.toast.bad .ic{color:var(--bad)}.toast.warn .ic{color:var(--warn)}.toast.out{opacity:0;transform:translateY(6px)}
.fatal pre{white-space:pre-wrap;max-width:900px;background:var(--surface);padding:12px;border-radius:var(--radius);font-size:.85em}
/* compact density */
.compact .sec-body{padding:8px 12px 12px}.compact .tbl td{padding:4px 6px}.compact .main{padding:14px 18px 70px}
/* responsive */
@media (max-width:1100px){.w-third{grid-column:span 6}.tb-metrics{gap:12px}.clock small{display:none}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidenav{position:fixed;top:58px;left:0;bottom:0;width:240px;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .sidenav.open{transform:none}
  .menu-btn{display:inline-flex}
  .w-half,.w-third,.w-two{grid-column:span 12}
  .time-btn span{display:none}.tb-metric:nth-child(n+2){display:none}.brand-txt small{display:none}.clock{display:none}
  .main{padding:16px 16px 90px}
  .dlg-b{grid-template-columns:1fr}.dlg-params{border-right:0;border-bottom:1px solid var(--line);max-height:none}
  .coach{left:16px}
  .bar-row{grid-template-columns:1fr 1fr 70px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* showcase / mix / histogram (visual sections) */
.showcase{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.sc-tile{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.sc-tile::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--accent)}
.sc-art{color:var(--accent);display:flex;align-items:center;justify-content:center;min-height:64px;padding:4px 0;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--accent) 7%,transparent));border-radius:calc(var(--radius) - 2px)}
.sc-art .glyph{max-width:100%;height:auto}
.sc-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sc-head b{font-size:15px;flex:1;min-width:0}
.sc-big{font-family:var(--font-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.sc-head small{color:var(--muted);width:100%;font-size:11px;text-align:right;margin-top:-4px}
.sc-meter{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:8px;font-size:12px}
.sc-meter span{color:var(--muted)}.sc-meter b{text-align:right;font-variant-numeric:tabular-nums}
.sc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;border-top:1px solid var(--line);padding-top:8px}
.sc-stats span{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
.sc-dots{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.sc-dots i{width:10px;height:10px;border-radius:2px;background:var(--good);cursor:pointer}
.sc-dots i.tone-warn{background:var(--warn)}.sc-dots i.tone-bad{background:var(--bad)}.sc-dots i.tone-info{background:var(--muted)}
.sc-dots small{color:var(--muted);font-size:11px}
.mix{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:none}
.donut circle.mix-s{stroke:var(--accent)}.donut .s1{stroke:var(--accent-2)}.donut .s2{stroke:var(--good)}.donut .s3{stroke:var(--warn)}.donut .s4{stroke:var(--muted)}.donut .s5{stroke:var(--bad)}
.donut-v{font-family:var(--font-display);font-size:17px;fill:var(--ink)}.donut-l{font-size:6.5px;fill:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.mix-legend{flex:1;min-width:160px;display:flex;flex-direction:column;gap:6px}
.mix-l{display:grid;grid-template-columns:12px 1fr auto 36px;gap:8px;align-items:center;font-size:13px}
.mix-l small{color:var(--muted);text-align:right}
.mix-l .sw{width:10px;height:10px;border-radius:2px;display:inline-block;background:var(--accent)}
.mix-l .sw.s1{background:var(--accent-2)}.mix-l .sw.s2{background:var(--good)}.mix-l .sw.s3{background:var(--warn)}.mix-l .sw.s4{background:var(--muted)}.mix-l .sw.s5{background:var(--bad)}
.hist{display:flex;gap:6px;align-items:flex-end;height:150px;padding-top:8px}
.hist-c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px}
.hist-c i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.hist-c.tone-warn i{background:var(--warn)}.hist-c.tone-bad i{background:var(--bad)}.hist-c.tone-good i{background:var(--good)}
.hist-c span{color:var(--muted)}
@media (max-width:640px){.showcase{grid-template-columns:1fr}.sc-meter{grid-template-columns:80px 1fr 40px}}

/* Genre motifs: each changes the game's visual voice, not just its colors. Selected by theme.motif. */
/* textures */
.tex-paper{background-image:radial-gradient(color-mix(in srgb,var(--ink) 4%,transparent) 1px,transparent 1px);background-size:3px 3px}
.tex-grid{background-image:linear-gradient(color-mix(in srgb,var(--accent) 8%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--accent) 8%,transparent) 1px,transparent 1px);background-size:24px 24px}
.tex-carbon{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.015) 0 2px,transparent 2px 6px)}

/* ---------- DEPARTURE BOARD (airlines, logistics, transit) ---------- */
.motif-departure-board .topbar{background:var(--band);color:var(--band-ink);border-bottom:0}
.motif-departure-board .topbar .brand-txt small,.motif-departure-board .topbar .clock small,.motif-departure-board .tb-metric span{color:color-mix(in srgb,var(--band-ink) 60%,transparent)}
.motif-departure-board .clock{border-left-color:color-mix(in srgb,var(--band-ink) 20%,transparent);font-family:var(--font-mono)}
.motif-departure-board .clock b{color:#f6b73c;letter-spacing:.06em;text-transform:uppercase}
.motif-departure-board .tb-metric b{color:#f6b73c}.motif-departure-board .tb-metric.bad b{color:#ff7a66}.motif-departure-board .tb-metric.good b{color:#7ee0a1}
.motif-departure-board .topbar .icon-btn{color:var(--band-ink)}.motif-departure-board .topbar .icon-btn:hover{background:rgba(255,255,255,.08)}
.motif-departure-board .topbar .btn:not(.primary){background:transparent;color:var(--band-ink);border-color:rgba(255,255,255,.2)}
.motif-departure-board .sec-head h3{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.16em;font-size:.74em;font-weight:700;color:var(--muted)}
.motif-departure-board .sec-board{background:var(--band);border-color:var(--band)}
.motif-departure-board .sec-board .sec-head h3{color:#f6b73c}
.motif-departure-board .sec-board .board{color:#f2efe6}
.motif-departure-board .sec-board .brd-row{border-bottom:1px solid rgba(255,255,255,.07)}
.motif-departure-board .sec-board .brd-row:not(.brd-head) span{background:rgba(255,255,255,.05);border-radius:2px;padding:3px 6px;letter-spacing:.04em}
.motif-departure-board .sec-board .brd-head{color:rgba(255,255,255,.45)}
.motif-departure-board .sec-board button.brd-row:hover{background:rgba(255,255,255,.06)}
.motif-departure-board .sec-board .brd-status{color:#f6b73c}.motif-departure-board .sec-board .brd-status.tone-good{color:#7ee0a1}.motif-departure-board .sec-board .brd-status.tone-bad{color:#ff7a66}
.motif-departure-board .metric-v{font-family:var(--font-mono)}
.motif-departure-board .title-screen{background:var(--band);color:var(--band-ink)}
.motif-departure-board .title-name{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:#f6b73c;font-weight:700}
.motif-departure-board .title-name::after{content:"";display:block;height:3px;width:120px;margin:14px auto 0;background:repeating-linear-gradient(90deg,#f6b73c 0 14px,transparent 14px 20px)}
.motif-departure-board .title-tag,.motif-departure-board .disclaimer{color:color-mix(in srgb,var(--band-ink) 70%,transparent)}
.motif-departure-board .title-screen .btn:not(.primary){background:transparent;color:var(--band-ink);border-color:rgba(255,255,255,.25)}

  /* ---------------- action dialog ---------------- */
  E.ui.actionDialog = (app, actionId, selfRef) => {

    const def = app.game.defaultParams(a, app.game.playerOrg(), self);
    for (const [k, v] of Object.entries(def)) app.ui.dialog.raw[k] = v && typeof v === 'object' ? v.id : v;

  function renderAction(app) {

        html = `<div class="pfield"><div class="pl">${esc(p.label || p.id)} <small>${cands.length} option${cands.length === 1 ? '' : 's'}${p.sort ? ' · best first' : ''}</small></div>${cands.length > 8 || q ? `<input type="search" class="search" placeholder="Search…" value="${esc(dl.q[p.id] || '')}" data-input="dlgQ:${esc(p.id)}">` : ''}<div class="picks">${list || `<div class="empty">${esc(p.emptyText || 'Nothing available right now.')}</div>`}</div></div>`;

        html = `<div class="pfield"><div class="pl">${esc(p.label || p.id)}</div><div class="choice-row">${opts.map(o => `<button class="choice ${String(o.value) === String(cur) ? 'on' : ''}" data-a="dlgSet:${esc(p.id)}:${esc(o.value)}"><b>${esc(o.label)}</b>${o.describe ? `<small>${esc(o.describe)}</small>` : ''}</button>`).join('')}</div></div>`;
      } else if (p.type === 'bool') {

      } else {
        const sc = g.scope({ org, self, param: partial });
        const lo = p.min != null ? g.num(p.min, sc, 0) : 0, hi = p.max != null ? g.num(p.max, sc, 100) : 100;
        let v = +dl.raw[p.id]; if (!Number.isFinite(v)) v = lo; v = U.clamp(v, lo, hi); dl.raw[p.id] = v; partial[p.id] = v;
        const step = p.step || (p.type === 'int' ? 1 : p.type === 'pct' ? 0.005 : (hi - lo) / 100);

        html = `<div class="pfield"><div class="pl">${esc(p.label || p.id)} <b class="pval">${esc(show)}</b></div><input type="range" min="${lo}" max="${hi}" step="${step}" value="${v}" data-input="dlgNum:${esc(p.id)}"><div class="range-ends"><span>${esc(p.type === 'money' ? U.money(lo) : U.num(lo))}</span><span>${esc(p.type === 'money' ? U.money(hi) : U.num(hi))}</span></div></div>`;
      }
      return html;
    }).join('');
    const pv = g.previewAction(a, org, self, g.resolveParams(a, dl.raw, org, self));
    const cost = pv.cost.cash ? `<div class="pv-cost"><span>Cost now</span><b>${esc(U.money(pv.cost.cash))}</b><small>Cash after: ${esc(U.money(org.cash - pv.cost.cash))}</small></div>` : '';
    const items = pv.items.map(i => `<div class="pv-item ${i.tone ? 'tone-' + esc(i.tone) : ''}"><span>${esc(i.label)}</span><b>${esc(i.text)}</b></div>`).join('');
    const why = pv.why.length ? `<div class="pv-why">${pv.why.map(w => `<div>${D.icon('alert')} ${esc(w)}</div>`).join('')}</div>` : '';
    const right = `<div class="pv">${cost}${items ? `<div class="pv-items"><div class="pv-k">${pv.fc ? 'Forecast' : 'At a glance'}</div>${items}</div>` : ''}
      ${pv.tradeoff ? `<div class="pv-note"><b>What you give up</b><p>${esc(pv.tradeoff)}</p></div>` : ''}${pv.risk ? `<div class="pv-note risk"><b>What could go wrong</b><p>${esc(pv.risk)}</p></div>` : ''}${why}</div>`;
    return `<div class="dlg-h">${D.icon(a.icon || 'play')}<div><h2>${esc(a.label)}${self ? ` <small>· ${esc(S.entTitle(app, self))}</small>` : ''}</h2>${pv.describe ? `<p>${esc(pv.describe)}</p>` : ''}</div><button class="icon-btn" data-a="closeModal" aria-label="Close">${D.icon('close')}</button></div>
      <div class="dlg-b ${a.params && a.params.length ? '' : 'noparams'}"><div class="dlg-params">${paramHtml || '<p class="muted">No choices needed.</p>'}</div>${right}</div>
      <div class="dlg-f"><button class="btn ghost" data-a="closeModal">Cancel</button><button class="btn primary ${a.danger ? 'danger' : ''}" data-a="dlgGo" ${pv.ok ? '' : 'disabled'}>${esc(a.verb || a.label)}</button></div>`;
  }
  E.ui.handlers.dlgPick = (app, rest) => { app.ui.dialog.raw[rest[0]] = rest.slice(1).join(':'); refreshModal(app, renderAction(app)); };
  E.ui.handlers.dlgSet = (app, rest) => { const a = app.def.actions[app.ui.dialog.id]; const p = a.params.find(x => x.id === rest[0]); const o = p && p.options.find(x => String(x.value) === rest.slice(1).join(':')); app.ui.dialog.raw[rest[0]] = o ? o.value : rest[1]; refreshModal(app, renderAction(app)); };
  E.ui.inputHandlers.dlgQ = (app, rest, el) => { app.ui.dialog.q[rest[0]] = el.value; refreshModal(app, renderAction(app)); };
  E.ui.inputHandlers.dlgNum = (app, rest, el) => { app.ui.dialog.raw[rest[0]] = +el.value; clearTimeout(app._dn); app._dn = setTimeout(() => refreshModal(app, renderAction(app)), 60); };
  E.ui.inputHandlers.dlgText = (app, rest, el) => { app.ui.dialog.raw[rest[0]] = el.value; };
  E.ui.changeHandlers.dlgBool = (app, rest, el) => { app.ui.dialog.raw[rest[0]] = el.checked; refreshModal(app, renderAction(app)); };
  E.ui.handlers.dlgGo = (app) => {
    const dl = app.ui.dialog; const g = app.game;
    const r = g.act(dl.id, dl.raw, { self: dl.selfRef ? g.deref(dl.selfRef) : null });
    if (!r.ok) { app.toast(r.why.join(' · '), 'bad'); return; }
    app.coachEvent('acted:' + dl.id);
    app.closeModal();
  };

  /* ---------------- events ---------------- */
  E.ui.eventModal = (app, iid) => {
    const g = app.game, ev = g.state.events.pending.find(p => p.iid === iid);
    if (!ev) return;
    app.ui.dialog = { type: 'event', iid, locked: ev.priority === 'critical' };
    const binds = Object.values(ev.bind || {}).map(r => g.deref(r)).filter(x => x && (x.__ent || x.__org));
    const ctx = binds.length ? `<div class="ev-ctx">${binds.slice(0, 3).map(b => `<button class="chip" data-a="inspect:${esc(S.entRef(b))}">${esc(S.entTitle(app, b))}</button>`).join('')}</div>` : '';
    const html = `<div class="event ${esc(ev.tone)} pri-${esc(ev.priority)}"><div class="ev-k">${esc(ev.priority === 'critical' ? 'Decision required' : 'Decision')} · ${esc(g.cal.longLabel(ev.t))}</div><h2>${esc(ev.title)}</h2>${ev.text ? `<p class="ev-text">${esc(ev.text)}</p>` : ''}${ctx}
      <div class="ev-choices">${ev.choices.map(c => `<button class="ev-choice" data-a="evChoose:${esc(iid)}:${c.i}" ${c.enabled ? '' : 'disabled'}><b>${esc(c.label)}</b>${c.describe ? `<small>${esc(c.describe)}</small>` : ''}${(c.preview || []).map(p => `<em>${esc(p.label)}: ${esc(p.text)}</em>`).join('')}</button>`).join('')}</div>
      ${ev.priority !== 'critical' ? `<div class="dlg-f"><button class="btn ghost" data-a="evLater:${esc(iid)}">Decide later (auto-resolves in ${U.plural(Math.max(0, ev.expires - g.state.tick), g.cal.unitLabel)})</button></div>` : ''}</div>`;

  };
  E.ui.handlers.evChoose = (app, rest) => { const r = app.game.resolveEvent(rest[0], +rest[1]); if (r.ok) { app.ui.pendingToast = { text: r.result, tone: 'good' }; app.coachEvent('event'); } app.closeModal(); };
  E.ui.handlers.evLater = (app, rest) => { app.ui.deferred = app.ui.deferred || {}; app.ui.deferred[rest[0]] = true; app.closeModal(); };

  /* ---------------- negotiations ---------------- */
  E.ui.negotiationModal = (app, nid, last) => {
    const g = app.game, n = g.state.negotiations[nid];
    if (!n) { app.closeModal(); return; }
    const nd = app.def.negotiations[n.def];
    app.ui.dialog = { type: 'neg', nid, terms: Object.assign({}, n.status === 'countered' ? n.counter : n.terms) };
    renderNeg(app, last);
  };
  function renderNeg(app, last) {
    const g = app.game, dl = app.ui.dialog, n = g.state.negotiations[dl.nid];
    if (!n) return;
    const nd = app.def.negotiations[n.def];
    const sc = g.negScope(n);
    const terms = nd.terms.map(t => {
      const v = dl.terms[t.id];
      if (t.type === 'choice') return `<div class="pfield"><div class="pl">${esc(t.label)}</div><div class="seg">${t.options.map(o => `<button class="${o.value === v ? 'on' : ''}" data-a="negSet:${esc(t.id)}:${esc(o.value)}">${esc(o.label)}</button>`).join('')}</div></div>`;
      const lo = t.min != null ? g.num(t.min, sc, 0) : 0, hi = t.max != null ? g.num(t.max, sc, Math.max(1, v * 3)) : Math.max(1, v * 3);
      const step = t.step || (t.type === 'int' ? 1 : t.type === 'pct' ? 0.005 : Math.max(1, (hi - lo) / 200));
      const show = t.type === 'money' ? U.money(v) : t.type === 'pct' ? U.pct(v, 1) : U.num(v);
      return `<div class="pfield"><div class="pl">${esc(t.label)} <b class="pval">${esc(show)}</b></div><input type="range" min="${lo}" max="${hi}" step="${step}" value="${v}" data-input="negNum:${esc(t.id)}"></div>`;
    }).join('');
    const hist = n.history.slice(-6).map(h => `<li class="${h.by}">${h.by === 'you' ? 'You offered' : h.reject ? 'They rejected' : 'They countered'} ${h.terms ? esc(Object.entries(h.terms).map(([k, v]) => { const t = nd.terms.find(x => x.id === k); return t ? `${t.label} ${t.type === 'money' ? U.money(v) : t.type === 'pct' ? U.pct(v, 1) : U.num(v)}` : ''; }).filter(Boolean).join(', ')) : ''}${h.reason ? ` — “${esc(h.reason)}”` : ''}</li>`).join('');
    const rel = sc.relationship;
    const html = `<div class="dlg-h">${D.icon('handshake')}<div><h2>${esc(n.label)}: ${esc(n.withName)}</h2><p>Patience left: ${'●'.repeat(Math.max(0, n.patience + 1))}${'○'.repeat(Math.max(0, (nd.patience || 3) - n.patience))} · Relationship ${rel > 0 ? '+' : ''}${Math.round(rel)}</p></div><button class="icon-btn" data-a="closeModal">${D.icon('close')}</button></div>
      <div class="dlg-b"><div class="dlg-params">${terms}${last ? `<div class="neg-last tone-${last.status === 'accepted' ? 'good' : last.status === 'countered' ? 'warn' : 'bad'}"><b>${esc(last.status === 'countered' ? 'They countered' : last.status === 'accepted' ? 'Deal!' : last.status === 'failed' ? 'Talks collapsed' : 'Rejected')}</b>${(last.reasons || []).map(r => `<div>${esc(r)}</div>`).join('')}</div>` : ''}</div>
      <div class="pv"><div class="pv-k">History</div><ul class="neg-hist">${hist || '<li>No offers yet.</li>'}</ul>${n.status === 'countered' ? `<div class="pv-note"><b>Their counter-offer is on the table</b><p>Accept it, or adjust the terms and offer again.</p></div>` : ''}</div></div>
      <div class="dlg-f"><button class="btn ghost danger" data-a="negWalk">Walk away</button>${n.status === 'countered' ? '<button class="btn" data-a="negAccept">Accept counter</button>' : ''}<button class="btn primary" data-a="negOffer">Make offer</button></div>`;
    app.ui.dialogCls = 'neg-modal';

  }
  E.ui.inputHandlers.negNum = (app, rest, el) => { app.ui.dialog.terms[rest[0]] = +el.value; clearTimeout(app._ng); app._ng = setTimeout(() => renderNeg(app), 60); };
  E.ui.handlers.negSet = (app, rest) => { const n = app.game.state.negotiations[app.ui.dialog.nid]; const nd = app.def.negotiations[n.def]; const t = nd.terms.find(x => x.id === rest[0]); const o = t.options.find(x => String(x.value) === rest.slice(1).join(':')); app.ui.dialog.terms[rest[0]] = o.value; renderNeg(app); };

      <button class="btn primary lg" data-a="closeModal" autofocus>On to ${r.year + 1}</button></div>`, 'annual-modal');

      ${x.value != null ? `<div class="kv-grid"><div><span>Now</span><b>${esc(U.num(x.value, 0))}</b></div>${x.target != null ? `<div><span>Heading toward</span><b>${esc(U.num(x.target, 0))}</b></div>` : ''}${x.base != null ? `<div><span>Baseline</span><b>${esc(U.num(x.base, 0))}</b></div>` : ''}</div>` : ''}

    const stats = ((kd.display && kd.display.stats) || []).concat(kd.inspector && kd.inspector.stats || []).map(s => `<div><span>${esc(s.label)}</span><b>${esc(U.format(g.ev(s.expr, sc), s.format))}${s.suffix ? esc(s.suffix) : ''}</b></div>`).join('');
    const opStats = kd.operate ? `<div><span>Demand / ${esc(g.cal.unitLabel)}</span><b>${esc(U.int(x._demand))}</b></div><div><span>Sold</span><b>${esc(U.int(x._sold))}</b></div><div><span>Capacity</span><b>${esc(U.int(x._cap))}</b></div><div><span>Utilization</span><b>${esc(U.pct(x._load))}</b></div><div><span>Revenue</span><b>${esc(U.money(x._rev))}</b></div><div><span>Profit</span><b class="${x._profit < 0 ? 'neg' : 'pos'}">${esc(U.money(x._profit))}</b></div>` : '';
    const segs = x._seg ? `<div class="pv-k">Customers by segment</div>${D.bars(Object.entries(x._seg).map(([k, v]) => ({ label: ((app.def.markets[kd.operate.market] || {}).segments || []).find(s => s.id === k)?.label || k, value: v })), { fmt: U.int })}` : '';
    const hist = x._hp && x._hp.length > 2 ? `<div class="pv-k">Profit trend</div>${D.sparkline(x._hp, 300, 44)}` : '';

    /* ---------------- modals ---------------- */
