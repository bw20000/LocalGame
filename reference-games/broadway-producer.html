<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broadway Producer</title>
<meta name="description" content="Broadway Producer — Raise the money. Build the show. Own opening night. An offline commercial-theater production simulation.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23161313'/%3E%3Cpath d='M10 14h44v6H10z' fill='%236e1f2e'/%3E%3Cpath d='M12 20c4 18 8 28 16 32V20zM52 20c-4 18-8 28-16 32V20z' fill='%239e3448'/%3E%3Ccircle cx='32' cy='36' r='5' fill='%23dcbc80'/%3E%3C/svg%3E">
<style>:root{
  --bg:#0b0a0a; --bg2:#110f0f; --panel:#161313; --panel2:#1d1919; --panel3:#262020; --line:#2a2323; --line2:#3a3030; --burg:#6e1f2e; --burg2:#9e3448; --burgbg:rgba(158,52,72,.16);
  --text:#f2ebdd; --text2:#dad0bf; --muted:#a2978a; --faint:#71675f;
  --gold:#b8945a; --gold2:#dcbc80; --goldbg:rgba(184,148,90,.13);
  --good:#8ab98b; --goodbg:rgba(138,185,139,.13); --bad:#d27a6a; --badbg:rgba(210,122,106,.14); --warn:#d7ab5a; --warnbg:rgba(215,171,90,.13); --blue:#94a9c4; --bluebg:rgba(148,169,196,.13);
  --r:10px; --r2:6px; --sh:0 10px 30px rgba(0,0,0,.5); --font:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --serif:"Didot","Bodoni 72","Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif; --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
a{color:var(--gold2);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.num,td.n,.kpi .v{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .gold{color:var(--gold)} .blue{color:var(--blue)}
.small{font-size:12px} .tiny{font-size:11px} .big{font-size:18px} .b{font-weight:600} .up{text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;gap:10px;align-items:center} .row.wrap{flex-wrap:wrap} .col{display:flex;flex-direction:column;gap:8px} .sp{flex:1} .right{margin-left:auto}
.grid{display:grid;gap:14px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.hide{display:none!important}
/* shell */
#app{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr);height:100vh}
.side{grid-row:1/3;background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.brand .wm{font-family:var(--serif);font-size:19px;letter-spacing:.18em;color:var(--gold2)}
.brand .tg{font-size:10.5px;color:var(--faint);letter-spacing:.04em;margin-top:2px}
.agchip{display:flex;align-items:center;gap:9px;margin:12px 12px 4px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.agchip .lg{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:11.5px;color:#111;flex:none}
.agchip .an{font-weight:600;font-size:13px;line-height:1.2} .agchip .ar{font-size:11px;color:var(--muted)}
.nav{padding:6px 8px 16px}
.nav h6{margin:14px 10px 4px;font-size:10.5px;letter-spacing:.14em;color:var(--faint);font-weight:600}
.nav a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;color:var(--text2);font-size:13px;text-decoration:none}
.nav a:hover{background:var(--panel);color:var(--text)}
.nav a.on{background:var(--goldbg);color:var(--gold2)}
.nav a .bd{margin-left:auto;background:var(--gold);color:#111;border-radius:9px;font-size:10.5px;padding:0 6px;font-weight:700;min-width:18px;text-align:center}
.nav a .bd.r{background:var(--bad);color:#fff}
.top{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg2);min-width:0}
.clock{display:flex;align-items:center;gap:8px;min-width:0}
.date{font-weight:600;white-space:nowrap} .date small{display:block;font-weight:400;color:var(--muted);font-size:11px;line-height:1}
.speed{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.speed button{background:var(--panel);border:0;border-right:1px solid var(--line);padding:6px 9px;cursor:pointer;color:var(--text2);font-size:12px;min-width:32px}
.speed button:last-child{border-right:0}
.speed button.on{background:var(--gold);color:#111;font-weight:700}
.speed button:hover:not(.on){background:var(--panel3)}
.search{position:relative;flex:1;max-width:460px;min-width:120px}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px 7px 30px;outline:0}
.search input:focus{border-color:var(--gold)}
.search input[type=search]{padding-left:30px;width:100%}
.search svg{position:absolute;left:9px;top:9px;opacity:.5}
.sres{position:absolute;top:38px;left:0;right:0;background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--sh);max-height:70vh;overflow:auto;z-index:50}
.sres .it{display:flex;gap:10px;align-items:center;padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.sres .it:hover,.sres .it.sel{background:var(--panel3)}
.sres .grp{padding:6px 10px;font-size:10.5px;letter-spacing:.12em;color:var(--faint);background:var(--bg2)}
.tstat{display:flex;gap:14px;align-items:center;margin-left:auto;white-space:nowrap}
.tstat .s{font-size:11px;color:var(--muted);line-height:1.1} .tstat .s b{display:block;color:var(--text);font-size:13px}
.ibtn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer;position:relative}
.ibtn .dot{position:absolute;top:-5px;right:-6px;background:var(--bad);color:#fff;font-size:10px;border-radius:8px;padding:0 5px;font-weight:700}
.main{overflow-y:auto;min-width:0;background:var(--bg)}
.page{padding:18px 22px 60px;max-width:1500px;margin:0 auto}
.ph{display:flex;align-items:flex-end;gap:14px;margin:4px 0 16px;flex-wrap:wrap}
.ph h1{font-family:var(--serif);font-weight:500;font-size:26px;margin:0;letter-spacing:.01em}
.ph .sub{color:var(--muted);font-size:13px;margin-top:3px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:6px} .crumb a{color:var(--muted)}
/* panels */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card>.hd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line)}
.card>.hd h3{margin:0;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);font-weight:600}
.card>.hd .a{margin-left:auto;font-size:12px}
.card>.bd{padding:12px 14px}
.card>.bd.np{padding:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.kpi .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:11.5px;color:var(--muted)}
/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{position:sticky;top:0;background:var(--panel2);text-align:left;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.t th.n,table.t td.n{text-align:right;white-space:nowrap}
table.t th .ar{opacity:.7;margin-left:3px}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:hover td{background:rgba(255,255,255,.018)}
table.t tr.sel td{background:var(--goldbg)}
table.t td.nm{white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:8px 12px;font-size:12px;color:var(--muted)}
/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--text);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--panel3);text-decoration:none}
.btn.p{background:var(--gold);border-color:var(--gold);color:#15130e;font-weight:600}
.btn.p:hover{background:var(--gold2)}
.btn.d{border-color:rgba(217,119,107,.5);color:var(--bad)}
.btn.g{border-color:rgba(111,191,142,.45);color:var(--good)}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:6px}
.btn.xs{padding:1px 6px;font-size:11px;border-radius:5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)} .btn.ghost:hover{color:var(--text);background:var(--panel2)}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:7px;padding:6px 9px;outline:0;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{width:100%;min-height:90px;resize:vertical}
input[type=range]{accent-color:var(--gold);width:100%}
input[type=checkbox],input[type=radio]{accent-color:var(--gold)}
label.chk{display:flex;gap:8px;align-items:flex-start;cursor:pointer;padding:3px 0}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--panel);border:0;border-right:1px solid var(--line2);padding:5px 11px;cursor:pointer;font-size:12.5px;color:var(--text2)}
.seg button:last-child{border-right:0} .seg button.on{background:var(--goldbg);color:var(--gold2)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 13px;cursor:pointer;color:var(--muted);font-size:13px;white-space:nowrap}
.tabs button.on{color:var(--gold2);border-bottom-color:var(--gold)}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fbar select,.fbar input{font-size:12.5px;padding:5px 8px}
/* chips & bars */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line2);color:var(--text2);white-space:nowrap;background:var(--bg2)}
.chip.g{border-color:rgba(111,191,142,.4);color:var(--good)} .chip.r{border-color:rgba(217,119,107,.45);color:var(--bad)} .chip.y{border-color:rgba(216,178,90,.45);color:var(--warn)} .chip.gold{border-color:rgba(184,148,90,.5);color:var(--gold2);background:var(--goldbg)} .chip.b{border-color:rgba(127,163,209,.45);color:var(--blue)}
.real{font-size:9.5px;padding:0 5px;border-radius:4px;border:1px solid rgba(127,163,209,.5);color:var(--blue);letter-spacing:.05em;vertical-align:1px}
.fic{font-size:9.5px;padding:0 5px;border-radius:4px;border:1px solid var(--line2);color:var(--faint);letter-spacing:.05em;vertical-align:1px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.bar.g i{background:var(--good)} .bar.r i{background:var(--bad)} .bar.y i{background:var(--warn)}
.rating{display:inline-flex;align-items:center;gap:6px;min-width:84px}
.rating .bar{flex:1}
.xp{cursor:help;border-bottom:1px dotted var(--faint)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;color:#111}
.av.lg{width:64px;height:64px;font-size:21px}
.list .li{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.list .li:hover{background:rgba(255,255,255,.015)}
.pri2{border-left:3px solid var(--bad)} .pri1{border-left:3px solid var(--warn)} .pri0{border-left:3px solid transparent}
.empty{padding:26px;text-align:center;color:var(--muted)}
.note{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px;color:var(--text2)}
.note.gold{border-color:rgba(184,148,90,.35);background:var(--goldbg)}
.disc{font-size:11.5px;color:var(--muted);border:1px dashed var(--line2);border-radius:8px;padding:8px 10px;margin:10px 0}
.stat{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.stat:last-child{border-bottom:0} .stat .k{color:var(--muted)}
.msg{white-space:pre-wrap}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(5,7,10,.66);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--sh);width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.w{width:min(980px,100%)} .modal.xw{width:min(1200px,100%)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mh h2{margin:0;font-size:17px;font-weight:600}
.modal .mb{padding:16px 18px;overflow-y:auto}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.moment{text-align:center;padding:34px 30px 26px;background:radial-gradient(ellipse at top,rgba(184,148,90,.16),transparent 65%)}
.moment.bad{background:radial-gradient(ellipse at top,rgba(217,119,107,.14),transparent 65%)}
.moment .k{font-size:11px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.moment.bad .k{color:var(--bad)}
.moment h2{font-family:var(--serif);font-weight:500;font-size:30px;margin:12px 0 8px;line-height:1.15}
.moment p{color:var(--text2);margin:0 0 18px}
@media (prefers-reduced-motion:no-preference){.moment{animation:mIn .5s ease-out}@keyframes mIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}}
.reduced .moment{animation:none!important}
.pop{position:fixed;z-index:120;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--sh);padding:12px 14px;width:min(340px,92vw);font-size:12.5px}
.pop h4{margin:0 0 6px;font-size:13px}
.pop .ln{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.toast{position:fixed;right:18px;bottom:18px;background:var(--panel3);border:1px solid var(--line2);border-radius:10px;padding:10px 14px;box-shadow:var(--sh);z-index:150;max-width:380px;font-size:13px}
.tut{position:fixed;right:18px;bottom:18px;width:320px;background:var(--panel2);border:1px solid rgba(184,148,90,.45);border-radius:12px;box-shadow:var(--sh);z-index:40;padding:12px 14px}
.tut .st{font-size:10.5px;letter-spacing:.14em;color:var(--gold)}
/* charts */
svg.ch{display:block;width:100%;height:auto}
svg.ch text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)} .legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
/* negotiation */
.neg{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
.neglog{max-height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.bub{padding:8px 11px;border-radius:10px;max-width:92%;font-size:13px}
.bub.them{background:var(--panel3);align-self:flex-start;border-top-left-radius:3px}
.bub.you{background:var(--goldbg);border:1px solid rgba(184,148,90,.3);align-self:flex-end;border-top-right-radius:3px}
.term{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.term .tv{color:var(--muted);font-size:12.5px}
.meter{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--warn) 45%,var(--good));opacity:.85}
.meter i{position:absolute;top:-4px;width:3px;height:18px;background:var(--text);border-radius:2px}
/* wizard */
.wiz{max-width:1080px;margin:0 auto;padding:28px 22px 60px}
.steps{display:flex;gap:4px;margin:18px 0 22px;flex-wrap:wrap}
.steps span{flex:1;min-width:90px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);border-top:2px solid var(--line);padding-top:6px}
.steps span.on{color:var(--gold2);border-top-color:var(--gold)} .steps span.dn{color:var(--muted);border-top-color:var(--line2)}
.opt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:left;width:100%;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.opt:hover{border-color:var(--line2);background:var(--panel2)}
/* ===== shared game chrome ===== */

body{background:linear-gradient(180deg,#0b0a0a,#100d0d)}
.brand .wm{font-size:14px;letter-spacing:.16em;line-height:1.25}.brand .wm b{color:var(--text);font-weight:700;letter-spacing:.28em}
.title{background:radial-gradient(ellipse at 50% 14%,rgba(184,148,90,.12),transparent 58%),radial-gradient(ellipse at 50% 100%,rgba(90,52,28,.22),transparent 62%),var(--bg)}
.title .wm.t1{font-family:var(--serif);font-size:clamp(18px,3.2vw,30px);letter-spacing:.5em;color:var(--gold2);text-align:center}
.title .wm2{font-family:var(--serif);font-size:clamp(50px,9.5vw,108px);letter-spacing:.2em;color:var(--text);text-align:center;font-weight:600;line-height:1;margin-top:6px;text-shadow:0 6px 40px rgba(184,148,90,.18)}
.title .tg{text-align:center;color:var(--text2);letter-spacing:.14em;margin-top:12px;font-family:var(--serif);font-style:italic}
a.mine{color:var(--gold2);font-weight:600}
.logo{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;font-weight:700;font-size:10px;flex:none;letter-spacing:.02em;vertical-align:middle;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.logo.xs{width:18px;height:18px;border-radius:4px;font-size:7.5px;margin-right:5px}.logo.lg{width:54px;height:54px;font-size:16px;border-radius:12px}
.why{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);color:var(--muted);font-size:10px;cursor:help;padding:0;vertical-align:1px;margin-left:3px}.why:hover{color:var(--gold2);border-color:var(--gold)}
.chip.xs{font-size:9.5px;padding:0 5px}
.stg{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--panel3);color:var(--text2);white-space:nowrap}
.stg.s0{background:#2a2f3a;color:#c9ced8}.stg.s1{background:#233a33;color:#bfe8d1}.stg.s2{background:#1f3550;color:#cfe2ff}.stg.s3{background:#2f2b4f;color:#ddd6ff}.stg.s4{background:#4a3524;color:#ffe2c4}.stg.s5{background:#4a2a2a;color:#ffd2cc}.stg.s6{background:#4a4220;color:#fff1bf}
a.sec{color:var(--text2);border-bottom:1px dotted var(--line2)}a.sec:hover{color:var(--gold2);text-decoration:none}
.phead{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:14px;background:linear-gradient(115deg,color-mix(in srgb,var(--c1) 22%,#140f10),#181314 62%);box-shadow:inset 4px 0 0 var(--c1)}

<script>'use strict';
/* ===================== BROADWAY PRODUCER — core utilities ===================== */
const BP_VERSION = 1;
let G = null; // the whole game state (serializable)

// ---------- Seeded PRNG (sfc32) ----------
let _ra = 1, _rb = 2, _rc = 3, _rd = 4;
function rngSeed(seed) {
  let h = 1779033703 ^ String(seed).length;
  const s = String(seed);
  for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  const f = () => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; };
  _ra = f(); _rb = f(); _rc = f(); _rd = f();
  for (let i = 0; i < 20; i++) R();
}
function R() {
  _ra >>>= 0; _rb >>>= 0; _rc >>>= 0; _rd >>>= 0;
  let t = (_ra + _rb) | 0;
  _ra = _rb ^ (_rb >>> 9);
  _rb = (_rc + (_rc << 3)) | 0;
  _rc = (_rc << 21) | (_rc >>> 11);
  _rd = (_rd + 1) | 0;
  t = (t + _rd) | 0;
  _rc = (_rc + t) | 0;
  return (t >>> 0) / 4294967296;
}
function rngGet() { return [_ra, _rb, _rc, _rd]; }
function rngSet(a) { [_ra, _rb, _rc, _rd] = a; }
// deterministic hash-noise (does not consume RNG) — used for stable "fog of war" offsets
function hnoise(a, b) { let h = (a * 374761393 + b * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return ((h >>> 0) % 10000) / 10000; }

const ri = (lo, hi) => lo + Math.floor(R() * (hi - lo + 1));
const rf = (lo, hi) => lo + R() * (hi - lo);
const chance = p => R() < p;
const pick = a => a[Math.floor(R() * a.length)];
function gauss(m = 0, sd = 1) { let u = 0, v = 0; while (u === 0) u = R(); v = R(); return m + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function wpick(items, wf) { let tot = 0; const ws = items.map(x => { const w = Math.max(0, wf ? wf(x) : x[1]); tot += w; return w; }); if (tot <= 0) return items[Math.floor(R() * items.length)]; let r = R() * tot; for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; } return items[items.length - 1]; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function sample(a, n) { if (a.length <= n) return a.slice(); const out = [], used = new Set(); let guard = 0; while (out.length < n && guard++ < n * 20) { const i = Math.floor(R() * a.length); if (!used.has(i)) { used.add(i); out.push(a[i]); } } return out; }
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sig = x => 1 / (1 + Math.exp(-x));
const rnd = (v, d = 0) => { const m = Math.pow(10, d); return Math.round(v * m) / m; };
const num = (v, d = 0) => (isFinite(v) ? v : d);
const sum = (a, f) => { let s = 0; for (const x of a) s += f ? f(x) : x; return s; };
const avg = (a, f) => a.length ? sum(a, f) / a.length : 0;
const maxBy = (a, f) => { let b = null, bv = -Infinity; for (const x of a) { const v = f(x); if (v > bv) { bv = v; b = x; } } return b; };
const minBy = (a, f) => { let b = null, bv = Infinity; for (const x of a) { const v = f(x); if (v < bv) { bv = v; b = x; } } return b; };
const byDesc = f => (a, b) => f(b) - f(a);
const byAsc = f => (a, b) => f(a) - f(b);
function pushCap(arr, item, cap) { arr.push(item); if (arr.length > cap) arr.splice(0, arr.length - cap); }
function unshiftCap(arr, item, cap) { arr.unshift(item); if (arr.length > cap) arr.length = cap; }

// ---------- Calendar (day index = days since 1900-01-01 UTC) ----------
const DAY0 = Date.UTC(1900, 0, 1); // day index = days since 1900-01-01 (always positive)
const MS_DAY = 86400000;
function dayOf(y, m, d) { return Math.round((Date.UTC(y, m - 1, d) - DAY0) / MS_DAY); }
function dateOf(day) { const dt = new Date(DAY0 + day * MS_DAY); return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate(), w: dt.getUTCDay() }; }
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS_L = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DOWS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function fmtDate(day, long) { if (day == null || !isFinite(day)) return '—'; const t = dateOf(day); return long ? `${DOWS[t.w]}, ${MONTHS_L[t.m - 1]} ${t.d}, ${t.y}` : `${MONTHS[t.m - 1]} ${t.d}, ${t.y}`; }
function fmtDateShort(day) { if (day == null) return '—'; const t = dateOf(day); return `${MONTHS[t.m - 1]} ${t.d}`; }
function curYear() { return dateOf(G.day).y; }
function ageOf(p) { return p.by ? curYear() - p.by : 0; }
function daysUntil(d) { return d - G.day; }

function money(v, compact = true) {

    : card('Production account', `${stat('Raised', money(f.raised))}${stat(tip('reserve', 'Production account'), `<span class="${f.bank < 0 ? 'bad' : ''}">${money(f.bank)}</span>`)}${stat('Reserve target', money(reserveTarget(s)))}${f.loan > 0 ? stat(tip('loan', 'Producer loans outstanding'), `<span class="bad">${money(f.loan)}</span>`) : ''}${stat('Bonds held (returned at closing)', money(f.bonds || 0))}${stat(tip('recoup', 'Returned to investors'), `${money(f.dist)} (${pct(f.dist / f.raised)})${f.recD ? ` — recouped ${fmtDate(f.recD)}` : ''}`)}${stat(tip('pool', 'Producer pool paid'), money(f.distP))}${stat('Your producer fees', money(s.cum.fees))}${stat('Development reimbursed', money(s.dev.reimb || 0))}<div class="row wrap" style="margin-top:10px"><button class="btn" data-a="report:${s.id}">Send investor report</button><span class="small muted">last ${fmtDate(f.lastRep)}</span>${!['preview', 'run', 'closed', 'dead'].includes(s.stage) ? `<button class="btn d" data-a="cancelprod:${s.id}">Cancel production</button>` : ''}</div>`);
  const pl_ = s.bo.length ? card('Weekly results', lineChart([{ n: 'Gross', v: s.bo.slice(-52).map(b => b.gross) }, { n: 'Operating', v: s.bo.slice(-52).map(b => b.op), c: 'var(--good)' }, { n: 'Production account', v: s.bo.slice(-52).map(b => b.bank), c: 'var(--blue)', dash: 1 }], { fmt: v => money(v), labels: s.bo.slice(-52).map(b => fmtDateShort(b.d)), h: 180, ref: 0 })) : '';
  return `<div class="grid g2"><div class="col">${top}${card('Investors & partners', `<div class="tw"><table class="t"><tr><th>Source</th><th class="n">In</th><th class="n">Share</th><th class="n">Returned</th><th class="n">Multiple</th></tr>${comRows || `<tr><td colspan="5" class="empty">No commitments yet.</td></tr>`}</table></div>${s.co.length ? `<div class="small muted" style="padding:8px 12px">Producer pool: ${s.co.map(c => `${ownerName(c.o)} ${pct(c.pct)}`).join(', ')}; lead producer keeps ${pct(1 - sum(s.co, c => c.pct))}.</div>` : ''}`, { np: 1 })}</div><div class="col">${budget}${pl_}</div></div>`;
};
ACTIONS.capopen = a => { const s = SH(+a[0]); const d = fv('capdays'); res(startCapital(+a[0], d || 180), () => { UI.tab['s' + a[0]] = 'money'; }); };

ACTIONS.selfinv = a => { const s = SH(+a[0]); if (!s.fin || s.fin.broke) return toast('Investments go in while the capitalization is open.'); openModal({ title: `Invest in ${esc(s.n)}`, body: `<p class="small">You invest on the same terms as other investors. Company cash ${money(G.me.cash)} · personal ${money(G.me.pcash)}. Still needed: ${money(Math.max(0, s.fin.target - raisedOf(s)))}.</p><label class="fl">Amount<input type="number" id="siamt" value="${Math.round(Math.max(0, Math.min(s.fin.target - raisedOf(s), Math.max(G.me.cash, 0) * 0.3)) / 1e3) * 1e3}"></label><label class="fl">From${sel('sifrom', [['co', 'Company cash'], ['pers', 'Personal money']], 'co')}</label>`, foot: `<button class="btn" data-a="closemodal">Cancel</button><button class="btn p" data-a="selfinvgo:${s.id}">Invest</button>` }); };
ACTIONS.selfinvgo = a => { const amt = fv('siamt'), from = fv('sifrom'); closeModal(); res(investSelf(+a[0], amt, from)); };
// ---------- theater & schedule ----------
SHOW_TABS.theater = s => {
  const t = TH(s.th); const pend = G.offers.find(o => !o.st && o.k === 'book' && o.sid === s.id);
  let top;
  if (t) { const b = s.bk; top = card(`Booked: ${thl(t)}`, `${stat('Seats', t.seats.toLocaleString())}${stat('Owner', esc(thOwnerN(t)))}${stat('Rent', `${money(b.rent)}/week + ${pct(b.pct, 1)} of gross`)}${stat(tip('stop', 'Stop clause'), `${money(b.stop)}/week`)}${stat('Available', b.from ? fmtDate(b.from) : 'when the current tenant closes')}${s.reh ? stat('Rehearsals', `${fmtDate(s.reh.start)} (${s.reh.weeks} weeks)`) + stat('First preview', fmtDate(s.prev.start)) + stat(tip('freeze', 'Freeze'), fmtDate(s.prev.freeze)) + stat('Opening night', `<b>${fmtDate(s.openD)}</b>`) : ''}
    ${!['rehearsal', 'preview', 'run'].includes(s.stage) ? `<div class="row wrap" style="margin-top:10px">${b.from && s.fin && s.fin.broke ? `<label class="small">Preview weeks <input type="number" id="pvw" value="${s.prev ? s.prev.weeks : 4}" min="1" max="8" style="width:60px"></label><label class="small">Move in <input type="text" id="mvin" value="${fmtDate(Math.max(b.from, G.day + 7 + rehWeeks(s) * 7))}" style="width:130px" title="Earliest date shown; later dates must be typed as Mon D, YYYY"></label><button class="btn p" data-a="sched:${s.id}">${s.reh ? 'Reschedule' : 'Set schedule'}</button>` : `<span class="small muted">${!s.fin || !s.fin.broke ? 'Set dates once the show is fully capitalized.' : 'Waiting for the current tenant to post a closing.'}</span>`}<button class="btn ghost" data-a="cancelbook:${s.id}">Release booking</button></div>` : ''}`); }
  else if (pend) top = card('Booking request', `<p>Waiting to hear from ${esc(thOwnerN(TH(pend.th)))} about the ${thl(pend.th)} — by ${fmtDate(pend.resp)}.</p>`);
  else top = card('Find a theater', `<p class="small">Owners weigh heat, how much you’ve raised, stars, their relationship with you and whether the show suits the house. Occupied houses can be requested as “next in line”.</p>`);
  const list = G.th.map(x => ({ x, a: thAvail(x) })).filter(o => !o.x.np || o.x.org === -1).sort((a, b) => (b.a.ok - a.a.ok) || fitScore(s, b.x) - fitScore(s, a.x));
  const tbl = !t && !pend && s.fin ? card('Broadway houses', table('thpick' + s.id, [
    { k: 'n', l: 'Theater', f: o => thl(o.x), s: o => o.x.n }, { k: 'seats', l: 'Seats', n: 1, f: o => o.x.seats.toLocaleString(), s: o => o.x.seats }, { k: 'fit', l: 'Fit', n: 1, f: o => `<span class="${clr(fitScore(s, o.x), 0.6, 0.2)}">${pct(Math.max(0, fitScore(s, o.x)))}</span>`, s: o => fitScore(s, o.x) },
    { k: 'own', l: 'Owner', f: o => esc(thOwnerN(o.x)), s: o => thOwnerN(o.x) }, { k: 'av', l: 'Availability', f: o => `<span class="small ${o.a.ok ? 'good' : o.a.hold ? 'warn' : 'muted'}">${esc(o.a.why)}</span>`, s: o => o.a.ok ? 2 : o.a.hold ? 1 : 0 },
    { k: 'sc', l: 'Your package', n: 1, f: o => xp('owner', `${s.id}|${o.x.id}`, Math.round(ownerScore(s, o.x))), s: o => ownerScore(s, o.x) },
    { k: 'go', l: '', nosort: 1, cls: 'acts', f: o => o.a.ok || o.a.hold ? `<button class="btn xs ${o.a.ok ? 'p' : ''}" data-a="book:${s.id}:${o.x.id}">${o.x.org === -1 ? 'Book (yours)' : o.a.ok ? 'Request' : 'Next in line'}</button>` : '' },
  ], list, { def: { sort: 'av', dir: -1, ps: 20 } }), { np: 1 }) : (!s.fin ? card('Broadway houses', empty('Open the capitalization before approaching theater owners.')) : '');
  const tryout = !s.tryout && s.fin && s.fin.broke && !s.reh && !t ? card('Out-of-town tryout', `<p class="small">Run the show at a regional theater first: local critics, real audiences and weeks to fix it — at the cost of time and some money, and a risk of bad early buzz.</p><div class="tw"><table class="t"><tr><th>Theater</th><th>City</th><th class="n">Prestige</th><th class="n">Seats</th><th></th></tr>${G.reg.map(r => `<tr><td>${esc(r.n)}</td><td>${esc(r.city)}</td><td class="n">${r.pres}</td><td class="n">${r.seats}</td><td class="acts"><button class="btn xs" data-a="tryout:${s.id}:${r.id}">Go (5 weeks)</button></td></tr>`).join('')}</table></div>`, { np: 1 }) : s.tryout ? card('Out-of-town tryout', `${stat('Where', `${esc(REG(s.tryout.reg).n)}, ${esc(REG(s.tryout.reg).city)}`)}${stat('Performances', `${fmtDate(s.tryout.perf)} – ${fmtDate(s.tryout.end)}`)}${stat('Gross', money(s.tryout.gross))}${s.tryout.score != null ? stat('Local critics', `${s.tryout.score}/100`) : ''}`) : '';
  return `${top}${tbl}${tryout}`;
};
ACTIONS.book = a => { const s = SH(+a[0]), t = TH(+a[1]); if (!s || !t || t.org === -1) return res(requestBooking(+a[0], +a[1])); const b = bookTerms(s, t); promptBox(`Rent offer for the ${t.n} as a multiple of the standard ${money(b.rent)}/week (0.8–1.3). Richer offers make the owner likelier to say yes and to choose you over a rival.`, '1.00', v => res(requestBooking(+a[0], +a[1], v)), 'number'); };

ACTIONS.tryout = a => { const s = SH(+a[0]), r = REG(+a[1]); confirmBox(`Take ${esc(s.n)} to ${esc(r.n)} in ${esc(r.city)} for five weeks of performances (plus rehearsals)? Physical production costs are paid now; about half carries over to Broadway.`, () => res(startTryout(s.id, r.id, 5))); };

  return `<div class="grid g2"><div class="col">${card('Preview period', s.prev ? `${stat('First preview', fmtDate(s.prev.start))}${stat(tip('freeze', 'Freeze'), `${fmtDate(s.prev.freeze)}${frozen ? ' <span class="chip">frozen</span>' : ''}`)}${stat('Opening night', `<b>${fmtDate(s.openD)}</b>`)}${stat('Changes so far', s.flags.fixes || 0)}${s.stage === 'preview' ? `<div class="row wrap" style="margin-top:8px"><button class="btn" data-a="postpone:${s.id}">Postpone opening a week</button>${!frozen ? `<button class="btn" data-a="freezenow:${s.id}">Freeze now</button>` : ''}</div>` : ''}` : empty('No previews scheduled.'))}
    ${s.stage === 'preview' && !frozen ? card('Make changes', Object.entries(FIXES).filter(([k]) => isMus(s) || !['cutsong', 'newsong'].includes(k)).map(([k, [n, c, d]]) => `<div class="row" style="padding:5px 0;border-bottom:1px solid var(--line)"><div style="flex:1;min-width:0"><b class="small">${esc(n)}</b><div class="tiny muted">${esc(d)}</div></div><span class="small">${money(c * C$())}</span><button class="btn xs" data-a="fix:${s.id}:${k}">Do it</button></div>`).join('') + '<div class="tiny muted" style="margin-top:6px">Too many changes exhaust the company. You can also recast from the Cast tab.</div>') : ''}
    ${card('Opening night party', `<div class="row wrap">${Object.entries(PARTY).map(([k, [c]]) => `<button class="btn sm ${(s.flags.party || 'standard') === k ? 'p' : ''}" data-a="party:${s.id}:${k}">${cap1(k)} · ${money(c * S$())}</button>`).join('')}</div><div class="tiny muted" style="margin-top:6px">A bigger party buys a little buzz and goodwill; it can’t buy reviews.</div>`)}</div>
    <div class="col">${card('Preview reports', pv.length ? pv.map(f => `<div class="ddrow fb"><div class="row"><b class="small">${esc(f.t)}</b><span class="tiny muted">${fmtDate(f.d)}</span>${f.aud != null ? `<span class="chip xs">house ${f.aud}</span>` : ''}</div>${f.lines.map(l => `<div class="ln small"><span class="${l[1]}">${esc(l[0])}</span></div>`).join('')}</div>`).join('') : empty('Reports arrive weekly once previews begin.'))}</div></div>`; };

SHOW_TABS.bo = s => {
  const mine = isMine(s); const L = s.bo[s.bo.length - 1]; const B = s.bo.slice(-52); const pot = L ? L.pot : 0;
  const k = L ? `<div class="kpis">${kpi(tip('gross', 'Gross'), money(L.gross), L.pre ? 'preview week' : `week ${s.wks}`)}${kpi(tip('pot', 'Of potential'), pct(L.gross / pot), money(pot))}${kpi(tip('capacity', 'Capacity'), pct(L.cap), `${fmtNum(L.att)} tickets`)}${kpi(tip('avgt', 'Average ticket'), money(L.avg), `list ${money(s.pr.base)}`)}${kpi(xp('op', s.id, 'Operating'), `<span class="${L.op >= 0 ? 'good' : 'bad'}">${money(L.op)}</span>`, xp('be', s.id, `break-even ${money(breakEven(s))}`))}${kpi(xp('dem', s.id, 'Demand'), `${rnd(L.dem, 2)}×`, 'of seats at list price')}${kpi(tip('adv', 'Advance'), money(s.m.adv))}${kpi(tip('wom', 'Word of mouth'), Math.round(s.m.wom), `awareness ${pct(s.m.aware)}`)}</div>` : '';
  const chart = B.length > 1 ? card('Last 52 weeks', lineChart([{ n: 'Gross', v: B.map(b => b.gross) }, { n: 'Potential', v: B.map(b => b.pot), c: 'var(--faint)', dash: 1 }, { n: 'Operating', v: B.map(b => b.op), c: 'var(--good)' }], { fmt: v => money(v), labels: B.map(b => fmtDateShort(b.d)), h: 190, ref: 0 }) + lineChart([{ n: 'Capacity', v: B.map(b => b.cap * 100), c: 'var(--blue)' }, { n: 'Word of mouth', v: B.map(b => b.wom), c: 'var(--gold2)' }], { min: 0, max: 100, labels: B.map(b => fmtDateShort(b.d)), h: 130 })) : '';
  const pricing = mine && isActive(s) ? card('Pricing', `<div class="grid g2"><label class="fl">Average list price ($)<input type="number" id="pr_base" value="${s.pr.base}" min="20" max="1500"></label><label class="fl">Premium seats (share)<input type="number" id="pr_prem" value="${s.pr.prem}" step="0.01" min="0" max="0.4"></label><label class="fl">Premium price (× list)<input type="number" id="pr_px" value="${s.pr.premX}" step="0.1" min="1.2" max="5"></label><label class="fl">Discount depth (TKTS, codes)<input type="number" id="pr_disc" value="${s.pr.disc}" step="0.01" min="0" max="0.5"></label></div><label class="fl">Lottery / student rush seats (share of house, 0–0.10) — sold at ${money(lotPrice(s))}<input type="number" id="pr_lot" value="${s.pr.lot || 0}" step="0.01" min="0" max="0.1"></label><label class="chk"><input type="checkbox" id="pr_dyn" ${s.pr.dyn ? 'checked' : ''}> Dynamic pricing (raise prices into strong demand)</label><div class="row" style="margin-top:8px"><button class="btn p" data-a="price:${s.id}">Apply</button><span class="small muted">Typical list for this show: ${money(refPrice(s))}. Higher prices lose price-sensitive audiences first; deep discounts fill seats but lower the average ticket.</span></div>${G.me.del.price ? '<div class="note" style="margin-top:8px">Weekly pricing is delegated to your general manager.</div>' : ''}`) : '';
  const mkt = mine && isActive(s) ? card('Marketing', `<label class="fl">Weekly budget ($)<input type="number" id="mk_wk" value="${s.mkt.wk}" step="5000" min="0"></label><label class="fl">Campaign positioning${sel('mk_camp', Object.entries(CAMPAIGNS), s.mkt.camp)}</label><div class="small muted">Campaign fit now: ${sgn(campaignFit(s), v => rnd(v, 2))}. A “reviews” campaign only works if the reviews are good.</div><div class="grid g2" style="margin-top:8px">${Object.entries(MKT_CH).map(([k, [n, , seg]]) => `<label class="fl">${esc(n)} <span class="tiny">→ ${esc(SEGS[seg].n.toLowerCase())}</span><input type="number" id="mk_${k}" value="${rnd(s.mkt.ch[k] * 100, 0)}" min="0" max="100"></label>`).join('')}</div><label class="chk"><input type="checkbox" id="mk_auto" ${s.mkt.auto ? 'checked' : ''}> Let my marketing executive adjust the budget (when delegated)</label><div class="row" style="margin-top:8px"><button class="btn p" data-a="mkt:${s.id}">Apply</button><span class="small muted">Channel weights are normalized.</span></div>`) : '';
  const wk = card('Weekly grosses', table('bo' + s.id, [{ k: 'd', l: 'Week ending', f: b => fmtDate(b.d) + (b.pre ? ' <span class="chip xs">previews</span>' : '') + (b.so ? ' <span class="chip r xs">star out</span>' : ''), s: b => b.d }, { k: 'gross', l: 'Gross', n: 1, f: b => money(b.gross), s: b => b.gross }, { k: 'pot', l: '% pot.', n: 1, f: b => pct(b.gross / b.pot), s: b => b.gross / b.pot }, { k: 'cap', l: 'Cap.', n: 1, f: b => pct(b.cap), s: b => b.cap }, { k: 'avg', l: 'Avg $', n: 1, f: b => money(b.avg), s: b => b.avg }, { k: 'mkt', l: 'Marketing', n: 1, f: b => money(b.mkt), s: b => b.mkt }, { k: 'op', l: 'Operating', n: 1, f: b => `<span class="${b.op >= 0 ? 'good' : 'bad'}">${money(b.op)}</span>`, s: b => b.op }], s.bo.slice().reverse(), { def: { ps: 15 } }), { np: 1 });
  const close = mine && s.stage === 'run' ? card('Closing', s.notice ? `<p>Final performance ${fmtDate(s.notice)} (${esc(s.noticeWhy || '')}).</p>${s.noticeWhy === 'closing notice posted' || s.noticeWhy === 'your stop-loss rule' ? `<button class="btn" data-a="rescind:${s.id}">Withdraw the notice</button>` : s.noticeWhy && /stop clause/.test(s.noticeWhy) ? `<button class="btn" data-a="cure:${s.id}">Cure the stop clause</button>` : ''}` : `<div class="row wrap"><button class="btn" data-a="why:close:${s.id}">Should it close?</button><button class="btn d" data-a="closenotice:${s.id}">Post closing notice</button></div>`) + stopLossUI(s) : '';
  return `${k}<div class="grid g2"><div class="col">${chart}${wk}</div><div class="col">${pricing}${mkt}${close}</div></div>`;
};
ACTIONS.price = a => res(setPricing(+a[0], { base: fv('pr_base'), prem: fv('pr_prem'), premX: fv('pr_px'), disc: fv('pr_disc'), dyn: fv('pr_dyn'), lot: fv('pr_lot') }));
ACTIONS.mkt = a => { const ch = {}; for (const k in MKT_CH) ch[k] = (+fv('mk_' + k) || 0) / 100; const r = setMarketing(+a[0], { wk: fv('mk_wk'), camp: fv('mk_camp'), ch }); if (r.ok) SH(+a[0]).mkt.auto = +fv('mk_auto'); res(r); };

  ${card('Ready for development', (() => { const R = mine.filter(s => s.stage === 'dev' && !s.act); return R.length ? `<div class="list">${R.map(s => `<div class="li"><div style="flex:1;min-width:0">${shl(s)}<div class="tiny muted">${s.dev.readings} readings · ${s.dev.workshops} workshops · ${s.dev.labs} labs · ${s.rw} rewrites</div></div><button class="btn xs" data-a="act:${s.id}:reading">Reading</button><button class="btn xs" data-a="act:${s.id}:workshop">Workshop</button></div>`).join('')}</div>` : empty('No projects waiting.'); })(), { np: 1 })}</div>
  ${card('Recent notes', fb.length ? fb.map(({ s, f }) => `<div class="ddrow fb" style="padding:8px 14px"><div class="row">${shl(s)}<b class="small">${esc(f.t)}</b><span class="tiny muted">${fmtDate(f.d)}</span>${f.aud != null ? `<span class="chip xs">audience ${f.aud}</span>` : ''}</div>${f.lines.map(l => `<div class="ln small"><span class="${l[1]}">${esc(l[0])}</span></div>`).join('')}</div>`).join('') : empty('Nothing yet.'), { np: 1 })}`); };
VIEWS.graveyard = () => { const L = G.hist.grave.slice().reverse(); const rev = cheat('reveal');
  return page('Development Graveyard', `${L.length} shelved projects`, '', card('Shelved and abandoned', L.length ? `<div class="tw"><table class="t"><tr><th>Project</th><th>Type</th><th>Shelved</th><th>Why</th><th class="n">Spent</th><th class="n">Your read</th>${rev ? '<th class="n">True script</th>' : ''}<th></th></tr>${L.map(g => { const s = SH(g.sid); return `<tr><td>${s ? shl(s) : esc(g.n)}</td><td>${esc(PTYPES[g.type] ? PTYPES[g.type].n : '')}</td><td>${fmtDate(g.d)}</td><td class="small">${esc(g.why)}</td><td class="n">${money(g.spent)}</td><td class="n">${g.est ?? '—'}</td>${rev ? `<td class="n">${g.true_}</td>` : ''}<td class="acts">${s && s.stage === 'dead' && isMine(s) ? `<button class="btn xs" data-a="revive:${s.id}">Revive</button>` : ''}</td></tr>`; }).join('')}</table></div>` : empty('Nothing buried here — yet.'), { np: 1 })); };
// ---------- investor pitching & co-producers ----------
ACTIONS.pitch = a => { const s = SH(+a[0]); UI.pitch = { sid: s.id, sel: new Set() }; openModal({ title: () => `Pitch investors — ${esc(s.n)}`, xw: 1, body: pitchBody, foot: () => `<span class="small muted">Still needed ${money(Math.max(0, s.fin.target - raisedOf(s)))}</span><button class="btn" data-a="closemodal">Close</button><button class="btn p" data-a="pitchgo">Pitch selected</button>` }); };
function pitchBody() { const P = UI.pitch; const s = SH(P.sid); const f = F('pit'); let L = G.inv.filter(v => v.st === 'active' && v.cap >= v.min && !s.fin.com.some(c => c.k === 'inv' && c.id === v.id)); if (f.t) L = L.filter(v => v.t === f.t); if (f.q) L = L.filter(v => v.n.toLowerCase().includes(f.q.toLowerCase()));
  const need = Math.max(0, s.fin.target - raisedOf(s));
  return `<div class="fbar">${fq('pit', 'Name…')}${flt('pit', 't', Object.entries(INV_TYPES).map(([k, v]) => [k, v[0]]), 'All investor types')}<label class="small">Ask each for <input type="number" id="pit_ask" value="${Math.round(Math.max(25e3, need / 8) / 5e3) * 5e3}" step="5000" style="width:110px"> (or blank = their comfortable size)</label></div>${table('pit', [
    { k: 'sel', l: '', nosort: 1, f: v => `<input type="checkbox" data-ch="pitsel:${v.id}" ${P.sel.has(v.id) ? 'checked' : ''} aria-label="Select ${esc(v.n)}">` }, { k: 'n', l: 'Investor', f: v => invl(v), s: v => v.n }, { k: 't', l: 'Type', f: v => esc(INV_TYPES[v.t][0]), s: v => v.t },
    { k: 'i', l: 'Interest', n: 1, f: v => xp('inv', `${v.id}|${s.id}`, Math.round(invInterest(v, s))), s: v => invInterest(v, s) }, { k: 'o', l: 'Odds', n: 1, f: v => oddsChip(sig((invInterest(v, s) - 50) / 9) * D_('fund') / sl('fund')), s: v => invInterest(v, s) }, { k: 'cap', l: 'Available', n: 1, f: v => money(v.cap), s: v => v.cap }, { k: 'min', l: 'Minimum', n: 1, f: v => money(v.min), s: v => v.min },
    { k: 'rel', l: 'Relationship', n: 1, f: v => Math.round(v.rel), s: v => v.rel }, { k: 'mem', l: 'History with you', f: v => v.mem.length ? `${rnd(avg(v.mem, x => x.mult), 2)}× on ${v.mem.length}` : '<span class="faint">—</span>', s: v => v.mem.length }, { k: 'p', l: 'Status', f: v => G.offers.some(o => !o.st && o.k === 'inv' && o.inv === v.id && o.sid === s.id) ? '<span class="warn">pitched</span>' : (v.lastAsk || 0) > G.day - 14 ? '<span class="faint">wait</span>' : '', nosort: 1 },
  ], L, { def: { sort: 'i', dir: -1, ps: 15 } })}`; }
ACTIONS.pitsel = a => { const P = UI.pitch; const id = +a[0]; if (+a[1]) P.sel.add(id); else P.sel.delete(id); };
ACTIONS.pitchgo = () => { const P = UI.pitch; if (!P.sel.size) return toast('Select investors to pitch.'); const ask = +fv('pit_ask'); const r = pitchMany(P.sid, [...P.sel], ask > 0 ? ask : null); P.sel = new Set(); res(r); };
ACTIONS.copro = a => { const s = SH(+a[0]); if (!s.fin || s.fin.broke) return toast('Co-producers join while you are raising the capitalization.'); const need = Math.max(0, s.fin.target - raisedOf(s)); const L = G.rv.filter(r => !r.dead && r.arch !== 'np').sort((x, y) => invInterestRival(y, s) - invInterestRival(x, s));
  openModal({ title: `Invite a co-producer — ${esc(s.n)}`, w: 1, body: `<p class="small">Co-producers bring capital for billing and a share of the producer pool (your half of profits after recoupment). Current pool given away: ${pct(sum(s.co, c => c.pct))}.</p><div class="grid g2"><label class="fl">Amount ($)<input type="number" id="cp_amt" value="${Math.round(Math.max(250e3, need * 0.25) / 5e4) * 5e4}" step="50000"></label><label class="fl">Pool share offered (0.01–0.5)<input type="number" id="cp_sh" value="0.1" step="0.01" min="0.01" max="0.5"></label></div><div class="tw"><table class="t"><tr><th>Producer</th><th>Style</th><th class="n">Interest</th><th class="n">Relationship</th><th class="n">Cash</th><th></th></tr>${L.map(r => `<tr><td>${rvl(r)}</td><td class="small">${esc(RIVAL_ARCH[r.arch])}</td><td class="n">${Math.round(invInterestRival(r, s))}</td><td class="n">${Math.round(r.rel)}</td><td class="n">${money(r.cash)}</td><td class="acts"><button class="btn xs p" data-a="coprogo:${s.id}:${r.id}">Invite</button></td></tr>`).join('')}</table></div>` }); };
ACTIONS.coprogo = a => { const r = offerCoPro(+a[0], +a[1], fv('cp_amt'), fv('cp_sh')); if (r.ok) closeModal(); res(r); };

/* ===================== Business: finance, investors, theaters, marketing, box office, tours, licensing ===================== */
VIEWS.finance = () => {
  const L = G.me.ledger; const y = curYear(); const cat = l => l[2].split(':')[0]; const byY = {}; for (const l of L) if (dateOf(l[0]).y === y) byY[cat(l)] = (byY[cat(l)] || 0) + l[1];
  const inc = Object.entries(byY).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]), exp = Object.entries(byY).filter(([, v]) => v < 0).sort((a, b) => a[1] - b[1]); const H = G.me.hist.slice(-48);
  const T = tabs('fin', [['sum', 'Summary'], ['ledger', 'Ledger'], ['shows', 'Production accounts']]);
  let body = '';
  if (T.cur === 'sum') body = `<div class="kpis">${kpi(tip('cash', 'Company cash'), money(G.me.cash), `credit line ${money(creditLimit())}`, G.me.cash < 0 ? 'bad' : '')}${kpi(tip('pcash', 'Personal'), money(G.me.pcash))}${kpi('Company value', money(companyValue()))}${kpi('Monthly overhead', money(officeCost() + staffCost()), `${OFFICE[G.me.office][0]} · ${G.me.staff.length} staff`)}${kpi('Investment returns', money(G.me.stats.invRet), 'all time')}${kpi(tip('pool', 'Producer profits'), money(G.me.stats.prodShare), 'all time')}</div>
    <div class="grid g2">${card(`${y} income`, inc.length ? barChart(inc.map(([k, v]) => ({ l: k, v })), { fmt: v => money(v) }) : empty('No income yet this year.'))}${card(`${y} spending`, exp.length ? barChart(exp.slice(0, 12).map(([k, v]) => ({ l: k, v: -v, c: 'var(--bad)' })), { fmt: v => money(v) }) : empty('No spending yet this year.'))}</div>
    <div class="grid g2">${card('Cash over time', H.length > 1 ? lineChart([{ n: 'Company', v: H.map(x => x.cash) }, { n: 'Personal', v: H.map(x => x.pcash), c: 'var(--blue)' }, { n: 'Company value', v: H.map(x => x.val), c: 'var(--good)', dash: 1 }], { fmt: v => money(v), labels: H.map(x => fmtDateShort(x.d)), h: 180, ref: 0 }) : empty('Builds monthly.'))}
    ${card('Personal & company', `${stat('Monthly salary draw', money(G.me.draw))}<div class="row wrap" style="margin-top:6px"><label class="small">Draw per month <input type="number" id="drawamt" value="${G.me.draw}" step="1000" style="width:110px"></label><button class="btn sm" data-a="setdraw">Set</button></div><div class="row wrap" style="margin-top:10px"><label class="small">Move personal money into the company <input type="number" id="p2c" value="${Math.round(Math.max(0, G.me.pcash) / 2 / 1e3) * 1e3}" step="1000" style="width:120px"></label><button class="btn sm" data-a="p2c">Transfer</button></div>${(G.me.mort || []).length ? `<h4 class="small up" style="margin-top:12px">Debts</h4>${G.me.mort.map(m => stat(m.th != null ? `Mortgage: ${esc(TH(m.th).n)}` : 'Legacy debt', `${money(m.bal)} · ${money(m.pay)}/mo`)).join('')}` : ''}<div class="small muted" style="margin-top:8px">A negative company balance draws on the credit line at about 11% a year.</div>`)}</div>`;
  else if (T.cur === 'ledger') body = card('Ledger', table('ledger', [{ k: 'd', l: 'Date', f: l => fmtDate(l[0]), s: l => l[0] }, { k: 't', l: 'Item', f: l => esc(l[2]) + (l[3] != null && SH(l[3]) ? ' · ' + shl(l[3], { poster: false }) : ''), s: l => l[2] }, { k: 'a', l: 'Amount', n: 1, f: l => `<span class="${l[1] >= 0 ? 'good' : 'bad'}">${money(l[1], false)}</span>`, s: l => l[1] }], L.slice().reverse(), { def: { ps: 40 }, noun: 'entries' }), { np: 1 });
  else body = card('Production entities', table('prodacc', [{ k: 'n', l: 'Production', f: s => shl(s), s: s => s.n }, { k: 'st', l: 'Stage', f: s => stageChip(s), s: s => s.stage }, { k: 'r', l: 'Raised', n: 1, f: s => money(s.fin.raised || raisedOf(s)), s: s => s.fin.raised || 0 }, { k: 'b', l: 'Account', n: 1, f: s => `<span class="${s.fin.bank < 0 ? 'bad' : ''}">${money(s.fin.bank)}</span>`, s: s => s.fin.bank }, { k: 'd', l: 'Returned', n: 1, f: s => `${money(s.fin.dist)} (${pct(s.fin.dist / (s.fin.raised || 1))})`, s: s => s.fin.dist / (s.fin.raised || 1) }, { k: 'l', l: 'Loans', n: 1, f: s => s.fin.loan ? `<span class="bad">${money(s.fin.loan)}</span>` : '', s: s => s.fin.loan }, { k: 'rp', l: 'Last report', f: s => s.fin.broke ? fmtDate(s.fin.lastRep) : '', s: s => s.fin.lastRep }], myShows(true).filter(s => s.fin), { def: { ps: 30 } }), { np: 1 });
  return page('Finance', `${esc(G.me.co || G.me.n)}`, '', T.html + body);
};
ACTIONS.setdraw = () => { const v = +fv('drawamt'); if (!isFinite(v) || v < 0) return toast('Enter an amount.'); G.me.draw = Math.round(v); toast(`Monthly draw set to ${money(G.me.draw)}.`); render(); };
ACTIONS.p2c = () => res(personalToCompany(fv('p2c')));
VIEWS.investors = () => { const f = F('inv'); let L = G.inv.filter(v => v.st === 'active'); if (f.t) L = L.filter(v => v.t === f.t); if (f.q) L = L.filter(v => v.n.toLowerCase().includes(f.q.toLowerCase())); if (f.mine) L = L.filter(v => v.mem.length || G.shows.some(s => s && isMine(s) && s.fin && s.fin.com.some(c => c.k === 'inv' && c.id === v.id)));
  const inbound = G.offers.filter(o => !o.st && (o.k === 'invIn' && o.shown || o.k === 'coIn' || o.k === 'coInv'));

  <div class="fbar">${fq('inv', 'Name…')}${flt('inv', 't', Object.entries(INV_TYPES).map(([k, v]) => [k, v[0]]), 'All types')}${fchk('inv', 'mine', 'Invested with you')}</div>${card('Investor directory', table('invs', [
    { k: 'n', l: 'Investor', f: v => invl(v), s: v => v.n }, { k: 't', l: 'Type', f: v => esc(INV_TYPES[v.t][0]), s: v => v.t }, { k: 'cap', l: 'Available', n: 1, f: v => money(v.cap), s: v => v.cap }, { k: 'min', l: 'Minimum', n: 1, f: v => money(v.min), s: v => v.min }, { k: 'risk', l: 'Risk appetite', n: 1, f: v => pct(v.risk), s: v => v.risk },
    { k: 'pref', l: 'Prefers', f: v => v.pref === 'mus' ? 'Musicals' : v.pref === 'play' ? 'Plays' : 'Anything', s: v => v.pref }, { k: 'rel', l: 'Relationship', n: 1, f: v => Math.round(v.rel), s: v => v.rel }, { k: 'mem', l: 'With you', f: v => v.mem.length ? `${v.mem.length} shows · ${rnd(avg(v.mem, x => x.mult), 2)}×` : '', s: v => v.mem.length },
  ], L, { def: { sort: 'rel', dir: -1, ps: 30 } }), { np: 1 })}`); };
VIEWS.investor = p => { const v = INV(p.id); if (!v) return page('Not found', '', '', ''); const now = G.shows.filter(s => s && !s.cat && s.fin && s.fin.com.some(c => c.k === 'inv' && c.id === v.id));

VIEWS.theaters = () => { const f = F('th'); let L = G.th.slice(); if (f.mine) L = L.filter(t => t.org === -1); if (f.dark) L = L.filter(t => thAvail(t).ok);

  const L = G.rv.filter(r => !r.dead && r.arch !== 'np' && r.arch !== 'corp').map(r => ({ r, q: rivalAsk(r) }));
  return `${card('Buy a production company', `<p class="small" style="padding:12px 14px 4px;margin:0">Buying a rival brings its running shows, projects in development, rights holdings and cash onto your books — and its debts. Price reflects cash, current profits, the development slate and reputation; distressed companies sell cheap. Other producers will be a little warier of you afterwards.</p>` + table('acq', [
    { k: 'n', l: 'Company', f: o => rvl(o.r), s: o => o.r.n }, { k: 'a', l: 'Type', f: o => `<span class="small">${esc(RIVAL_ARCH[o.r.arch])}</span>`, s: o => o.r.arch }, { k: 'rep', l: 'Rep.', n: 1, f: o => Math.round(o.r.rep), s: o => o.r.rep }, { k: 'c', l: 'Cash', n: 1, f: o => `<span class="${o.r.cash < 0 ? 'bad' : ''}">${money(o.r.cash)}</span>`, s: o => o.r.cash },
    { k: 'sh', l: 'Shows', n: 1, f: o => o.q.err ? '—' : `${o.q.run} running · ${o.q.shows - o.q.run} dev`, s: o => o.q.shows || 0 }, { k: 'p', l: 'Asking', n: 1, f: o => o.q.err ? `<span class="small muted">${esc(o.q.err)}</span>` : money(o.q.price), s: o => o.q.price || 1e15 },
    { k: 'go', l: '', nosort: 1, cls: 'acts', f: o => o.q.err ? '' : `<button class="btn xs p" data-a="acquire:${o.r.id}">Buy</button>` }], L, { def: { sort: 'p', dir: 1, ps: 20 } }), { np: 1 })}
  ${(G.me.acq || []).length ? card('Your acquisitions', G.me.acq.map(a => stat(esc(a.n), `${fmtDate(a.d)} · ${money(a.price)} · ${plural(a.shows, 'production')}`)).join('')) : ''}`; }
ACTIONS.acquire = a => { const rv = RV(+a[0]); const q = rivalAsk(rv); if (q.err) return res(q); confirmBox(`Buy <b>${esc(rv.n)}</b> for <b>${money(q.price)}</b>${q.debt ? `, assuming ${money(-q.debt)} of debt` : rv.cash > 0 ? ` (you also take over its ${money(rv.cash)} in cash)` : ''}? ${plural(q.shows, 'production')} and ${plural(q.rights, 'rights holding')} come with it.`, () => res(acquireRival(rv.id))); };

/* ===================== Big moments: opening night, nominations, the ceremony ===================== */
function momentSpecial(mo) {
  if (mo.k === 'opening' && mo.sid != null && SH(mo.sid) && SH(mo.sid).reviews.length) { UI.modal = null; UI.opn = { sid: mo.sid, i: 0 }; openModal({ title: () => `Opening night — ${esc(SH(UI.opn.sid).n)}`, w: 1, body: openingBody, foot: openingFoot }); return true; }
  if (mo.k === 'ceremony' && mo.y && G.awards.find(a => a.y === mo.y)) { UI.modal = null; UI.cer = { y: mo.y, i: -1 }; openModal({ title: () => `The ${UI.cer.y} Marquee Awards`, w: 1, body: cerBody, foot: cerFoot }); return true; }
  if (mo.k === 'noms' && mo.y && G.aw.cur && G.aw.cur.y === mo.y) { UI.modal = null; openModal({ title: `${mo.y} Marquee Award nominations`, w: 1, body: () => nomsBody(mo.y), foot: '<button class="btn" data-a="nav:awards">Awards page</button><button class="btn p" data-a="closemodal">Continue</button>' }); return true; }
  return false;
}
function openingBody() { const O = UI.opn; const s = SH(O.sid); const R = s.reviews.slice().sort((a, b) => CRT(a.c).infl - CRT(b.c).infl); const shown = R.slice(0, O.i + 1); const done = O.i >= R.length - 1;
  return `<div class="moment" style="padding:16px 10px 8px"><div class="k">The reviews are in</div><div class="orn">❦</div><p>${esc(s.openTh || (TH(s.th) ? TH(s.th).n : ''))}${s.openTh || TH(s.th) ? ' · ' : ''}${fmtDate(s.openD, true)}</p></div>${shown.slice().reverse().map(r => { const c = CRT(r.c); return `<div class="revc"><div class="row"><span class="pub">${esc(c.pub)}</span><span class="vd ${verdict(r.ov)}">${verdict(r.ov)}</span></div><div class="hq">“${esc(r.head)}”</div><p class="review" style="margin:4px 0 0;font-size:14px">${esc(r.txt)}</p></div>`; }).join('')}${done ? `<div class="cer" style="padding:18px"><div class="cat">Consensus</div><h2>${esc(s.consL)}</h2><p class="muted">${Math.round(s.cons)}/100 across ${s.reviews.length} critics. The box office will tell the rest.</p></div>` : ''}`; }
function openingFoot() { const O = UI.opn; const s = SH(O.sid); const done = O.i >= s.reviews.length - 1; return done ? `<button class="btn" data-a="show:${s.id}:reviews">All reviews</button><button class="btn p" data-a="closemodal">Continue</button>` : `<button class="btn ghost" data-a="opnall">Skip to consensus</button><button class="btn p" data-a="opnnext" autofocus>Next review (${O.i + 2} of ${s.reviews.length})</button>`; }
ACTIONS.opnnext = () => { UI.opn.i++; refreshModal(); }; ACTIONS.opnall = () => { UI.opn.i = 999; refreshModal(); };
function nomsBody(y) { const cur = G.aw.cur; const mine = []; for (const c of AWARD_CATS) for (const n of cur.noms[c[0]] || []) if (isMine(SH(n.sid))) mine.push([c, n]);
  return `<div class="cer"><div class="cat">Nominations</div><h2>${mine.length ? `${plural(mine.length, 'nomination')} for your productions` : 'Not this year'}</h2></div>${mine.length ? card('Your nominations', mine.map(([c, n]) => stat(esc(c[1]), `${n.pid != null ? pl(n.pid) + ' · ' : ''}${shl(n.sid, { poster: false })}`)).join('')) : ''}${['musical', 'play'].map(k => { const c = AWARD_CATS.find(x => x[0] === k); const N = cur.noms[k] || []; return N.length ? card(esc(c[1]), N.map(n => `<div class="ln small"><span>${shl(n.sid, { poster: false })}</span><span class="muted">${ownerName(SH(n.sid).own)}</span></div>`).join('')) : ''; }).join('')}<div class="small muted">Nominated shows can still buy campaign items — including the ceremony performance slot — until ${fmtDate(dayOf(y, 6, 7))}.</div>`; }
function cerCats() { const a = G.awards.find(x => x.y === UI.cer.y); const order = AWARD_CATS.map(c => c[0]).filter(k => a.win[k]); const big = ['musical', 'play', 'revMusical', 'revPlay']; return order.filter(k => !big.includes(k)).concat(big.filter(k => order.includes(k))).map(k => [k, a]); }
function cerBody() { const C = UI.cer; const L = cerCats(); const a = G.awards.find(x => x.y === C.y);
  if (C.i < 0) return `<div class="cer"><div class="cat">Live from the ${C.y} ceremony</div><h2>The house lights dim.</h2><p class="muted">${L.length} categories tonight. Your productions are nominated in ${L.filter(([k]) => (a.noms[k] || []).some(n => isMine(SH(n.sid)))).length}.</p></div>`;
  if (C.i >= L.length) { const mine = L.filter(([k]) => isMine(SH(a.win[k].sid))); return `<div class="cer"><div class="cat">Final curtain</div><h2>${mine.length ? `${plural(mine.length, 'award')} for you tonight` : 'Not your night'}</h2></div>${card('Winners', L.map(([k]) => { const w = a.win[k]; return stat(esc(AWARD_CATS.find(c => c[0] === k)[1]), `${w.pid != null ? pl(w.pid) + ' · ' : ''}${shl(w.sid, { poster: false })}${isMine(SH(w.sid)) ? ' <span class="chip gold xs">YOURS</span>' : ''}`); }).join(''))}`; }
  const [k] = L[C.i]; const cat = AWARD_CATS.find(c => c[0] === k); const N = a.noms[k] || []; const w = a.win[k]; const rev = C.rev;
  return `<div class="cer"><div class="cat">${C.i + 1} of ${L.length}</div><h2>${esc(cat[1])}</h2><p class="muted">The nominees are…</p>${N.map(n => { const isW = rev && n.sid === w.sid && n.pid === w.pid; return `<div class="nom ${isW ? 'w' : ''}">${isW ? '★ ' : ''}${n.pid != null ? esc(pName(PP(n.pid))) + ', ' : ''}<i>${esc(SH(n.sid).n)}</i>${isMine(SH(n.sid)) ? ' <span class="chip gold xs">YOURS</span>' : ''}</div>`; }).join('')}${rev ? `<p class="env" style="margin-top:14px">And the Marquee goes to… ${w.pid != null ? esc(pName(PP(w.pid))) + ', ' : ''}${esc(SH(w.sid).n)}.</p>` : '<p class="env" style="margin-top:14px">The envelope, please…</p>'}</div>`; }
function cerFoot() { const C = UI.cer; const L = cerCats(); if (C.i >= L.length) return '<button class="btn" data-a="nav:awards">Awards page</button><button class="btn p" data-a="closemodal">Continue</button>'; return `<button class="btn ghost" data-a="cerskip">Skip to the winners</button><button class="btn p" data-a="cernext" autofocus>${C.i < 0 ? 'Begin' : C.rev ? (C.i === L.length - 1 ? 'Finish' : 'Next category') : 'Open the envelope'}</button>`; }
ACTIONS.cernext = () => { const C = UI.cer; if (C.i < 0 || C.rev) { C.i++; C.rev = 0; } else C.rev = 1; refreshModal(); };
ACTIONS.cerskip = () => { UI.cer.i = 999; UI.cer.i = cerCats().length; refreshModal(); };
</script>
</body>
