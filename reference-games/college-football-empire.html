<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Football Empire</title>
<meta name="description" content="College Football Empire — Build the program. Win the recruiting war. Rule Saturdays. An offline college football management simulation.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23131a24'/%3E%3Cellipse cx='32' cy='32' rx='22' ry='13' transform='rotate(-35 32 32)' fill='%238a4b22'/%3E%3Cpath d='M22 38l20-12' stroke='%23fff' stroke-width='2.4'/%3E%3C/svg%3E">
<style>:root{
  --bg:#0a0e14; --bg2:#0e131b; --panel:#131a24; --panel2:#18212d; --panel3:#1f2a38; --line:#232e3d; --line2:#2f3b4d; --tc1:#d2a35a; --tc2:#fff; --turf:#1f5a32;
  --text:#eee9df; --text2:#d0cabf; --muted:#8e97a6; --faint:#626b7a;
  --gold:#d2a35a; --gold2:#e8c17d; --goldbg:rgba(210,163,90,.12);
  --good:#6fbf8e; --goodbg:rgba(111,191,142,.12); --bad:#d9776b; --badbg:rgba(217,119,107,.12); --warn:#d8b25a; --warnbg:rgba(216,178,90,.12); --blue:#7fa3d1; --bluebg:rgba(127,163,209,.12);
  --r:10px; --r2:6px; --sh:0 10px 30px rgba(0,0,0,.35); --font:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
a{color:var(--gold2);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.num,td.n,.kpi .v{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .gold{color:var(--gold)} .blue{color:var(--blue)}
.small{font-size:12px} .tiny{font-size:11px} .big{font-size:18px} .b{font-weight:600} .up{text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;gap:10px;align-items:center} .row.wrap{flex-wrap:wrap} .col{display:flex;flex-direction:column;gap:8px} .sp{flex:1} .right{margin-left:auto}
.grid{display:grid;gap:14px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.hide{display:none!important}
/* shell */
#app{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr);height:100vh}
.side{grid-row:1/3;background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.brand .wm{font-family:var(--serif);font-size:19px;letter-spacing:.18em;color:var(--gold2)}
.brand .tg{font-size:10.5px;color:var(--faint);letter-spacing:.04em;margin-top:2px}
.agchip{display:flex;align-items:center;gap:9px;margin:12px 12px 4px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.agchip .lg{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:11.5px;color:#111;flex:none}
.agchip .an{font-weight:600;font-size:13px;line-height:1.2} .agchip .ar{font-size:11px;color:var(--muted)}
.nav{padding:6px 8px 16px}
.nav h6{margin:14px 10px 4px;font-size:10.5px;letter-spacing:.14em;color:var(--faint);font-weight:600}
.nav a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;color:var(--text2);font-size:13px;text-decoration:none}
.nav a:hover{background:var(--panel);color:var(--text)}
.nav a.on{background:var(--goldbg);color:var(--gold2)}
.nav a .bd{margin-left:auto;background:var(--gold);color:#111;border-radius:9px;font-size:10.5px;padding:0 6px;font-weight:700;min-width:18px;text-align:center}
.nav a .bd.r{background:var(--bad);color:#fff}
.top{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg2);min-width:0}
.clock{display:flex;align-items:center;gap:8px;min-width:0}
.date{font-weight:600;white-space:nowrap} .date small{display:block;font-weight:400;color:var(--muted);font-size:11px;line-height:1}
.speed{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.speed button{background:var(--panel);border:0;border-right:1px solid var(--line);padding:6px 9px;cursor:pointer;color:var(--text2);font-size:12px;min-width:32px}
.speed button:last-child{border-right:0}
.speed button.on{background:var(--gold);color:#111;font-weight:700}
.speed button:hover:not(.on){background:var(--panel3)}
.search{position:relative;flex:1;max-width:460px;min-width:120px}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px 7px 30px;outline:0}
.search input:focus{border-color:var(--gold)}
.search input[type=search]{padding-left:30px;width:100%}
.search svg{position:absolute;left:9px;top:9px;opacity:.5}
.sres{position:absolute;top:38px;left:0;right:0;background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--sh);max-height:70vh;overflow:auto;z-index:50}
.sres .it{display:flex;gap:10px;align-items:center;padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.sres .it:hover,.sres .it.sel{background:var(--panel3)}
.sres .grp{padding:6px 10px;font-size:10.5px;letter-spacing:.12em;color:var(--faint);background:var(--bg2)}
.tstat{display:flex;gap:14px;align-items:center;margin-left:auto;white-space:nowrap}
.tstat .s{font-size:11px;color:var(--muted);line-height:1.1} .tstat .s b{display:block;color:var(--text);font-size:13px}
.ibtn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer;position:relative}
.ibtn .dot{position:absolute;top:-5px;right:-6px;background:var(--bad);color:#fff;font-size:10px;border-radius:8px;padding:0 5px;font-weight:700}
.main{overflow-y:auto;min-width:0;background:var(--bg)}
.page{padding:18px 22px 60px;max-width:1500px;margin:0 auto}
.ph{display:flex;align-items:flex-end;gap:14px;margin:4px 0 16px;flex-wrap:wrap}
.ph h1{font-family:var(--serif);font-weight:500;font-size:26px;margin:0;letter-spacing:.01em}
.ph .sub{color:var(--muted);font-size:13px;margin-top:3px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:6px} .crumb a{color:var(--muted)}
/* panels */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card>.hd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line)}
.card>.hd h3{margin:0;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);font-weight:600}
.card>.hd .a{margin-left:auto;font-size:12px}
.card>.bd{padding:12px 14px}
.card>.bd.np{padding:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.kpi .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:11.5px;color:var(--muted)}
/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{position:sticky;top:0;background:var(--panel2);text-align:left;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.t th.n,table.t td.n{text-align:right;white-space:nowrap}
table.t th .ar{opacity:.7;margin-left:3px}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:hover td{background:rgba(255,255,255,.018)}
table.t tr.sel td{background:var(--goldbg)}
table.t td.nm{white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:8px 12px;font-size:12px;color:var(--muted)}
/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--text);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--panel3);text-decoration:none}
.btn.p{background:var(--gold);border-color:var(--gold);color:#15130e;font-weight:600}
.btn.p:hover{background:var(--gold2)}
.btn.d{border-color:rgba(217,119,107,.5);color:var(--bad)}
.btn.g{border-color:rgba(111,191,142,.45);color:var(--good)}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:6px}
.btn.xs{padding:1px 6px;font-size:11px;border-radius:5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)} .btn.ghost:hover{color:var(--text);background:var(--panel2)}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:7px;padding:6px 9px;outline:0;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{width:100%;min-height:90px;resize:vertical}
input[type=range]{accent-color:var(--gold);width:100%}
input[type=checkbox],input[type=radio]{accent-color:var(--gold)}
label.chk{display:flex;gap:8px;align-items:flex-start;cursor:pointer;padding:3px 0}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--panel);border:0;border-right:1px solid var(--line2);padding:5px 11px;cursor:pointer;font-size:12.5px;color:var(--text2)}
.seg button:last-child{border-right:0} .seg button.on{background:var(--goldbg);color:var(--gold2)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 13px;cursor:pointer;color:var(--muted);font-size:13px;white-space:nowrap}
.tabs button.on{color:var(--gold2);border-bottom-color:var(--gold)}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fbar select,.fbar input{font-size:12.5px;padding:5px 8px}
/* chips & bars */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line2);color:var(--text2);white-space:nowrap;background:var(--bg2)}
.chip.g{border-color:rgba(111,191,142,.4);color:var(--good)} .chip.r{border-color:rgba(217,119,107,.45);color:var(--bad)} .chip.y{border-color:rgba(216,178,90,.45);color:var(--warn)} .chip.gold{border-color:rgba(200,164,92,.5);color:var(--gold2);background:var(--goldbg)} .chip.b{border-color:rgba(127,163,209,.45);color:var(--blue)}
.real{font-size:9.5px;padding:0 5px;border-radius:4px;border:1px solid rgba(127,163,209,.5);color:var(--blue);letter-spacing:.05em;vertical-align:1px}
.fic{font-size:9.5px;padding:0 5px;border-radius:4px;border:1px solid var(--line2);color:var(--faint);letter-spacing:.05em;vertical-align:1px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.bar.g i{background:var(--good)} .bar.r i{background:var(--bad)} .bar.y i{background:var(--warn)}
.rating{display:inline-flex;align-items:center;gap:6px;min-width:84px}
.rating .bar{flex:1}
.xp{cursor:help;border-bottom:1px dotted var(--faint)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;color:#111}
.av.lg{width:64px;height:64px;font-size:21px}
.list .li{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.list .li:hover{background:rgba(255,255,255,.015)}
.pri2{border-left:3px solid var(--bad)} .pri1{border-left:3px solid var(--warn)} .pri0{border-left:3px solid transparent}
.empty{padding:26px;text-align:center;color:var(--muted)}
.note{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px;color:var(--text2)}
.note.gold{border-color:rgba(200,164,92,.35);background:var(--goldbg)}
.disc{font-size:11.5px;color:var(--muted);border:1px dashed var(--line2);border-radius:8px;padding:8px 10px;margin:10px 0}
.stat{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.stat:last-child{border-bottom:0} .stat .k{color:var(--muted)}
.msg{white-space:pre-wrap}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(5,7,10,.66);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--sh);width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.w{width:min(980px,100%)} .modal.xw{width:min(1200px,100%)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mh h2{margin:0;font-size:17px;font-weight:600}
.modal .mb{padding:16px 18px;overflow-y:auto}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.moment{text-align:center;padding:34px 30px 26px;background:radial-gradient(ellipse at top,rgba(200,164,92,.16),transparent 65%)}
.moment.bad{background:radial-gradient(ellipse at top,rgba(217,119,107,.14),transparent 65%)}
.moment .k{font-size:11px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.moment.bad .k{color:var(--bad)}
.moment h2{font-family:var(--serif);font-weight:500;font-size:30px;margin:12px 0 8px;line-height:1.15}
.moment p{color:var(--text2);margin:0 0 18px}
@media (prefers-reduced-motion:no-preference){.moment{animation:mIn .5s ease-out}@keyframes mIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}}
.reduced .moment{animation:none!important}
.pop{position:fixed;z-index:120;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--sh);padding:12px 14px;width:min(340px,92vw);font-size:12.5px}
.pop h4{margin:0 0 6px;font-size:13px}
.pop .ln{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.toast{position:fixed;right:18px;bottom:18px;background:var(--panel3);border:1px solid var(--line2);border-radius:10px;padding:10px 14px;box-shadow:var(--sh);z-index:150;max-width:380px;font-size:13px}
.tut{position:fixed;right:18px;bottom:18px;width:320px;background:var(--panel2);border:1px solid rgba(200,164,92,.45);border-radius:12px;box-shadow:var(--sh);z-index:40;padding:12px 14px}
.tut .st{font-size:10.5px;letter-spacing:.14em;color:var(--gold)}
/* charts */
svg.ch{display:block;width:100%;height:auto}
svg.ch text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)} .legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
/* negotiation */
.neg{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
.neglog{max-height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.bub{padding:8px 11px;border-radius:10px;max-width:92%;font-size:13px}
.bub.them{background:var(--panel3);align-self:flex-start;border-top-left-radius:3px}
.bub.you{background:var(--goldbg);border:1px solid rgba(200,164,92,.3);align-self:flex-end;border-top-right-radius:3px}
.term{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.term .tv{color:var(--muted);font-size:12.5px}
.meter{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--warn) 45%,var(--good));opacity:.85}
.meter i{position:absolute;top:-4px;width:3px;height:18px;background:var(--text);border-radius:2px}
/* wizard */
.wiz{max-width:1080px;margin:0 auto;padding:28px 22px 60px}
.steps{display:flex;gap:4px;margin:18px 0 22px;flex-wrap:wrap}
.steps span{flex:1;min-width:90px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);border-top:2px solid var(--line);padding-top:6px}
.steps span.on{color:var(--gold2);border-top-color:var(--gold)} .steps span.dn{color:var(--muted);border-top-color:var(--line2)}
.opt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:left;width:100%;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.opt:hover{border-color:var(--line2);background:var(--panel2)}
.opt.on{border-color:var(--gold);background:var(--goldbg)}
.opt h4{margin:0 0 4px;font-size:14.5px} .opt p{margin:0;color:var(--muted);font-size:12.5px}
.title{height:100vh;display:grid;place-items:center;overflow:auto;background:radial-gradient(ellipse at 50% 20%,rgba(200,164,92,.10),transparent 60%),var(--bg)}
.title .wm{font-family:var(--serif);font-size:clamp(44px,8vw,86px);letter-spacing:.2em;color:var(--gold2);text-align:center;font-weight:400}
.title .tg{text-align:center;color:var(--text2);letter-spacing:.08em;margin-top:6px}
.hamb{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.neg{grid-template-columns:1fr}.tstat .hideM{display:none}}
@media (max-width:900px){#app{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:80;transform:translateX(-100%);transition:transform .2s}.side.open{transform:none}.hamb{display:inline-flex}.g2,.g3,.g4,.grid[style*="grid-template-columns"]{grid-template-columns:1fr!important}.page{padding:14px 16px 60px}.tstat{display:none}.speed button{min-width:26px;padding:6px 6px}}
@media (max-width:560px){.date small{display:none}.speed .opt2{display:none}}

/* ===== Streaming Wars additions ===== */
a.mine{color:var(--gold2);font-weight:600}
.logo{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;font-weight:800;font-size:10px;color:#101318;flex:none;letter-spacing:.02em;vertical-align:middle;text-shadow:0 1px 0 rgba(255,255,255,.25)}
.logo.xs{width:18px;height:18px;border-radius:5px;font-size:7px}
.logo.md{width:34px;height:34px;font-size:11px}
.why{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);color:var(--muted);font-size:10px;cursor:help;padding:0;vertical-align:1px;margin-left:3px}
.why:hover{color:var(--gold2);border-color:var(--gold)}
.poster{position:relative;width:132px;height:196px;border-radius:9px;overflow:hidden;flex:none;display:flex;flex-direction:column;justify-content:flex-end;padding:12px 11px;background:
 radial-gradient(120% 80% at 80% 10%,hsla(var(--ph),45%,55%,.35),transparent 60%),
 linear-gradient(160deg,color-mix(in srgb,var(--pc) 55%,#0d1118) 0%,#0d1118 78%);border:1px solid rgba(255,255,255,.06);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.poster::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.03) 0 2px,transparent 2px 14px);pointer-events:none}
.poster::after{content:"";position:absolute;left:-20%;top:12%;width:140%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:rotate(calc(var(--ph) * 1deg / 12 - 15deg))}

/* ===== College Football Empire ===== */
.brand .wm{font-size:15px;letter-spacing:.16em;line-height:1.2}.brand .wm b{color:var(--text);font-weight:700;letter-spacing:.3em}
.title .wm b{color:var(--text);font-weight:700}

<script>'use strict';
/* ===================== COLLEGE FOOTBALL EMPIRE — core utilities ===================== */
const CFE_VERSION = 1;
let G = null; // the whole game state (serializable)

// ---------- Seeded PRNG (sfc32) ----------
let _ra = 1, _rb = 2, _rc = 3, _rd = 4;
function rngSeed(seed) {

const ri = (lo, hi) => lo + Math.floor(R() * (hi - lo + 1));

const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sig = x => 1 / (1 + Math.exp(-x));
const rnd = (v, d = 0) => { const m = Math.pow(10, d); return Math.round(v * m) / m; };
const num = (v, d = 0) => (isFinite(v) ? v : d);
const sum = (a, f) => { let s = 0; for (const x of a) s += f ? f(x) : x; return s; };
const avg = (a, f) => a.length ? sum(a, f) / a.length : 0;

const byAsc = f => (a, b) => f(a) - f(b);
function pushCap(arr, item, cap) { arr.push(item); if (arr.length > cap) arr.splice(0, arr.length - cap); }
function unshiftCap(arr, item, cap) { arr.unshift(item); if (arr.length > cap) arr.length = cap; }

// ---------- Calendar (day index = days since 2000-01-01 UTC) ----------
const DAY0 = Date.UTC(2000, 0, 1);
const MS_DAY = 86400000;
function dayOf(y, m, d) { return Math.round((Date.UTC(y, m - 1, d) - DAY0) / MS_DAY); }

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS_L = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DOWS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function fmtDate(day, long) { if (day == null || !isFinite(day)) return '—'; const t = dateOf(day); return long ? `${DOWS[t.w]}, ${MONTHS_L[t.m - 1]} ${t.d}, ${t.y}` : `${MONTHS[t.m - 1]} ${t.d}, ${t.y}`; }
function fmtDateShort(day) { if (day == null) return '—'; const t = dateOf(day); return `${MONTHS[t.m - 1]} ${t.d}`; }
function curYear() { return dateOf(G.day).y; }
function ageOf(p) { return p.by ? curYear() - p.by : 0; }

  if (v >= 1e6) return s + '$' + rnd(v / 1e6, v >= 1e8 ? 0 : 1) + 'M';
  if (v >= 1e3) return s + '$' + rnd(v / 1e3, v >= 1e5 ? 0 : 1) + 'K';

}
function pct(v, d = 0) { return isFinite(v) ? rnd(v * 100, d) + '%' : '—'; }
function fmtNum(v) { if (!isFinite(v)) return '—'; if (Math.abs(v) >= 1e9) return rnd(v / 1e9, 1) + 'B'; if (Math.abs(v) >= 1e6) return rnd(v / 1e6, 1) + 'M'; if (Math.abs(v) >= 1e3) return rnd(v / 1e3, 1) + 'K'; return String(Math.round(v)); }

function plural(n, w, p) { return n + ' ' + (n === 1 ? w : (p || w + 's')); }
function cap1(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }

// ---------- Binary heap event queue ----------
function heapPush(h, e) { h.push(e); let i = h.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (cmpEv(h[i], h[p]) < 0) { [h[i], h[p]] = [h[p], h[i]]; i = p; } else break; } }

function cmpEv(a, b) { return a.d - b.d || a.pr - b.pr || a.id - b.id; }

/* ===================== Constants: positions, attributes, schemes, geography, awards, bowls, rules ===================== */
// ---------- attributes (stored per player as a compact array) ----------
const ATT = ['spd', 'acc', 'agi', 'str', 'sta', 'arm', 'acu', 'ant', 'dec', 'poc', 'bsc', 'vis', 'hnd', 'rte', 'rel', 'cth', 'pbk', 'rbk', 'awr', 'prs', 'rst', 'tkl', 'man', 'zon', 'bal', 'kpw', 'kac', 'cmp'];
const AI_ = Object.fromEntries(ATT.map((a, i) => [a, i]));
const ATTN = { spd: 'Speed', acc: 'Acceleration', agi: 'Agility', str: 'Strength', sta: 'Stamina', arm: 'Arm strength', acu: 'Accuracy', ant: 'Anticipation', dec: 'Decision-making', poc: 'Pocket presence', bsc: 'Ball security', vis: 'Vision', hnd: 'Hands', rte: 'Route running', rel: 'Release', cth: 'Contested catch', pbk: 'Pass blocking', rbk: 'Run blocking', awr: 'Awareness', prs: 'Pass rush', rst: 'Run defense', tkl: 'Tackling', man: 'Man coverage', zon: 'Zone coverage', bal: 'Ball skills', kpw: 'Kick power', kac: 'Kick accuracy', cmp: 'Composure' };
// ---------- positions ----------
const POS = { QB: 'Quarterback', RB: 'Running back', FB: 'Fullback', WR: 'Wide receiver', TE: 'Tight end', OT: 'Offensive tackle', OG: 'Offensive guard', C: 'Center', EDGE: 'Edge rusher', DE: 'Defensive end', DT: 'Defensive tackle', LB: 'Linebacker', CB: 'Cornerback', S: 'Safety', K: 'Kicker', P: 'Punter', LS: 'Long snapper' };
const PK = Object.keys(POS);
// attribute weights for position overall (sum normalised)
const PW = {
  QB: { arm: 3, acu: 5, ant: 4, dec: 5, poc: 3, bsc: 2, spd: 1, agi: 1, cmp: 3, awr: 2 },
  RB: { spd: 3, acc: 3, agi: 3, vis: 4, str: 2, bsc: 2, hnd: 1.5, pbk: 1, sta: 1 },
  FB: { rbk: 4, str: 3, pbk: 2, hnd: 1, bsc: 1, awr: 1 },
  WR: { spd: 3, acc: 2, agi: 2, rte: 4, rel: 3, hnd: 3, cth: 2, awr: 1 },
  TE: { hnd: 3, rte: 2, cth: 2, rbk: 3, pbk: 1.5, str: 1.5, spd: 1.5, awr: 1 },
  OT: { pbk: 5, rbk: 3, str: 3, agi: 1.5, awr: 2, sta: 1 },
  OG: { pbk: 3, rbk: 5, str: 4, awr: 2, agi: 1, sta: 1 },
  C: { pbk: 3.5, rbk: 4, str: 3, awr: 3.5, sta: 1 },
  EDGE: { prs: 5, spd: 2.5, acc: 2, str: 2, rst: 2, tkl: 1.5, agi: 1 },
  DE: { prs: 3.5, rst: 3.5, str: 3, spd: 1, tkl: 2, awr: 1 },
  DT: { rst: 4, str: 4, prs: 3, tkl: 1.5, awr: 1.5, acc: 1 },
  LB: { tkl: 4, rst: 3, zon: 2, spd: 2, awr: 3, prs: 1, man: 1 },
  CB: { man: 4.5, zon: 3, spd: 3.5, agi: 2, bal: 2, awr: 1.5, tkl: 1 },
  S: { zon: 4, spd: 2.5, tkl: 3, awr: 3, bal: 2, man: 1.5, rst: 1 },

VIEWS.commish = () => {
  if (!can('commish') && G.cfg.diff !== 'sandbox') return page('Commissioner', '', '', '<div class="empty">Commissioner tools are available to the Commissioner and Full Control roles, or in Sandbox mode.</div>');
  const tb = tabs('cm', [['rules', 'Rules'], ['conf', 'Conferences'], ['teams', 'Schools'], ['players', 'Players'], ['cheats', 'Cheats']]);
  let body = '';
  if (tb.cur === 'rules') body = `<div class="grid g2">${card('Postseason', `<label>Playoff size<br>${sel('cmpo', [4, 8, 12, 16, 24].map(n => [n, n + ' teams']), G.cfg.po, 'data-ch="cmrule:po"')}</label><label>Guaranteed conference champions<br><input type="number" value="${G.cfg.poAuto}" min="0" max="10" data-ch="cmrule:poAuto"></label><label>Seeding<br>${sel('cmps', [['straight', 'Straight by ranking'], ['champs', 'Byes for champions']], G.cfg.poSeed, 'data-ch="cmrule:poSeed"')}</label><label class="chk"><input type="checkbox" ${G.cfg.poCampus !== false ? 'checked' : ''} data-ch="cmrulec:poCampus"> First round on campus</label>`)}${card('Roster & money', `<label>Roster limit<br><input type="number" value="${G.cfg.rosterLim}" data-ch="cmrule:rosterLim"></label><label>Scholarship cap<br><input type="number" value="${G.cfg.scholCap}" data-ch="cmrule:scholCap"></label><label>Class size max<br><input type="number" value="${G.cfg.classMax}" data-ch="cmrule:classMax"></label><label class="chk"><input type="checkbox" ${G.cfg.nilOn ? 'checked' : ''} data-ch="cmrulec:nilOn"> NIL collectives</label><label class="chk"><input type="checkbox" ${G.cfg.rsOn ? 'checked' : ''} data-ch="cmrulec:rsOn"> Revenue sharing</label><label>Revenue-share cap<br><input type="number" step="500000" value="${G.cfg.rsCap}" data-ch="cmrule:rsCap"></label>`)}${card('Portal & realignment', `<label class="chk"><input type="checkbox" ${G.cfg.portalSpring ? 'checked' : ''} data-ch="cmrulec:portalSpring"> Spring portal window</label><label>Realignment<br>${sel('cmra', Object.entries(REALIGN).map(([k, v]) => [k, v[0]]), G.cfg.realign, 'data-ch="cmrule:realign"')}</label>`)}${card('Sliders', SLIDERS.map(([k, l, lo, hi]) => `<label class="sl"><span class="small">${esc(l)} <b>${rnd(G.cfg.sl[k], 2)}</b></span><input type="range" min="${lo}" max="${hi}" step="0.05" value="${G.cfg.sl[k]}" data-ch="cmrule:${k}"></label>`).join(''))}</div>`;
  if (tb.cur === 'conf') body = card('Move a school', `<div class="row wrap">${sel('cmmt', allTeams().sort((a, b) => a.n.localeCompare(b.n)).map(t => [t.id, t.n]), G.me)}→${sel('cmmc', G.cf.filter(c => c.act !== false).map(c => [c.id, c.n]), PT().conf)}<button class="btn sm p" data-a="cmmove">Move</button></div>`) + card('Create a conference', `<div class="row wrap"><input type="text" id="cmcn" placeholder="Conference name"><input type="text" id="cmca" placeholder="Short name" style="width:120px"><button class="btn sm" data-a="cmnewconf">Create</button></div>`) + card('Conference rules', `<table class="t mini"><tr><th>Conference</th><th>Members</th><th>Conf. games</th><th>Title game</th><th>Tier</th><th>Media index</th><th></th></tr>${G.cf.filter(c => c.act !== false && c.key !== 'FCS').map(c => `<tr><td>${esc(c.n)}</td><td>${c.tm.length}</td><td><input type="number" value="${c.cGames}" style="width:60px" data-ch="cmcr:${c.id}:cGames"></td><td><input type="checkbox" ${c.ccg ? 'checked' : ''} data-ch="cmcrc:${c.id}:ccg"></td><td>${sel('cmtier' + c.id, ['P4', 'G5', 'IND'], c.tier, `data-ch="cmcr:${c.id}:tier"`)}</td><td><input type="number" step="0.05" value="${rnd(c.mv, 2)}" style="width:70px" data-ch="cmcr:${c.id}:mv"></td><td><select data-ch="cmdis:${c.id}"><option value="">Dissolve into…</option>${G.cf.filter(x => x !== c && x.act !== false).map(x => `<option value="${x.id}">${esc(x.ab)}</option>`).join('')}</select></td></tr>`).join('')}</table>`, { np: 1 }) + card('Expansion: create a school', `<div class="grid g4"><label>Name<br><input type="text" id="xs_n"></label><label>Nickname<br><input type="text" id="xs_nk"></label><label>State<br>${sel('xs_st', SK.filter(x => x !== 'INTL').map(k => [k, STATES[k][0]]), 'TX')}</label><label>Conference<br>${sel('xs_cf', G.cf.filter(c => c.act !== false).map(c => [c.id, c.ab]), G.cf.find(c => c.key === 'IND').id)}</label><label>Prestige<br><input type="number" id="xs_pr" value="35"></label><label>Capacity<br><input type="number" id="xs_cap" value="30000"></label></div><button class="btn sm p" style="margin-top:8px" data-a="cmexpand">Create school</button>`);
  if (tb.cur === 'teams') { const id = UI.view.cmT != null ? UI.view.cmT : G.me; const t = T(id); body = `<div class="row wrap" style="margin-bottom:10px">${sel('cmtsel', allTeams().sort((a, b) => a.n.localeCompare(b.n)).map(x => [x.id, x.n]), id, 'data-ch="cmtpick"')}<button class="btn sm" data-a="takeover:${id}">Take control</button></div>` + card(esc(t.n), `<div class="grid g4"><label>Name<br><input type="text" value="${esc(t.n)}" data-ch="cmte:${id}:n"></label><label>Nickname<br><input type="text" value="${esc(t.nk)}" data-ch="cmte:${id}:nk"></label><label>Prestige<br><input type="number" value="${Math.round(t.pr)}" data-ch="cmte:${id}:pr"></label><label>Reserves ($)<br><input type="number" value="${Math.round(t.fin.cash)}" data-ch="cmte:${id}:cash"></label><label>NIL collective ($)<br><input type="number" value="${Math.round(t.col.pool)}" data-ch="cmte:${id}:col"></label><label>Capacity<br><input type="number" value="${t.cap}" data-ch="cmte:${id}:cap"></label><label>Primary color<br><input type="color" value="${esc(t.c1)}" data-ch="cmte:${id}:c1"></label><label>Secondary color<br><input type="color" value="${esc(t.c2)}" data-ch="cmte:${id}:c2"></label></div><div class="grid g5" style="margin-top:8px">${FK.map(k => `<label>${FAC[k]}<br><input type="number" min="1" max="10" value="${t.fac[k]}" data-ch="cmte:${id}:${k}"></label>`).join('')}</div>`); }
  if (tb.cur === 'players') { const q = (F('cmp').q || '').toLowerCase(); const ps = q.length > 1 ? G.pl.filter(p => p && !p.cmp && pName(p).toLowerCase().includes(q)).slice(0, 20) : []; const p = UI.view.cmP != null ? P(UI.view.cmP) : null; body = `<div class="fbar">${fq('cmp', 'Find a player or recruit…')}</div>${ps.map(x => `<button class="btn xs" data-a="cmpp:${x.id}">${esc(pName(x))} (${x.pos}, ${x.st_ === 'rec' ? 'recruit' : esc(tName(x.tm))})</button>`).join(' ')}` + (p && !p.cmp ? card(esc(pName(p)), `<div class="grid g4"><label>First name<br><input type="text" value="${esc(p.fn)}" data-ch="cmpe:${p.id}:fn"></label><label>Last name<br><input type="text" value="${esc(p.ln)}" data-ch="cmpe:${p.id}:ln"></label><label>Position<br>${sel('cmppos', PK, p.pos, `data-ch="cmpe:${p.id}:pos"`)}</label><label>Overall<br><input type="number" value="${p.ovr}" data-ch="cmpe:${p.id}:ovr"></label><label>Potential<br><input type="number" value="${p.pot}" data-ch="cmpe:${p.id}:pot"></label><label>Eligibility used<br><input type="number" min="0" max="4" value="${p.ep}" data-ch="cmpe:${p.id}:ep"></label><label>Move to team<br>${sel('cmpt', allTeams().sort((a, b) => a.n.localeCompare(b.n)).map(x => [x.id, x.n]), p.tm >= 0 ? p.tm : G.me, `data-ch="cmpe:${p.id}:team"`)}</label></div><div class="row wrap" style="margin-top:8px"><button class="btn sm" data-a="cmpf:${p.id}:gen">Make generational</button><button class="btn sm" data-a="cmpf:${p.id}:heal">Heal</button>${p.ri ? `<button class="btn sm" data-a="forcecommit:${p.id}">Force commit to us</button>` : ''}</div><div class="grid g4" style="margin-top:8px">${ATT.map(k => `<label class="small">${ATTN[k]}<br><input type="number" value="${p.a[AI_[k]]}" style="width:70px" data-ch="cmpe:${p.id}:${k}"></label>`).join('')}</div>`) : '') + card('Create a generational recruit', `<button class="btn sm" data-a="cmgen">Add a generational prospect to the current class</button>`); }
  if (tb.cur === 'cheats') body = cheatsAllowed() ? card('Cheats (your program)', `<div class="grid g3">${Object.entries(CHEATS).map(([k, n]) => `<label class="chk"><input type="checkbox" ${G.cheats[k] ? 'checked' : ''} data-ch="cheat:${k}"> ${esc(n)}</label>`).join('')}</div>`) : '<div class="empty">Cheats are disabled for this save.</div>';
  return page('Commissioner', 'Rules, conferences, schools and players. Changes take effect immediately or at the next scheduling cycle.', '', tb.html + body);
};
ACTIONS.cmrule = a => res(cmRule(a[0], a[a.length - 1]));
ACTIONS.cmrulec = a => res(cmRule(a[0], !!+a[1]));
ACTIONS.cmmove = () => res(cmMoveTeam(+fv('cmmt'), +fv('cmmc')));
ACTIONS.cmnewconf = () => res(cmNewConf(fv('cmcn'), fv('cmca')));
ACTIONS.cmcr = a => res(cmConfRule(+a[0], a[1], a[a.length - 1]));
ACTIONS.cmcrc = a => res(cmConfRule(+a[0], a[1], !!+a[2]));
ACTIONS.cmdis = a => { if (!a[1]) return; confirmBox('Dissolve this conference?', () => res(cmDissolve(+a[0], +a[1])), 1); };
ACTIONS.cmexpand = () => res(plCreateSchool({ n: fv('xs_n'), nk: fv('xs_nk'), st: fv('xs_st'), conf: +fv('xs_cf'), pr: +fv('xs_pr'), cap: +fv('xs_cap') }));
ACTIONS.cmtpick = a => { UI.view.cmT = +a[0]; renderMain(true); };
ACTIONS.cmte = a => { const v = a.slice(2).join(':'); res(cmEditTeam(+a[0], a[1], v)); };
ACTIONS.cmpp = a => { UI.view.cmP = +a[0]; renderMain(true); };
ACTIONS.cmpe = a => res(cmEditPlayer(+a[0], a[1], a.slice(2).join(':')));
ACTIONS.cmpf = a => res(cmEditPlayer(+a[0], a[1], 1));
ACTIONS.cmgen = () => { const pool = genRecruitClass(G.recCls, 1); const p = pool[0]; p.gen = 1; p.hsv = 88; p.pot = 97; p.comp = 90; assignDD(p, G.recCls); G.rcIds[G.recCls].push(p.id); p.rk = 1; p.stars = 5; toast(`Created ${esc(pName(p))}.`); go('player', { id: p.id }); };
ACTIONS.cheat = a => res(plCheat(a[0], !!+a[1]));
// ---------- jobs ----------
VIEWS.jobs = () => {
  const me = C(G.userCoach); const jm = jobMarket();
  return page('Career & Jobs', me ? `${esc(cName(me))} · reputation ${me.rep} · ${me.w}-${me.l} career` : 'You are not a coach in this role.', '', `${G.unemployed ? '<div class="note bad">You are currently unemployed. Apply for an open job below.</div>' : ''}${card('Open head-coaching jobs', jm.length ? `<table class="t mini"><tr><th>School</th><th class="n">Prestige</th><th class="n">Last season</th><th class="n">Your chance</th><th></th></tr>${jm.map(({ t, chance: c }) => `<tr><td>${tl(t)}</td><td class="n">${Math.round(t.pr)}</td><td class="n">${t.hist.length ? t.hist[t.hist.length - 1].w + '-' + t.hist[t.hist.length - 1].l : '—'}</td><td class="n">${pct(c)}</td><td>${(G.jobDeclined || []).includes(t.id) ? '<span class="muted small">Declined</span>' : `<button class="btn xs p" data-a="job:${t.id}">Apply</button>`}</td></tr>`).join('')}</table>` : '<div class="small muted">No open head-coaching jobs right now. The carousel spins after the regular season.</div>', { np: 1 })}${me ? card('Your reputation', `${stat('Reputation', me.rep)}${stat('Hot seat', G.userHeat != null ? G.userHeat : hotSeat(PT()))}${stat('Titles', me.ch || 0)}<div class="tiny muted">Win above expectations to earn better offers. Great seasons bring job offers from bigger programs during the carousel.</div>`) : ''}`);
};
// ---------- help ----------
const HELP = [
  ['Getting started', `You run a college football program as the role you chose. Time flows day by day. Press <b>Space</b> to play/pause, <b>1–4</b> for speed, <b>.</b> for one day, <b>W</b> for a week and <b>N</b> (⏭) to jump to the next event. Your games pause the clock and open the Game Center.`],
  ['The loop', 'Recruit and develop players → win games → prestige, fans, boosters and money grow → better facilities, staff, NIL and recruiting → rivals react. Every screen shows its numbers; anything underlined or marked “?” explains itself.'],
  ['Recruiting', `Thousands of prospects form each class. Stars come from recruiting services and can be wrong: your staff estimates true ability as a range that narrows with scouting. Each week you get recruiting points to contact, scout, visit and pitch. Prospects weigh up to three priorities; pitching a strength works, pitching a weakness can backfire on a visit. Commitments can be soft — rivals flip them. The Early Signing Period (December) and National Signing Day (February) lock classes in.`],
  ['Roster & eligibility', 'Players have five years to play four seasons. Playing four or fewer games preserves a redshirt year; a season-ending injury can earn a medical redshirt. Some December signees enroll early and join spring practice. Rosters are capped (105 by default) and scholarships are limited. Walk-ons fill the gaps; some turn into gems — award them scholarships.'],
  ['Development', 'Most growth happens in spring practice and summer, with small weekly gains in season. Position coaches, the strength coach, facilities, practice focus, playing time and work ethic all matter. Potential is hidden and can shift.'],
  ['Transfer portal', 'After the season, unhappy players — role, playing time, NIL, broken promises, coaching changes — may enter the portal. Use Retention before it opens. When it opens, target players who fill needs. Transfers are immediately eligible.'],
  ['NIL & revenue share', 'NIL collective money comes from boosters and never touches the university budget. Revenue sharing is university money, capped by the rules. Players paid far below market are transfer risks.'],
  ['Game engine', 'Every game is simulated play by play with individual players: protection vs pass rush, route running vs coverage, blocking vs run defense, tackling, special teams, fatigue, injuries, weather and home-field edge. Tactics and coordinators change play calling. You can watch, skim, coach 4th downs, call every play or simulate.'],
  ['Postseason', 'Four ranking systems run each week. The committee picks the playoff field (12 teams by default: five highest-ranked conference champions plus seven at-large). Bowl-eligible teams need six wins. All sizes and rules can be changed by a Commissioner.'],
  ['Staff & job security', 'Hire coordinators and position coaches with the traits you need. Successful assistants get poached. Head coaches who miss expectations land on the hot seat. In career mode you can be fired and hired elsewhere.'],
  ['Program & money', 'Prestige has ten dimensions. Facilities cost millions and take months to build. Revenue comes from tickets, media distributions, donations, merchandise and postseason payouts. All money figures are simulation values, not official data.'],
  ['Saves', 'Autosave rotates three backups. Export save files to keep them anywhere. Ironman keeps a single rolling save and disables cheats.'],
  ['Honesty note', 'Schools, conferences and stadiums are real starting points. Every player and coach is fictional. Awards, bowls and media outlets are fictional. Future events after the game starts are simulated.'],
];
VIEWS.help = () => page('Help', 'How College Football Empire works.', '', `<div class="helpbody">${HELP.map(([h, b]) => `<h3>${esc(h)}</h3><p>${b}</p>`).join('')}<h3>Keyboard</h3><p>Space play/pause · 1–4 speed · . day · W week · N next event · / search · H home · I inbox · T tasks · R roster · D depth chart · B recruiting board · P portal · G game center · S schedule · K rankings · F finances · Backspace back · Esc close</p><button class="btn sm" data-a="tuton">Restart the tutorial</button></div>`);
ACTIONS.tuton = () => { G.tut = { on: 1, step: 0 }; renderTut(); };
</script>
