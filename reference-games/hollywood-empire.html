<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hollywood Empire</title>
<meta name="description" content="A deep movie-studio management game.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,500;1,6..96,600&display=swap">
<style>:root{
  color-scheme: dark;
  --ground:#0b1512; --ground-2:#0e1a16; --panel:#112019; --panel-2:#16291f; --panel-3:#1c3328; --line:#24402f; --line-2:#2f5240;
  --ink:#efe7d4; --ink-2:#cfc6b1; --muted:#94a79c; --faint:#6f8479;
  --brass:#d4ae62; --brass-2:#f1d690; --brass-deep:#8c6d2e;
  --good:#6fc08e; --ok:#b7c96a; --warn:#e3a84b; --bad:#e06d58; --info:#7fa9cb; --hot:#ec8b52; --gold:#f1d690;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif; --ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --r:6px; --gap:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.45 var(--ui);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass-2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.muted{color:var(--muted)} .faint{color:var(--faint)} .pad{padding:12px}
.num{text-align:right;font-variant-numeric:tabular-nums} .neg{color:var(--bad)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1{font:600 30px/1.1 var(--display);letter-spacing:.01em}
h2{font:600 22px/1.15 var(--display)}
h3{font:600 12px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
h4{font:600 14px/1.3 var(--ui)}
.eyebrow{font:600 11px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}

/* ---------- Shell ---------- */
#app{min-height:100%}
.shell{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,#0d1a15,#09120f);border-right:1px solid var(--line);padding:18px 0 24px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 18px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand .mast{font:700 20px/1 var(--display);letter-spacing:.08em;color:var(--brass-2)}
.brand .mast small{display:block;font:600 9px/1.6 var(--ui);letter-spacing:.34em;color:var(--muted);margin-top:4px}
.navgrp{padding:6px 10px}
.navgrp .gl{font:600 10px/1 var(--ui);letter-spacing:.2em;color:var(--faint);text-transform:uppercase;padding:10px 8px 6px}
.navbtn{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:5px;color:var(--ink-2);cursor:pointer}
.navbtn:hover{background:var(--panel)} .navbtn.on{background:var(--panel-2);color:var(--brass-2);box-shadow:inset 2px 0 0 var(--brass)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brass);color:#1a1405;font:700 11px/18px var(--ui);text-align:center}
.badge.alert{background:var(--hot)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:10px 20px;background:rgba(11,21,18,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .studio{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--display);color:#1a1405;flex:none}
.top .sname{font:600 17px/1.1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.top .kv{display:flex;flex-direction:column;line-height:1.15}
.top .kv b{font:600 15px var(--ui)} .top .kv span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.clock{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.date{font:600 15px var(--display);color:var(--brass-2);min-width:128px;text-align:right}
.speed{display:flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.speed button{background:var(--panel);border:0;border-right:1px solid var(--line);padding:6px 9px;cursor:pointer;color:var(--ink-2)}
.speed button:last-child{border-right:0} .speed button.on{background:var(--brass);color:#1a1405;font-weight:700}
.content{padding:20px;display:flex;flex-direction:column;gap:var(--gap);max-width:1500px;width:100%}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pagehead .sub{color:var(--muted);margin-top:4px}
.grid{display:grid;gap:var(--gap)} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-hub{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:1100px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-hub{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.shell{grid-template-columns:minmax(0,1fr)}.side{position:static;height:auto;display:flex;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.brand{display:none}.navgrp{display:flex;padding:0}.navgrp .gl{display:none}.navbtn{white-space:nowrap}.g2{grid-template-columns:minmax(0,1fr)}.content{padding:16px}}
@media (max-width:560px){.g3,.g4{grid-template-columns:minmax(0,1fr)}.top{padding:8px 16px}.top .sname{max-width:150px}}

/* ---------- Cards & primitives ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-x{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card-b{padding:14px}
.card.flush .card-b{padding:0}
.lift{background:linear-gradient(180deg,var(--panel-2),var(--panel));border-color:var(--line-2)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:5px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover:not([disabled]){border-color:var(--brass);color:var(--brass-2)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#1a1405}
.btn.primary:hover:not([disabled]){background:var(--brass-2);color:#1a1405}
.btn.danger{border-color:#6b2f25;color:#f0a597} .btn.ghost{background:none}
.btn.sm{padding:4px 8px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);font-size:11px;font-weight:600;letter-spacing:.02em;white-space:nowrap;color:var(--ink-2)}
.pill.good{border-color:#2e6b48;color:var(--good)} .pill.bad{border-color:#6b2f25;color:var(--bad)} .pill.warn{border-color:#6b5222;color:var(--warn)} .pill.info{border-color:#2d4c66;color:var(--info)} .pill.gold{border-color:var(--brass-deep);color:var(--gold);background:rgba(212,174,98,.08)} .pill.hot{border-color:#6e3a1f;color:var(--hot)} .pill.muted{color:var(--faint)}
.stat{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--ground-2);min-width:0}
.stat .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stat .val{font:600 20px/1.2 var(--ui);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .sub{font-size:12px;color:var(--muted);margin-top:2px}
.stat.good .val{color:var(--good)} .stat.bad .val{color:var(--bad)} .stat.gold .val{color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.meter{position:relative;height:18px;background:var(--ground-2);border:1px solid var(--line);border-radius:4px;overflow:hidden;min-width:70px}
.meter .bar{position:absolute;inset:0 auto 0 0;background:var(--info);opacity:.55}
.meter.good .bar{background:var(--good)} .meter.ok .bar{background:var(--ok)} .meter.warn .bar{background:var(--warn)} .meter.bad .bar{background:var(--bad)} .meter.gold .bar{background:var(--brass)}
.meter .band{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(241,214,144,.35) 0 3px,transparent 3px 6px);border-left:1px solid var(--brass-2);border-right:1px solid var(--brass-2)}
.meter .mv{position:relative;z-index:1;font-size:11px;font-weight:700;padding-left:6px;line-height:16px;text-shadow:0 1px 1px #000}
.kvs{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
.kvs dt{color:var(--muted);font-size:12px} .kvs dd{margin:0;min-width:0}
.tip{display:inline-grid;place-items:center;width:15px;height:15px;margin-left:5px;border-radius:50%;border:1px solid var(--line-2);font-size:10px;color:var(--muted);cursor:help;position:relative;vertical-align:middle}
.tip:hover::after,.tip:focus::after{content:attr(data-tip);position:absolute;left:50%;bottom:130%;transform:translateX(-50%);width:max-content;max-width:260px;padding:8px 10px;background:#050a08;border:1px solid var(--brass-deep);border-radius:5px;color:var(--ink);font:400 12px/1.4 var(--ui);text-transform:none;letter-spacing:0;z-index:50;white-space:normal}
.lnk{text-decoration:none;border-bottom:1px dotted var(--line-2)} .lnk:hover{color:var(--brass-2);border-color:var(--brass)}
.lnk.film i{font-family:var(--display);font-style:italic;font-size:1.04em}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.up{color:var(--good);font-size:11px} .down{color:var(--bad);font-size:11px} .flat{color:var(--faint)}
.empty{padding:22px;text-align:center;color:var(--muted)} .empty p{margin:0 0 10px}
.hr{height:1px;background:var(--line);margin:4px 0}
.note{padding:10px 12px;border-left:2px solid var(--brass);background:rgba(212,174,98,.06);border-radius:0 5px 5px 0;color:var(--ink-2)}
.warnbox{padding:10px 12px;border-left:2px solid var(--warn);background:rgba(227,168,75,.07);border-radius:0 5px 5px 0}
.errbox{padding:10px 12px;border-left:2px solid var(--bad);background:rgba(224,109,88,.08);border-radius:0 5px 5px 0}
.list{list-style:none;margin:0;padding:0} .list li{padding:9px 0;border-bottom:1px solid var(--line)} .list li:last-child{border-bottom:0}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:600 10px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;position:sticky;top:0;background:var(--panel)}
.tbl th[role=button]{cursor:pointer} .tbl th[role=button]:hover{color:var(--brass-2)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:rgba(255,255,255,.015)}
.tbl tr.me td{background:rgba(212,174,98,.06)}
.tbl .num{text-align:right}
.tbl.dense td{padding:5px 8px}

/* ---------- Forms ---------- */
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--ground-2);border:1px solid var(--line-2);border-radius:5px;padding:7px 9px;min-width:0;width:100%}
input[type=range]{width:100%;accent-color:var(--brass)}
textarea{min-height:80px;resize:vertical}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chk input{accent-color:var(--brass)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.search{display:flex;gap:8px}
.row select,.row input[type=search],.row input[type=number]{width:auto;max-width:100%}
.card-h h3{min-width:0}
.search input{font-size:15px;padding:10px 12px}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;color:var(--muted);cursor:pointer;font-weight:600;white-space:nowrap}
.tab.on{color:var(--brass-2);border-color:var(--brass)} .tab:hover:not([disabled]){color:var(--ink)} .tab[disabled]{opacity:.35;cursor:not-allowed}

/* ---------- Pipeline ---------- */
.pipe{display:flex;gap:0;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.pipe div{flex:1;min-width:92px;padding:8px 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);border-right:1px solid var(--line);white-space:nowrap}
.pipe div:last-child{border-right:0}
.pipe .done{color:var(--muted);background:var(--ground-2)} .pipe .cur{color:#1a1405;background:var(--brass);font-weight:700}

/* ---------- Casting board ---------- */
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.role{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--ground-2);cursor:pointer;text-align:left;color:inherit}
.role.sel{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.role .rt{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
.role .rn{font:600 14px/1.25 var(--ui);margin:3px 0}
.role .who{font:italic 600 16px/1.2 var(--display);color:var(--ink)}
.role .open{color:var(--warn);font-weight:600}

/* ---------- Production cards ---------- */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pc{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--ground-2);display:flex;flex-direction:column;gap:6px}
.pc .t{font:italic 600 18px/1.15 var(--display)}
.pc .s{font-size:12px;color:var(--muted)}

/* ---------- Calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wk{border:1px solid var(--line);border-radius:5px;padding:8px;background:var(--ground-2);min-height:96px}
.wk .wd{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.wk .season{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.wk .f{display:block;font-size:12px;padding:3px 6px;border-radius:3px;margin-top:3px;background:var(--panel-2);border-left:3px solid var(--line-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.wk .f.mine{border-left-color:var(--brass);background:rgba(212,174,98,.12);color:var(--brass-2);font-weight:600}
.wk.sel{outline:1px solid var(--brass)}

/* ---------- News ---------- */
.feed .item{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:92px 1fr;gap:10px}
.feed .item:last-child{border-bottom:0}
.feed .cat{font:700 10px/1.3 var(--ui);letter-spacing:.14em;color:var(--brass)}
.feed .cat.RUMORS{color:var(--hot)} .feed .cat.AWARDS{color:var(--gold)} .feed .cat.BREAKING{color:var(--bad)}
.feed .d{font-size:11px;color:var(--faint)}
.feed .txt{font-size:14px} .feed .mine .txt{color:var(--brass-2)}
.feed .ins{font-size:11px;color:var(--hot);margin-top:3px}
.headline{font:600 26px/1.15 var(--display);margin:4px 0}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(3,7,5,.78);z-index:100;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal.wide{width:min(1100px,100%)}
.modal .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.modal .mb{padding:18px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);cursor:pointer}
.speaker{font:italic 600 15px var(--display);color:var(--brass-2)}
.quote{font:500 17px/1.5 var(--display);color:var(--ink)}
.voices{display:grid;gap:8px}
.voice{padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--ground-2)}
.voice b{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.opts{display:grid;gap:8px}
.opts .btn{justify-content:flex-start;white-space:normal;text-align:left;padding:10px 12px}

/* ---------- Reveal moments (the marquee) ---------- */
.marquee{position:relative;border-radius:10px;padding:26px 22px;text-align:center;background:radial-gradient(ellipse at top,#23402f,#0c1713 70%);border:1px solid var(--brass-deep)}
.marquee::before{content:"";position:absolute;inset:6px;border-radius:7px;border:2px dotted rgba(241,214,144,.55);pointer-events:none;animation:bulbs 1.2s steps(2) infinite}
@keyframes bulbs{50%{border-color:rgba(241,214,144,.2)}}
.marquee .big{font:700 clamp(38px,8vw,68px)/1 var(--display);color:var(--brass-2);letter-spacing:.01em;margin:10px 0}
.marquee .cap{font:600 11px/1 var(--ui);letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.marquee .title{font:italic 600 24px/1.2 var(--display)}
.stamp{display:inline-block;font:900 34px/1 var(--ui);letter-spacing:.12em;color:var(--bad);border:4px solid var(--bad);padding:8px 16px;transform:rotate(-8deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.2);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.envelope{font:600 13px var(--ui);letter-spacing:.24em;text-transform:uppercase;color:var(--brass)}
.nominee{padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--ground-2);text-align:left}
.nominee.win{border-color:var(--brass);background:rgba(212,174,98,.14)}
.nominee.win .nm::after{content:" — WINNER";color:var(--brass-2);font-weight:700;font-size:11px;letter-spacing:.12em}
.fadein{animation:fade .4s ease both}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

/* ---------- Toasts / progress ---------- */
.toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{padding:10px 14px;border-radius:6px;background:#050a08;border:1px solid var(--line-2);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.bad{border-color:var(--bad)} .toast.good{border-color:var(--good)} .toast.gold{border-color:var(--brass)}
.busy{position:fixed;left:0;right:0;top:0;height:3px;z-index:300;background:linear-gradient(90deg,transparent,var(--brass-2),transparent);background-size:40% 100%;animation:slide 1s linear infinite}
@keyframes slide{from{background-position:-40% 0}to{background-position:140% 0}}
.progress{height:6px;background:var(--ground-2);border-radius:3px;overflow:hidden}.progress div{height:100%;background:var(--brass)}

/* ---------- Charts ---------- */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:10px;font-family:var(--ui)}
.chart .bar{fill:var(--info);opacity:.8} .chart .bar.mine{fill:var(--brass)} .chart .bar.wknd{fill:var(--brass-2)} .chart .bar.neg{fill:var(--bad)}
.chart .line{stroke-width:2} .chart .s0{stroke:var(--brass);fill:var(--brass)} .chart .s1{stroke:var(--info);fill:var(--info)} .chart .s2{stroke:var(--good);fill:var(--good)} .chart .s3{stroke:var(--hot);fill:var(--hot)}
.chart path.line{fill:none}
.spark{width:90px;height:24px} .spark path{stroke:var(--brass);stroke-width:1.5}

/* ---------- Title screen ---------- */
.title-screen{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(ellipse at 50% -10%,#24402f 0,#0b1512 60%)}
.ts{width:min(980px,100%);display:grid;gap:22px}
.ts .logo-big{text-align:center}
.ts .logo-big .l1{font:700 clamp(44px,9vw,92px)/.9 var(--display);letter-spacing:.06em;color:var(--brass-2)}
.ts .logo-big .l2{font:600 12px/1 var(--ui);letter-spacing:.6em;color:var(--muted);margin-top:14px;padding-left:.6em}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mode{border:1px solid var(--line-2);border-radius:8px;padding:14px;background:rgba(17,32,25,.8);cursor:pointer;text-align:left;color:inherit}
.mode.on{border-color:var(--brass);background:rgba(212,174,98,.1)}
.mode b{display:block;font:600 17px/1.2 var(--display);color:var(--brass-2);margin-bottom:4px}
.mode span{font-size:12px;color:var(--muted)}
.legal{font-size:11.5px;color:var(--faint);max-width:78ch;margin:0 auto;text-align:center}
.swatches{display:flex;gap:6px;flex-wrap:wrap}.swatches button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}.swatches button.on{border-color:var(--ink)}

/* ---------- Misc ---------- */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap)}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.person-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.avatar{width:72px;height:72px;border-radius:8px;display:grid;place-items:center;font:700 26px var(--display);color:#1a1405;flex:none}
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 18px}
.attr{display:grid;grid-template-columns:1fr 110px;align-items:center;gap:8px;font-size:12.5px}
.timeline{border-left:1px solid var(--line-2);margin-left:6px;padding-left:16px}
.timeline .ev{position:relative;padding:6px 0}
.timeline .ev::before{content:"";position:absolute;left:-20px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--brass)}
.timeline .ev .d{font-size:11px;color:var(--faint)}
.kbd{font:600 11px var(--ui);border:1px solid var(--line-2);border-radius:3px;padding:1px 5px;color:var(--muted)}
.tut{border:1px solid var(--brass-deep);background:linear-gradient(90deg,rgba(212,174,98,.09),transparent)}
.big-num{font:700 30px/1 var(--display);color:var(--brass-2)}
.scroll{max-height:420px;overflow:auto}

  function tone(freq, t0, dur, type = "sine", vol = 0.08) {
    const c = ac();
    if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, c.currentTime + t0);
    g.gain.linearRampToValueAtTime(vol, c.currentTime + t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(1e-4, c.currentTime + t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(c.currentTime + t0);
    o.stop(c.currentTime + t0 + dur + 0.05);
  }
