<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billionaire Empire</title>
<meta name="description" content="Billionaire Empire — Build the company. Buy the competition. Control the empire. An offline corporate empire and capital allocation simulation.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1320'/%3E%3Cpath d='M14 48V30M26 48V22M38 48V26M50 48V14' stroke='%23c2a15e' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>:root{
  --bg:#0a0d13; --bg2:#0e121a; --panel:#131924; --panel2:#18202d; --panel3:#212b3a; --line:#222c3b; --line2:#2f3b4e; --burg:#1d3557; --burg2:#2c4f7c; --burgbg:rgba(44,79,124,.18);
  --text:#eef0f3; --text2:#cfd5de; --muted:#8f9aab; --faint:#5f6b7d;
  --gold:#c2a15e; --gold2:#dcc28a; --goldbg:rgba(194,161,94,.12);
  --good:#7fbf97; --goodbg:rgba(127,191,151,.13); --bad:#d9776b; --badbg:rgba(217,119,107,.14); --warn:#d8b25a; --warnbg:rgba(216,178,90,.13); --blue:#86a8d6; --bluebg:rgba(134,168,214,.13);
  --r:10px; --r2:6px; --sh:0 10px 30px rgba(0,0,0,.5); --font:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif; --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
a{color:var(--gold2);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.num,td.n,.kpi .v{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .gold{color:var(--gold)} .blue{color:var(--blue)}
.small{font-size:12px} .tiny{font-size:11px} .big{font-size:18px} .b{font-weight:600} .up{text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;gap:10px;align-items:center} .row.wrap{flex-wrap:wrap} .col{display:flex;flex-direction:column;gap:8px} .sp{flex:1} .right{margin-left:auto}
.grid{display:grid;gap:14px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.hide{display:none!important}
/* shell */
#app{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr);height:100vh}
.side{grid-row:1/3;background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.brand .wm{font-family:var(--serif);font-size:19px;letter-spacing:.18em;color:var(--gold2)}
.brand .tg{font-size:10.5px;color:var(--faint);letter-spacing:.04em;margin-top:2px}
.agchip{display:flex;align-items:center;gap:9px;margin:12px 12px 4px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.agchip .lg{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:11.5px;color:#111;flex:none}
.agchip .an{font-weight:600;font-size:13px;line-height:1.2} .agchip .ar{font-size:11px;color:var(--muted)}
.nav{padding:6px 8px 16px}
.nav h6{margin:14px 10px 4px;font-size:10.5px;letter-spacing:.14em;color:var(--faint);font-weight:600}
.nav a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;color:var(--text2);font-size:13px;text-decoration:none}
.nav a:hover{background:var(--panel);color:var(--text)}
.nav a.on{background:var(--goldbg);color:var(--gold2)}
.nav a .bd{margin-left:auto;background:var(--gold);color:#111;border-radius:9px;font-size:10.5px;padding:0 6px;font-weight:700;min-width:18px;text-align:center}
.nav a .bd.r{background:var(--bad);color:#fff}
.top{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg2);min-width:0}
.clock{display:flex;align-items:center;gap:8px;min-width:0}
.date{font-weight:600;white-space:nowrap} .date small{display:block;font-weight:400;color:var(--muted);font-size:11px;line-height:1}
.speed{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.speed button{background:var(--panel);border:0;border-right:1px solid var(--line);padding:6px 9px;cursor:pointer;color:var(--text2);font-size:12px;min-width:32px}
.speed button:last-child{border-right:0}
.speed button.on{background:var(--gold);color:#111;font-weight:700}
.speed button:hover:not(.on){background:var(--panel3)}
.search{position:relative;flex:1;max-width:460px;min-width:120px}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px 7px 30px;outline:0}
.search input:focus{border-color:var(--gold)}
.search input[type=search]{padding-left:30px;width:100%}
.search svg{position:absolute;left:9px;top:9px;opacity:.5}
.sres{position:absolute;top:38px;left:0;right:0;background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--sh);max-height:70vh;overflow:auto;z-index:50}
.sres .it{display:flex;gap:10px;align-items:center;padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.sres .it:hover,.sres .it.sel{background:var(--panel3)}
.sres .grp{padding:6px 10px;font-size:10.5px;letter-spacing:.12em;color:var(--faint);background:var(--bg2)}
.tstat{display:flex;gap:14px;align-items:center;margin-left:auto;white-space:nowrap}
.tstat .s{font-size:11px;color:var(--muted);line-height:1.1} .tstat .s b{display:block;color:var(--text);font-size:13px}
.ibtn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer;position:relative}
.ibtn .dot{position:absolute;top:-5px;right:-6px;background:var(--bad);color:#fff;font-size:10px;border-radius:8px;padding:0 5px;font-weight:700}
.main{overflow-y:auto;min-width:0;background:var(--bg)}
.page{padding:18px 22px 60px;max-width:1500px;margin:0 auto}
.ph{display:flex;align-items:flex-end;gap:14px;margin:4px 0 16px;flex-wrap:wrap}
.ph h1{font-family:var(--serif);font-weight:500;font-size:26px;margin:0;letter-spacing:.01em}
.ph .sub{color:var(--muted);font-size:13px;margin-top:3px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:6px} .crumb a{color:var(--muted)}
/* panels */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card>.hd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line)}
.card>.hd h3{margin:0;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);font-weight:600}
.card>.hd .a{margin-left:auto;font-size:12px}
.card>.bd{padding:12px 14px}
.card>.bd.np{padding:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.kpi .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:11.5px;color:var(--muted)}
/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{position:sticky;top:0;background:var(--panel2);text-align:left;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.t th.n,table.t td.n{text-align:right;white-space:nowrap}
table.t th .ar{opacity:.7;margin-left:3px}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:hover td{background:rgba(255,255,255,.018)}
table.t tr.sel td{background:var(--goldbg)}
table.t td.nm{white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:8px 12px;font-size:12px;color:var(--muted)}
/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--text);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--panel3);text-decoration:none}
.btn.p{background:var(--gold);border-color:var(--gold);color:#15130e;font-weight:600}
.btn.p:hover{background:var(--gold2)}
.btn.d{border-color:rgba(217,119,107,.5);color:var(--bad)}
.btn.g{border-color:rgba(111,191,142,.45);color:var(--good)}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:6px}
.btn.xs{padding:1px 6px;font-size:11px;border-radius:5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)} .btn.ghost:hover{color:var(--text);background:var(--panel2)}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:7px;padding:6px 9px;outline:0;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{width:100%;min-height:90px;resize:vertical}
input[type=range]{accent-color:var(--gold);width:100%}
input[type=checkbox],input[type=radio]{accent-color:var(--gold)}
label.chk{display:flex;gap:8px;align-items:flex-start;cursor:pointer;padding:3px 0}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--panel);border:0;border-right:1px solid var(--line2);padding:5px 11px;cursor:pointer;font-size:12.5px;color:var(--text2)}
.seg button:last-child{border-right:0} .seg button.on{background:var(--goldbg);color:var(--gold2)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 13px;cursor:pointer;color:var(--muted);font-size:13px;white-space:nowrap}
.tabs button.on{color:var(--gold2);border-bottom-color:var(--gold)}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fbar select,.fbar input{font-size:12.5px;padding:5px 8px}
/* chips & bars */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line2);color:var(--text2);white-space:nowrap;background:var(--bg2)}
.chip.g{border-color:rgba(111,191,142,.4);color:var(--good)} .chip.r{border-color:rgba(217,119,107,.45);color:var(--bad)} .chip.y{border-color:rgba(216,178,90,.45);color:var(--warn)} .chip.gold{border-color:rgba(184,148,90,.5);color:var(--gold2);background:var(--goldbg)} .chip.b{border-color:rgba(127,163,209,.45);color:var(--blue)}
.real{font-size:9.5px;padding:0 5px;border-radius:4px;border:1px solid rgba(127,163,209,.5);color:var(--blue);letter-spacing:.05em;vertical-align:1px}
.fic{font-size:9.5px;padding:0 5px;border-radius:4px;border:1px solid var(--line2);color:var(--faint);letter-spacing:.05em;vertical-align:1px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.bar.g i{background:var(--good)} .bar.r i{background:var(--bad)} .bar.y i{background:var(--warn)}
.rating{display:inline-flex;align-items:center;gap:6px;min-width:84px}
.rating .bar{flex:1}
.xp{cursor:help;border-bottom:1px dotted var(--faint)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;color:#111}
.av.lg{width:64px;height:64px;font-size:21px}
.list .li{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.list .li:hover{background:rgba(255,255,255,.015)}
.pri2{border-left:3px solid var(--bad)} .pri1{border-left:3px solid var(--warn)} .pri0{border-left:3px solid transparent}
.empty{padding:26px;text-align:center;color:var(--muted)}
.note{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px;color:var(--text2)}
.note.gold{border-color:rgba(184,148,90,.35);background:var(--goldbg)}
.disc{font-size:11.5px;color:var(--muted);border:1px dashed var(--line2);border-radius:8px;padding:8px 10px;margin:10px 0}
.stat{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.stat:last-child{border-bottom:0} .stat .k{color:var(--muted)}
.msg{white-space:pre-wrap}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(5,7,10,.66);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--sh);width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.w{width:min(980px,100%)} .modal.xw{width:min(1200px,100%)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mh h2{margin:0;font-size:17px;font-weight:600}
.modal .mb{padding:16px 18px;overflow-y:auto}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.moment{text-align:center;padding:34px 30px 26px;background:radial-gradient(ellipse at top,rgba(184,148,90,.16),transparent 65%)}
.moment.bad{background:radial-gradient(ellipse at top,rgba(217,119,107,.14),transparent 65%)}
.moment .k{font-size:11px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.moment.bad .k{color:var(--bad)}
.moment h2{font-family:var(--serif);font-weight:500;font-size:30px;margin:12px 0 8px;line-height:1.15}
.moment p{color:var(--text2);margin:0 0 18px}
@media (prefers-reduced-motion:no-preference){.moment{animation:mIn .5s ease-out}@keyframes mIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}}
.reduced .moment{animation:none!important}
.pop{position:fixed;z-index:120;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--sh);padding:12px 14px;width:min(340px,92vw);font-size:12.5px}
.pop h4{margin:0 0 6px;font-size:13px}
.pop .ln{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.toast{position:fixed;right:18px;bottom:18px;background:var(--panel3);border:1px solid var(--line2);border-radius:10px;padding:10px 14px;box-shadow:var(--sh);z-index:150;max-width:380px;font-size:13px}
.tut{position:fixed;right:18px;bottom:18px;width:320px;background:var(--panel2);border:1px solid rgba(184,148,90,.45);border-radius:12px;box-shadow:var(--sh);z-index:40;padding:12px 14px}
.tut .st{font-size:10.5px;letter-spacing:.14em;color:var(--gold)}
/* charts */
svg.ch{display:block;width:100%;height:auto}
svg.ch text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)} .legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
/* negotiation */
.neg{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
.neglog{max-height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.bub{padding:8px 11px;border-radius:10px;max-width:92%;font-size:13px}
.bub.them{background:var(--panel3);align-self:flex-start;border-top-left-radius:3px}
.bub.you{background:var(--goldbg);border:1px solid rgba(184,148,90,.3);align-self:flex-end;border-top-right-radius:3px}
.term{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.term .tv{color:var(--muted);font-size:12.5px}
.meter{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--warn) 45%,var(--good));opacity:.85}
.meter i{position:absolute;top:-4px;width:3px;height:18px;background:var(--text);border-radius:2px}
/* wizard */
.wiz{max-width:1080px;margin:0 auto;padding:28px 22px 60px}
.steps{display:flex;gap:4px;margin:18px 0 22px;flex-wrap:wrap}
.steps span{flex:1;min-width:90px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);border-top:2px solid var(--line);padding-top:6px}
.steps span.on{color:var(--gold2);border-top-color:var(--gold)} .steps span.dn{color:var(--muted);border-top-color:var(--line2)}
.opt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:left;width:100%;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.opt:hover{border-color:var(--line2);background:var(--panel2)}
/* ===== shared game chrome ===== */

body{background:linear-gradient(180deg,#0a0d13,#0c1018)}
.brand .wm{font-size:14px;letter-spacing:.16em;line-height:1.25}.brand .wm b{color:var(--text);font-weight:700;letter-spacing:.28em}
.title{background:radial-gradient(ellipse at 50% 14%,rgba(184,148,90,.12),transparent 58%),radial-gradient(ellipse at 50% 100%,rgba(29,53,87,.35),transparent 62%),var(--bg)}
.title .wm.t1{font-family:var(--serif);font-size:clamp(18px,3.2vw,30px);letter-spacing:.5em;color:var(--gold2);text-align:center}
.title .wm2{font-family:var(--serif);font-size:clamp(50px,9.5vw,108px);letter-spacing:.2em;color:var(--text);text-align:center;font-weight:600;line-height:1;margin-top:6px;text-shadow:0 6px 40px rgba(184,148,90,.18)}
.title .tg{text-align:center;color:var(--text2);letter-spacing:.14em;margin-top:12px;font-family:var(--serif);font-style:italic}
a.mine{color:var(--gold2);font-weight:600}
.logo{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;font-weight:700;font-size:10px;flex:none;letter-spacing:.02em;vertical-align:middle;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.logo.xs{width:18px;height:18px;border-radius:4px;font-size:7.5px;margin-right:5px}.logo.lg{width:54px;height:54px;font-size:16px;border-radius:12px}
.why{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);color:var(--muted);font-size:10px;cursor:help;padding:0;vertical-align:1px;margin-left:3px}.why:hover{color:var(--gold2);border-color:var(--gold)}
.chip.xs{font-size:9.5px;padding:0 5px}
.stg{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--panel3);color:var(--text2);white-space:nowrap}
.stg.s0{background:#2a2f3a;color:#c9ced8}.stg.s1{background:#233a33;color:#bfe8d1}.stg.s2{background:#1f3550;color:#cfe2ff}.stg.s3{background:#2f2b4f;color:#ddd6ff}.stg.s4{background:#4a3524;color:#ffe2c4}.stg.s5{background:#4a2a2a;color:#ffd2cc}.stg.s6{background:#4a4220;color:#fff1bf}
a.sec{color:var(--text2);border-bottom:1px dotted var(--line2)}a.sec:hover{color:var(--gold2);text-decoration:none}
.phead{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:14px;background:linear-gradient(115deg,color-mix(in srgb,var(--c1) 20%,#0f1520),#131924 62%);box-shadow:inset 4px 0 0 var(--c1)}

  ni: ['Net income', 'Profit after interest and taxes. Dividends are paid from it.'],

function calEvents(from, to) {

  for (const d of G.deals) if (d.st === 'active' && (d.mine || (d.bids || []).some(b => b.mine)) && d.next) add(d.next, `${d.k === 'ipo' ? 'IPO pricing' : d.k === 'sale' ? 'Auction round' : 'Deal step'}: ${CO(d.target) ? CO(d.target).n : ''}`, 'deal', `deal:${d.id}`);
  for (const c of myCompanies()) { if (!iControl(c)) continue; for (const x of c.debt) add(x.mat, `${c.n}: ${money(x.amt)} ${DEBT_TYPES[x.t] ? DEBT_TYPES[x.t].n.toLowerCase() : 'debt'} matures`, 'debt', `co:${c.id}:debt`); if (c.succD) add(c.succD, `${c.n}: CEO transition`, 'people', `co:${c.id}:mgmt`); for (const I of c.integ || []) if (!I.done) add(Math.round(I.start + I.dur * 30.4), `${I.n}: integration due to complete`, 'deal', `co:${c.id}`); for (const pid of c.props || []) { const p = PR(pid); if (p && p.stage < 5 && p.stEnd) add(p.stEnd, `${p.n}: ${DEV_STAGES[p.stage]} stage ends`, 're', `prop:${p.id}`); }
    if (c.kind === 'fund' && c.fund) { add(c.fund.invEnd, `${c.n}: investment period ends`, 'fund', `co:${c.id}`); add(c.fund.end, `${c.n}: fund term ends`, 'fund', `co:${c.id}`); } }
  for (const e of G.earnouts) if (!e.paid && (isMineOwner(e.from) || isMineOwner(e.to) || e.to === MEO())) add(e.due, `Earnout test: ${CO(e.co) ? CO(e.co).n : ''} (${money(e.amt)})`, 'deal', `co:${e.co}`);
  for (const o of G.offers) if (!o.st && o.exp) add(o.exp, `Offer expires: ${o.k}`, 'office', 'nav:inbox');

  return ev.sort((a, b) => a.d - b.d);
}

UI.treeOpen = UI.treeOpen || {};
function treeNode(o, depth, path, mult, seen) {
  if (depth > 7) return ''; const out = []; const hs = holdingsOf(o).map(CO).filter(alive).map(c => ({ c, s: stake(o, c), v: controlOf(o, c.id) })).sort((a, b) => stakeValue(o, b.c) - stakeValue(o, a.c));
  for (const { c, s, v } of hs) { if (seen.has(c.id)) continue; const key = path + '/' + c.id; const kids = holdingsOf(c.id).filter(k => alive(CO(k))).length; const open = UI.treeOpen[key] ?? (depth < 1 || (depth < 2 && kids < 12)); const econ = mult * s; const val = stakeValue(o, c);

ACTIONS.capok = a => { const rid = a.join(':'); const k = rid.replace(':', '_'); const amt = +fv('rq_' + k); const src = fv('rf_' + k); const r = approveRequest(rid, amt, src === 'self' ? null : +src); res(r); };

VIEWS.cash = () => {

  const acc = pockets.map(p => [p.o, `${p.n} (${money(p.cash)})`]);

  return page('Cash', 'Cash lives in separate pockets. It moves up as dividends and down as capital injections — each move has consequences.', H ? `<button class="btn" data-a="sweep">Sweep excess subsidiary cash to ${esc(H.n)}</button>` : '',
    `<div class="kpis">${kpi('Total cash across pockets', money(tot))}${kpi(tip('pcash', 'Personal'), money(P.cash), P.debt ? `credit line ${money(P.debt)}` : '', P.cash < 0 ? 'bad' : '')}${H ? kpi(tip('hcash', 'Holding company'), money(H.cash)) : ''}${kpi('Operating companies', money(sum(pockets.filter(p => p.c && p.c.kind === 'op'), p => p.cash)))}${kpi('Personal borrowing capacity', money(personBorrowRoom(P)))}</div>
    <div class="grid g2">${card('Move cash', `<label class="fl">From${sel('mc_f', acc, H ? H.id : o)}</label><label class="fl">To${sel('mc_t', acc, o)}</label>${amtField('mc_a', H ? Math.max(0, H.cash * 0.1) : 0, 'Amount')}<button class="btn p" data-a="mcgo">Move</button><p class="small muted" style="margin-top:8px">Upward moves are dividends: the company pays <i>all</i> its shareholders pro rata, so a partly owned company pays out more than you receive. Dividends reaching a person are taxed (simplified 20%). Downward moves are injections: if you are not the sole owner you receive new shares. Cash can’t jump sideways between unrelated companies.</p>`)}
    ${card('Personal credit line', `<p class="small">Borrow against your shareholdings (${pct(G.eco.rate + 0.02, 1)} floating). Capacity ${money(personBorrowRoom(P))}. Outstanding ${money(P.debt || 0)}.</p>${amtField('pb_a', Math.min(personBorrowRoom(P), 1e6 * S$()), 'Amount')}<div class="row"><button class="btn" data-a="pborrow">Draw</button><button class="btn" data-a="prepay">Repay</button></div>`)}</div>
    ${card('Pockets', table('cash_t', [{ k: 'n', l: 'Account', f: p => p.c ? col(p.c) : `<b>${esc(p.n)}</b>` }, { k: 'kind', l: 'Type', f: p => `<span class="small">${esc(p.kind)}</span>` }, { k: 'cash', l: 'Cash', n: 1, f: p => `<span class="${p.cash < 0 ? 'bad' : ''}">${money(p.cash)}</span>` }, { k: 'min', l: 'Operating minimum', n: 1, f: p => p.min ? money(p.min) : '—' }, { k: 'x', l: 'Excess', n: 1, s: p => p.cash - p.min, f: p => money(Math.max(0, p.cash - p.min)) }, { k: 'debt', l: 'Debt', n: 1, f: p => money(p.debt) }, { k: 'net', l: 'Net cash', n: 1, s: p => p.cash - p.debt, f: p => `<span class="${p.cash - p.debt < 0 ? 'warn' : ''}">${money(p.cash - p.debt)}</span>` }], pockets, { key: p => p.o, def: { sort: 'cash' }, ps: 30 }), { np: 1 })}`);
};
ACTIONS.mcgo = () => { const r = moveCash(+fv('mc_f'), +fv('mc_t'), +fv('mc_a')); res(r); };
ACTIONS.pborrow = () => { const P = me(); const amt = Math.round(+fv('pb_a')); if (!(amt > 0)) return res({ err: 'Enter an amount.' }); if (amt > personBorrowRoom(P) && !cheat('unlBorrow')) return res({ err: `Your bank will lend at most ${money(personBorrowRoom(P))}.` }); P.debt = (P.debt || 0) + amt; P.cash += amt; tl(`Drew ${money(amt)} on a personal credit line`, 'fin'); res({ ok: `Borrowed ${money(amt)} personally.` }); };
ACTIONS.prepay = () => { const P = me(); const amt = Math.min(Math.round(+fv('pb_a')), P.debt || 0, Math.max(0, P.cash)); if (!(amt > 0)) return res({ err: 'Nothing to repay, or no personal cash.' }); P.debt -= amt; P.cash -= amt; logAlloc('debt', amt, null, amt); res({ ok: `Repaid ${money(amt)}.` }); };
ACTIONS.sweep = () => { const H = CO(G.myHold); if (!H) return; let tot = 0, n = 0; for (const c of holdingsOf(H.id).map(CO)) { if (!alive(c) || c.kind !== 'op' || !iControl(c)) continue; const ex = c.cash - minCash(c) * 2; if (ex <= 0) continue; const st = stake(H.id, c); const r = moveCash(c.id, H.id, ex * st); if (!r.err) { tot += ex * st; n++; } } res({ ok: n ? `${plural(n, 'subsidiary', 'subsidiaries')} paid ${money(tot)} up to ${H.n}.` : 'No subsidiary has excess cash.' }); };

  ${P.debt ? card('Personal', lines([['Credit line outstanding', money(P.debt)], ['Rate', pct(G.eco.rate + 0.02, 2)], ['Capacity remaining', money(personBorrowRoom(P))]]) + '<button class="btn" data-a="nav:cash">Manage</button>') : ''}`);

ACTIONS.idxbuy = () => vehModal('Buy the index fund', 'idxgo', `Tracks the whole market (index ${fmtNum(G.eco.idx)}). Fully liquid; no control.`);
ACTIONS.crdbuy = () => vehModal('Buy the credit fund', 'crdgo', `A diversified senior-loan fund yielding about ${pct(G.eco.rate + 0.035, 1)}; it loses money in recessions and crises.`);

ACTIONS.mkfundgo = () => { const g = +fv('mf_g'), k = fv('mf_k'); const want = +fv('mf_s'); const G_ = CO(g); const track = G.co.filter(f => f && f.kind === 'fund' && isMineOwner(f.gp)).length; const rep = sum(Object.values(G.ownerRep || {})) / 40; const size = Math.min(want, (track ? 400e6 : 150e6) * S$() * (1 + rep) * Math.exp(G.eco.sent * 0.5)); const gpC = size * 0.02; if (G_.cash < gpC * 0.3) return res({ err: `${G_.n} needs about ${money(gpC * 0.3)} for its GP commitment.` }); const f = mkFund(k, g, size, { firm: G_.n.replace(/ (Holdings|Capital|Group)$/, '') }); closeModal(); tl(`Launched ${f.n} (${money(size)})`, 'fin'); news(`${f.n} closes at ${money(size)}`, { k: 'fund', co: f.id }); res({ ok: `${f.n} closed at ${money(size)}${size < want ? ' — less than targeted; build a track record' : ''}.` }); go('co', { id: f.id }); };
// ---------- dividends ----------

VIEWS.deal = p => {

    <div>${lines([['Implied equity value (100%)', money(m.eq)], ['Implied enterprise value', money(m.ev)], ['EV / EBITDA', m.evEbitda != null ? rnd(m.evEbitda, 1) + '×' : 'n/m'], ['EV / revenue', m.evRev != null && ttm(t, 'rev') > 1e6 * S$() ? rnd(m.evRev, 2) + '×' : 'n/m'], [t.pub ? 'Premium to market' : 'Premium to estimated value', `<span class="${m.prem > 0.4 ? 'warn' : ''}">${sgnPct(m.prem)}</span>`], ['Intrinsic value of the stake', money(m.intrinsic)], [tip('synergy', 'Synergy value (range)'), `${money(m.synLo)} – ${money(m.synHi)}`], ['Target leverage after', m.tLevAfter != null ? rnd(m.tLevAfter, 1) + '×' : 'n/m', m.tLevAfter > 5 ? 'bad' : ''], ['Buyer debt after', money(m.vehDebtAfter)], ['Cash yield on price (after interest)', m.cfYield != null ? pct(m.cfYield, 1) : 'n/m', m.cfYield != null && m.cfYield < G.eco.rate ? 'warn' : ''], ['Your ownership after', pct(Math.min(1, m.ownAfter))], [`${tip('lbo', 'Five-year hold case')}`, (() => { const e0 = ttm(t, 'ebitda'); if (!(e0 > 0) || !(m.ev > 0)) return 'n/m'; const g = clamp(revGrowth(t), -0.05, 0.12); const x = Math.min(m.ev / e0, MKT[t.ind] ? MKT[t.ind].valX * 1.3 : 12); const exitEV = e0 * Math.pow(1 + g, 5) * x; const nd0 = debtTotal(t) + s.debtT - t.cash; const pay = e0 * 0.3 * 5; const exitEq = Math.max(0, exitEV - Math.max(0, nd0 - pay)); const eqIn = Math.max(1, s.price - s.debtT - s.debtV); const out = exitEq * d.pct - s.debtV * Math.pow(1 + G.eco.rate + 0.03, 5); const mo = out / eqIn; return mo > 0 ? `${rnd(mo, 2)}× · ${pct(Math.pow(mo, 0.2) - 1, 1)} IRR` : 'equity wiped out'; })()], ['Advisory fees', money(sum(Object.keys(s.adv).filter(k => s.adv[k]), k => ADVISORS[k][1]) * s.price)], ['Cash needed from buyer', money(Math.max(0, s.price * (1 - s.stock - s.earn) - s.debtV - s.debtT)), s.price * (1 - s.stock - s.earn) - s.debtV - s.debtT > V.cash ? 'bad' : ''], ['Buyer cash', money(V.cash)]])}

  const heir = PP(G.succ.heir); const est = G.cfg.estate ? Math.max(0, netWorth(P) - 15e6 * S$()) * 0.4 * ({ trust: 0.5, professional: 0.5, foundation: 0.3 }[G.succ.mode] || 1) : 0; let body = '';
  if (T.cur === 'succ') body = `<div class="kpis">${kpi('Your age', ageOf(P), ageOf(P) >= 70 ? 'mortality risk rising' : '', ageOf(P) >= 72 ? 'warn' : '')}${kpi('Generation', G.me_gen || 1)}${kpi('Named successor', heir ? esc(heir.n) : 'none', heir ? `readiness ${heirReady(heir)}/100` : 'the most ready adult heir by default')}${kpi(tip('estate', 'Estate tax (estimate)'), G.cfg.estate ? money(est) : 'off', G.cfg.estate ? 'simplified 40% above an exemption' : 'disabled in settings')}</div>
    ${card('Succession plan', `<label class="fl">Structure${sel('sc_m', Object.entries(SUCC_MODES).map(([k, v]) => [k, `${v[0]} — ${v[1]}`]), G.succ.mode, 'data-ch="succset:mode"')}</label><label class="fl">Successor${sel('sc_h', [['', 'Most ready adult heir']].concat(fam.filter(f => ageOf(f) >= 16).map(f => [f.id, `${f.n} (age ${ageOf(f)}, readiness ${heirReady(f)})`])), G.succ.heir ?? '', 'data-ch="succset:heir"')}</label><div class="row wrap"><button class="btn d" data-a="retire">Retire now</button></div><p class="small muted">When you die or retire, play continues as your successor. A trust or professional management keeps the empire together with lower estate taxes; splitting equally is fair but fragments control; selling ends the operating empire. A successor with low readiness unsettles investors and executives. Not tax or legal advice.</p>`)}`;
  else if (T.cur === 'family') body = card('Family', table('fam_t', [{ k: 'n', l: 'Name', s: f => f.n, f: f => perl(f) }, { k: 'age', l: 'Age', n: 1, s: f => ageOf(f), f: f => ageOf(f) }, { k: 'gen', l: 'Generation', n: 1, s: f => f.fam ? f.fam.gen : 0, f: f => f.fam ? f.fam.gen : '—' }, { k: 'int', l: 'Interest in the business', n: 1, s: f => f.fam ? f.fam.int : 0, f: f => f.fam ? rbar(f.fam.int) : '—' }, { k: 'r', l: 'Readiness', n: 1, s: f => heirReady(f), f: f => rbar(heirReady(f)) }, { k: 'role', l: 'Role', s: f => f.co ?? -1, f: f => f.co != null && CO(f.co) ? `${esc(EX_ROLES[f.role] || f.role)} at ${col(f.co)}` : '<span class="muted small">none</span>' }, { k: 'nw', l: 'Net worth', n: 1, s: f => netWorth(f), f: f => money(netWorth(f)) }, { k: 'x', l: '', nosort: 1, f: f => ageOf(f) >= 22 && f.co == null ? `<button class="btn xs" data-a="placeheir:${f.id}">Give a role</button>` : '' }], fam, { key: f => f.id, empty: 'No living family members.' }), { np: 1 }) + '<div class="note small">Family members build readiness by working in the business. Those with little interest may ask to sell their stakes. All family members are fictional characters generated for your dynasty.</div>';
  else if (T.cur === 'phil') body = `<div class="kpis">${kpi('Lifetime giving', money(P.given || 0))}${F ? kpi('Foundation assets', money(navOf(F))) : ''}${F ? kpi('Grants made', money(F.grants.tot)) : ''}${F ? kpi('Focus', esc(CAUSES[F.cause])) : ''}</div>${card('Give', `<label class="fl">Cause${sel('ph_c', Object.entries(CAUSES), F ? F.cause : 'edu')}</label>${amtField('ph_a', Math.max(0, P.cash * 0.1), 'Cash gift to your foundation')}<button class="btn p" data-a="donate">Donate</button><p class="small muted">The foundation grants about 5% of its assets a year. Shares can be donated from Personal Ownership. Philanthropy is its own reward here — it does not buy influence.</p>`)}${F ? card('Grants by cause', barChart(Object.entries(F.grants.by).map(([k, v], i) => ({ l: CAUSES[k], v, c: PAL[i] })), { fmt: v => money(v) })) : ''}`;
  else if (T.cur === 'life') body = card('Lifestyle (optional)', `<p class="small muted">Purely personal: these assets cost money to keep and do not affect your businesses.</p>${table('life_t', [{ k: 'n', l: 'Asset', f: x => esc(LIFESTYLE[x.k][0]) }, { k: 'v', l: 'Value', n: 1, f: x => money(x.v) }, { k: 'up', l: 'Upkeep / yr', n: 1, s: x => x.cost0 * LIFESTYLE[x.k][2], f: x => money(x.cost0 * LIFESTYLE[x.k][2]) }, { k: 'x', l: '', nosort: 1, f: x => `<button class="btn xs" data-a="sellasset:${x.id}">Sell</button>` }], P.assets || [], { empty: 'None.' })}<div class="row wrap" style="margin-top:10px">${Object.entries(LIFESTYLE).map(([k, L]) => `<button class="btn" data-a="buyasset:${k}">${esc(L[0])} · ${money(L[1] * S$())}</button>`).join('')}</div>`);
  else if (T.cur === 'career') { const j = P.job; body = card('Career', `${lines([['Level', esc(CAREER_LEVELS[j.lvl])], ['Employer', j.co != null ? col(j.co) : j.firm != null ? col(j.firm) : '—'], ['Salary', money(P.sal || 0)], ['Last review', `${j.perf}/100`]])}<p class="small">Promotions come with strong reviews. Senior people are offered CEO roles. Save and invest your pay — or found a company whenever you have the capital.</p><div class="row"><button class="btn p" data-a="foundco">Found a company</button><button class="btn" data-a="nav:investments">Invest savings</button></div>`); }
  return page('Family & Succession', 'The next generation, the plan, philanthropy and the personal side', '', T.html + body);
};

VIEWS.dealhist = () => {
  const acq = G.alloc.filter(a => a.b === 'acq' && a.amt > 1).map(a => { const v = allocValue(a); const c = CO(a.co); return { id: a.id, a, c, v, gain: v - a.amt, mult: v / Math.max(1, a.amt), yrs: Math.max(0.1, ((a.closed || G.day) - a.d) / 365) }; });
  const f = F('dh'); let log = G.dealLog.slice().reverse(); if (f.mine) log = log.filter(d => d.mine); if (f.k) log = log.filter(d => d.k === f.k); if (f.q) { const q = f.q.toLowerCase(); log = log.filter(d => (d.n || '').toLowerCase().includes(q)); }
  const best = acq.slice().sort((a, b) => b.gain - a.gain).slice(0, 5), worst = acq.slice().sort((a, b) => a.gain - b.gain).slice(0, 5);
  const tot = sum(acq, x => x.a.amt), val = sum(acq, x => x.v);
  const row = x => `<div class="ln"><span>${x.c ? col(x.c) : 'defunct'} <span class="tiny muted">${dateOf(x.a.d).y} · paid ${money(x.a.amt)}</span></span><b class="${x.gain >= 0 ? 'good' : 'bad'}">${x.gain >= 0 ? '+' : '−'}${money(Math.abs(x.gain))} (${rnd(x.mult, 2)}×)</b></div>`;
  return page('Deal History', 'Every transaction — and whether your acquisitions created value', '', `<div class="kpis">${kpi('Your acquisitions', acq.length)}${kpi('Capital deployed', money(tot))}${kpi('Value today', money(val), tot > 0 ? `${rnd(val / tot, 2)}× overall` : '', val >= tot ? 'good' : 'bad')}${kpi('Value created', money(val - tot), '', val >= tot ? 'good' : 'bad')}${kpi('Deals in the market (recorded)', G.dealLog.length)}</div>
  <div class="grid g2">${card('Best acquisitions', best.length ? best.map(row).join('') : empty('None yet.'))}${card('Worst acquisitions', worst.length ? worst.map(row).join('') : empty('None yet.'))}</div>
  <div class="row wrap" style="margin-bottom:10px">${fq('dh', 'Search…')}${flt('dh', 'k', [['acq', 'Acquisitions'], ['stake', 'Stakes'], ['hostile', 'Hostile'], ['sale', 'Auction sales'], ['ipo', 'IPOs'], ['spin', 'Spinoffs'], ['merger', 'Mergers'], ['bk', 'Bankruptcy sales']], 'All types')}${fchk('dh', 'mine', 'Mine only')}</div>
  ${card('Transactions', table('dh_t', [{ k: 'd', l: 'Date', f: d => `<span class="small">${fmtDate(d.d)}</span>` }, { k: 'n', l: 'Transaction', f: d => `${d.mine ? '<span class="chip g xs">you</span> ' : ''}${d.id ? `<a data-a="why:deal:${d.id}">${esc(d.n)}</a>` : esc(d.n)}` }, { k: 'k', l: 'Type', f: d => `<span class="small">${esc({ acq: 'Acquisition', stake: 'Stake', hostile: 'Hostile takeover', sale: 'Auction sale', ipo: 'IPO', spin: 'Spinoff', merger: 'Merger', bk: 'Bankruptcy sale' }[d.k] || d.k)}</span>` }, { k: 'v', l: 'Value', n: 1, f: d => money(d.v) }, { k: 'pct', l: 'Stake', n: 1, s: d => d.pct || 0, f: d => d.pct ? pct(d.pct) : '—' }, { k: 'now', l: 'Target today', n: 1, s: d => CO(d.target) && alive(CO(d.target)) ? equityValue(CO(d.target)) : 0, f: d => CO(d.target) ? (alive(CO(d.target)) ? money(equityValue(CO(d.target))) : `<span class="muted small">${esc(CO(d.target).st)}</span>`) : '—' }], log, { key: d => (d.id || 0) + ':' + d.d + ':' + d.target, def: { sort: 'd' }, ps: 40, noun: 'transactions', showCount: 1 }), { np: 1 })}`);
};

VIEWS.challenges = () => {
  const done = G.chal || {}; const n = Object.keys(done).length;
  return page('Challenges', `${n} of ${CHALLENGES.length} complete — they are checked every year`, '', `<div class="grid g2">${CHALLENGES.map(([k, nm, d]) => `<div class="card" style="margin:0"><div class="bd"><div class="row"><b style="flex:1">${esc(nm)}</b>${done[k] ? `<span class="chip g">Complete ${dateOf(done[k]).y}</span>` : '<span class="chip">Open</span>'}</div><div class="small muted" style="margin-top:4px">${esc(d)}</div>${chalProgress(k)}</div></div>`).join('')}</div>`);
};
function chalProgress(k) { try { const P = me(); const S = S$(); const b = (v, t, f) => `<div class="row small" style="margin-top:8px">${bar(Math.max(0, v) / t * 100)}<span>${f(v)} / ${f(t)}</span></div>`;
  if (k === 'firstB') return b(netWorth(P), 1e9 * S, money); if (k === 'holdco10') return b(myCompanies().filter(c => c.kind === 'op' && effOwn(MEO(), c.id) >= 0.5 && ttm(c, 'ebit') > 0).length, 10, x => x); if (k === 'turn5') return b(G.stats.turnarounds || 0, 5, x => x); if (k === 'sports5') return b(myCompanies().filter(c => c.team != null && effOwn(MEO(), c.id) >= 0.5).length, 5, x => x); if (k === 'reBaron') return b(sum(myCompanies().filter(c => c.props && controlOf(MEO(), c.id) >= 0.5), c => propValue(c)), 100e9 * S, money); if (k === 'techTitan') return b(Math.max(0, ...myCompanies().filter(c => MKT[c.ind] && MKT[c.ind].sec === 'tech' && controlOf(MEO(), c.id) >= 0.5).map(c => equityValue(c))), 500e9 * S, money); if (k === 'conglom10') return b(new Set(myCompanies().filter(c => c.kind === 'op' && controlOf(MEO(), c.id) >= 0.5).map(c => c.ind)).size, 10, x => x); if (k === 'dynasty4') return b(G.me_gen || 1, 4, x => x); if (k === 'trillion') return b(empireEV(), 1e12 * S, money); if (k === 'century') return b(curYear() - G.startY, 100, x => x); if (k === 'pe5x') { const f = maxBy(G.co.filter(c => c && c.kind === 'fund' && c.gp != null && isMineOwner(c.gp)), c => fundMoic(c)); return f ? b(fundMoic(f), 5, x => rnd(x, 2) + '×') : ''; } } catch (e) { } return ''; }
// ---------- saves ----------
function download(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
function fileSafe(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'save'; }
async function doSave(slot, name) { try { const m = await saveTo(slot, name); G.slot = slot; await refreshMetas(); toast(`Saved — ${esc(m.name)} (${Math.round(m.size / 1024)} KB).`); render(); } catch (e) { toast(`<span class="bad">Save failed: ${esc(e.message)}</span>`, 6000); } }
VIEWS.saves = () => {
  if (!UI.metasFresh) { UI.metasFresh = 1; refreshMetas().then(() => { if (UI.route === 'saves') renderMain(true); }); }
  const metas = UI.metas || []; const iron = G.cfg.ironman; const raw = UI.lastSize;
  return page('Saves', iron ? 'Ironman: a single save slot, written automatically. No reloading.' : 'Save slots in this browser, with rotating autosave backups. Export to keep a file.', `${iron ? '' : '<button class="btn p" data-a="savenow">Save</button><button class="btn" data-a="saveas">Save as…</button>'}<button class="btn" data-a="exportcur">Export file</button>${iron ? '' : '<button class="btn" data-a="importsave">Import</button>'}<button class="btn" data-a="quittitle">Exit to title</button>`,
    `<div class="kpis">${kpi('Current slot', esc(G.slot || '—'))}${kpi('Autosave', G.settings.autosave === false ? 'off' : `every ${G.settings.autosaveDays || 30} days`)}${kpi('Validation', (() => { const v = validateSave(); return v.length ? `<span class="warn">${v.length} issue${v.length > 1 ? 's' : ''}</span>` : '<span class="good">clean</span>'; })())}${raw ? kpi('Last save size', `${Math.round(raw / 1024)} KB`) : ''}${kpi('Seed', esc(G.seed))}</div>
    ${UI.noDB ? '<div class="note warn">Browser storage is unavailable here. Use Export to keep your game.</div>' : ''}
    ${card('Saved games', savesTable(metas.filter(m => !iron || String(m.slot).startsWith('ironman')), false), { np: 1 })}
    <div class="note small">Autosave keeps three rotating backups (auto, auto-2, auto-3). Saves are validated before they are written (ownership bounds, missing references, invalid numbers) and compressed. Old history is compacted automatically so long games stay small.</div>`);
};
ACTIONS.savenow = () => { if (G.cfg.ironman) return autosave().then(() => { toast('Saved.'); refreshMetas(); }); doSave(G.slot && !String(G.slot).startsWith('auto') ? G.slot : 'quick', null); };
ACTIONS.saveas = () => promptBox('Save as', `${me().n} — ${fmtDate(G.day)}`, v => { v = (v || '').trim(); if (!v) return; doSave('slot-' + Date.now().toString(36), v.slice(0, 80)); });
ACTIONS.exportcur = async () => { try { const json = serialize(); UI.lastSize = json.length; const blob = await gz(json); download(`billionaire-empire-${fileSafe(me().n)}-${dateOf(G.day).y}.besave`, blob); toast('Exported.'); } catch (e) { toast(`<span class="bad">${esc(e.message)}</span>`); } };
ACTIONS.dupslot = async a => { const s = a.join(':'); try { const r = await DB.get('saves', s); const m = (UI.metas || []).find(x => x.slot === s); if (!r || !m) throw new Error('Slot not found'); const ns = 'slot-' + Date.now().toString(36); await DB.put('saves', { slot: ns, blob: r.blob }); await DB.put('meta', Object.assign({}, m, { slot: ns, name: m.name + ' (copy)', d: Date.now() })); await refreshMetas(); toast('Duplicated.'); render(); } catch (e) { toast(`<span class="bad">${esc(e.message)}</span>`); } };
ACTIONS.renslot = a => { const s = a.join(':'); const m = (UI.metas || []).find(x => x.slot === s); if (!m) return; promptBox('Rename save', m.name, async v => { v = (v || '').trim(); if (!v) return; m.name = v.slice(0, 80); await DB.put('meta', m); await refreshMetas(); render(); }); };
ACTIONS.expslot = async a => { const s = a.join(':'); try { const r = await DB.get('saves', s); const m = (UI.metas || []).find(x => x.slot === s); if (!r) throw new Error('Slot not found'); download(`billionaire-empire-${fileSafe(m ? m.name : s)}.besave`, r.blob); } catch (e) { toast(`<span class="bad">${esc(e.message)}</span>`); } };
ACTIONS.delslot = a => { const s = a.join(':'); const m = (UI.metas || []).find(x => x.slot === s); confirmBox(`Delete “${esc(m ? m.name : s)}”? This cannot be undone.`, async () => { await DB.del('saves', s); await DB.del('meta', s); await refreshMetas(); toast('Deleted.'); render(); }, 1); };
ACTIONS.quittitle = () => confirmBox('Exit to the title screen? Progress since your last save will be autosaved if autosave is on.', async () => { setSpeed(0); if (G.settings.autosave !== false || G.cfg.ironman) await autosave(); G = null; UI.route = 'intro'; UI.hist = []; UI.modal = null; UI.metasFresh = 0; await refreshMetas(); $('#app').dataset.shell = ''; const tb = $('#tutbox'); if (tb) tb.remove(); render(); });
// ---------- settings & delegation ----------
VIEWS.settings = () => {
  const R_ = G.rules, S = G.settings; const num = (k, lbl, val, step, note) => `<label class="fl">${lbl}<input type="number" value="${val}" step="${step}" data-ch="rule:${k}"></label>${note ? `<div class="tiny muted" style="margin:-6px 0 8px">${note}</div>` : ''}`;
  const chk = (act, on, lbl) => `<label class="chk"><input type="checkbox" data-ch="${act}" ${on ? 'checked' : ''}> ${lbl}</label>`;
  return page('Settings & Delegation', 'What reaches your desk, and what your executives decide alone', '', `<div class="grid g2">${card(tip('delegation', 'Delegation rules'), `${num('hurdle', 'Hurdle rate (%)', rnd((R_.hurdle || 0.08) * 100, 1), 0.5, 'Capital requests and businesses are judged against it; recommendations flag companies below it.')}${num('capexMax', 'CEOs may start projects up to ($M)', Math.round(R_.capexMax / 1e6), 5, 'Larger projects need your approval in Capital Allocation.')}${num('acqAsk', 'Subsidiary acquisitions above this need your approval ($M)', Math.round(R_.acqAsk / 1e6), 10, 'Smaller bolt-ons funded from a war chest proceed automatically.')}
    <label class="fl">Default governance for new companies${sel('st_da', Object.entries(AUTONOMY).map(([k, v]) => [k, v[0]]), R_.defAuto || 'board', 'data-ch="rulestr:defAuto"')}</label>
    ${chk('rulechk:autoRefi', R_.autoRefi, 'Refinance maturing debt automatically')}${chk('rulechk:autoRepay', R_.autoRepay, 'Let CEOs repay expensive debt when cash-rich')}${chk('rulechk:autoHire', R_.autoHire, 'Fill CEO vacancies automatically (best available candidate)')}`)}
  ${card('Auto-pause', `<p class="small muted">When running time, pause automatically for:</p>${Object.entries(PAUSE_OPTS).map(([k, l]) => chk('pauseopt:' + k, S.pause[k], esc(l))).join('')}`)}</div>
  <div class="grid g2">${card('Game', `${chk('setopt:moments', S.moments, 'Show moments (milestones, closings, reviews)')}${chk('setopt:review', S.review !== false, 'Show the annual review each January')}${chk('setopt:autosave', S.autosave !== false, 'Autosave')}<label class="fl">Autosave every${sel('st_asd', [[30, 'month'], [91, 'quarter'], [365, 'year']], S.autosaveDays || 30, 'data-ch="setnum:autosaveDays"')}</label>${chk('setopt:reduced', S.reduced, 'Reduce motion')}<label class="fl">Density${sel('st_den', [['compact', 'Compact'], ['comfy', 'Comfortable']], S.density || 'compact', 'data-ch="setstr:density"')}</label>${chk('setopt:simple', S.simple, 'Simplified menu — hide specialized screens until they are relevant')}${chk('estate', G.cfg.estate, 'Simplified estate taxes at succession')}<button class="btn" data-a="tutrestart">Restart the getting-started guide</button>`)}
  ${card('World', `${lines([['Mode', esc(MODES[G.cfg.mode] ? MODES[G.cfg.mode][0] : G.cfg.mode)], ['Start', esc(STARTS[G.cfg.start] ? STARTS[G.cfg.start].n : '')], ['Difficulty', esc(DIFF[G.cfg.diff] ? DIFF[G.cfg.diff].n : '')], ['Began', G.startY], ['Seed', esc(G.seed)], ['Ironman', G.cfg.ironman ? 'yes' : 'no'], ['Cheats used', G.cheatsUsed || 0]])}${G.cfg.ironman ? '' : `<h4>Custom settings</h4>${SLIDERS.map(([k, n]) => `<div class="sl"><span class="small">${esc(n)}</span><input type="range" min="0.5" max="1.8" step="0.05" value="${sl(k)}" data-ch="slset:${k}" data-out="so_${k}" data-fmt="x" aria-label="${esc(n)}"><output id="so_${k}">${sl(k).toFixed(2)}×</output></div>`).join('')}${cheatsAllowed() ? '' : '<button class="btn" data-a="unlockcheats" style="margin-top:8px">Enable commissioner & cheats</button>'}`}`)}</div>`);
};
ACTIONS.rule = a => { const k = a[0], v = +a[1]; if (!isFinite(v)) return; G.rules[k] = k === 'hurdle' ? clamp(v / 100, 0, 0.5) : Math.max(0, v) * 1e6; toast('Delegation updated.'); };
ACTIONS.rulestr = a => { G.rules[a[0]] = a[1]; toast('Updated.'); };
ACTIONS.rulechk = a => { G.rules[a[0]] = +a[1] === 1; };
ACTIONS.pauseopt = a => { G.settings.pause[a[0]] = +a[1] === 1; };
ACTIONS.setopt = a => { G.settings[a[0]] = +a[1] === 1; if (a[0] === 'reduced' || a[0] === 'simple') render(); };
ACTIONS.setnum = a => { G.settings[a[0]] = +a[1]; };
ACTIONS.setstr = a => { G.settings[a[0]] = a[1]; render(); };
ACTIONS.estate = a => { G.cfg.estate = +a[0] === 1; };
ACTIONS.slset = a => { G.cfg.sl = G.cfg.sl || {}; G.cfg.sl[a[0]] = +a[1]; };
ACTIONS.unlockcheats = () => confirmBox('Enable the commissioner and cheats for this game? The save will be marked as modified and challenges will note it.', () => { G.cheatsOk = 1; G.stats.cheated = 1; res({ ok: 'Commissioner enabled — see Office › Commissioner.' }); });
// ---------- commissioner ----------
const CM_DEF = [['cash', 'Adjust cash', ['co+me', 'amt$']], ['nodebt', 'Remove all debt', ['co']], ['rev', 'Scale demand (×)', ['co', 'num']], ['margin', 'Change product quality (+/−)', ['co', 'num']], ['px', 'Set share price', ['co', 'num']], ['val', 'Set valuation ($M)', ['co', 'amt$']], ['own', 'Set your direct stake (0–1)', ['co', 'num']], ['transfer', 'Transfer control to you', ['co']], ['acquire', 'Acquire outright (no deal)', ['co']], ['merge', 'Merge two companies', ['co', 'co2']], ['ipo', 'List immediately', ['co']], ['bk', 'Force bankruptcy', ['co']], ['newco', 'Create a company ($M revenue)', ['ind', 'num']], ['exec', 'Create an executive (quality 0–100)', ['num']], ['bill', 'Create a rival billionaire ($M)', ['arch', 'num']], ['econ', 'Set economic phase', ['phase']], ['rate', 'Set policy rate (%)', ['num']], ['indg', 'Adjust industry growth (%/yr)', ['ind', 'num']], ['prop', 'Add a property', ['co', 'ptype']], ['team', 'Create a sports team for you', ['league']], ['rival', 'Adjust a rival', ['bill', 'rivop', 'num']]];
VIEWS.commish = () => {
  if (!cheatsAllowed()) return page('Commissioner', '', '', `<div class="note">The commissioner is available in Sandbox games, or after enabling it in Settings (not in Ironman).</div>`);
  const q = (F('cm').q || '').toLowerCase(); const cos = G.co.filter(c => alive(c) && (!q || c.n.toLowerCase().includes(q))).sort((a, b) => equityValue(b) - equityValue(a)).slice(0, 250);
  const coSel = (id) => sel(id, cos.map(c => [c.id, `${c.n} (${indName(c)})`]), cos[0] ? cos[0].id : '');
  const inp = (t, i) => t === 'co' ? coSel('cm_a' + i) : t === 'co+me' ? sel('cm_a' + i, [['me', 'Personal (you)']].concat(cos.map(c => [c.id, c.n])), 'me') : t === 'co2' ? coSel('cm_a' + i) : t === 'ind' ? sel('cm_a' + i, MKT_KEYS.filter(k => G.mk[k].on).map(k => [k, MKT[k].n]), MKT_KEYS[0]) : t === 'arch' ? sel('cm_a' + i, Object.entries(ARCH).map(([k, v]) => [k, v.n]), 'dealmaker') : t === 'phase' ? sel('cm_a' + i, Object.entries(PHASES).map(([k, v]) => [k, v.n]), 'boom') : t === 'ptype' ? sel('cm_a' + i, Object.entries(RE_TYPES).map(([k, v]) => [k, v.n]), 'office') : t === 'league' ? sel('cm_a' + i, LEAGUES.map(l => [l.k, l.n]), LEAGUES[0].k) : t === 'bill' ? sel('cm_a' + i, G.bills.map(PP).filter(p => p && p.st === 'act').map(p => [p.id, p.n]), '') : t === 'rivop' ? sel('cm_a' + i, [['cash', 'Adjust cash ($M)'], ['sellall', 'Sell all public holdings']], 'cash') : `<input type="number" id="cm_a${i}" step="any" placeholder="${t === 'amt$' ? '$ millions' : 'value'}">`;
  const cur = UI.cmK || 'cash'; const def = CM_DEF.find(x => x[0] === cur);
  return page('Commissioner', 'Sandbox tools. Changes take effect immediately.', '', `<div class="grid g2">${card('Command', `<label class="fl">Action${sel('cm_k', CM_DEF.map(x => [x[0], x[1]]), cur, 'data-ch="cmk"')}</label><div class="row wrap" style="margin-bottom:8px">${fq('cm', 'Filter companies…')}</div>${def[2].map((t, i) => `<label class="fl">${esc({ co: 'Company', 'co+me': 'Account', co2: 'Second company', ind: 'Industry', arch: 'Style', phase: 'Phase', ptype: 'Property type', league: 'League', bill: 'Billionaire', rivop: 'Operation', num: 'Value', 'amt$': 'Amount ($ millions)' }[t])}${inp(t, i)}</label>`).join('')}<button class="btn p" data-a="cmgo">Apply</button>`)}
  ${card('Cheats', CHEATS.map(([k, n]) => `<label class="chk"><input type="checkbox" data-ch="cheat:${k}" ${cheat(k) ? 'checked' : ''}> ${esc(n)}</label>`).join('') + `<div class="tiny muted" style="margin-top:6px">Cheats used this game: ${G.cheatsUsed || 0}.</div>`)}</div>`);
};
ACTIONS.cmk = a => { UI.cmK = a[0]; renderMain(true); };
ACTIONS.cmgo = () => { const def = CM_DEF.find(x => x[0] === (UI.cmK || 'cash')); const args = def[2].map((t, i) => { const v = fv('cm_a' + i); return t === 'amt$' ? String((+v || 0) * 1e6 * S$()) : v; }); res(cm(def[0], ...args)); };
ACTIONS.cheat = a => res(setCheat(a[0], +a[1] === 1));
// ---------- help ----------
const HELP = [
  ['Getting started', `You begin with a fortune, a company or a job, depending on your start. Time runs a day at a time: press <b>Space</b> to run or pause, <b>1–4</b> to change speed, or jump with <b>+D/+W/+M/+Q/+Y</b> and <b>⏭</b> (next event). Empire Command shows everything you own; the Inbox and Task Center show what needs a decision. Most of the time you are not running businesses day to day — your CEOs are. You decide who runs them, how they are financed, where capital goes, what to buy and what to sell.`],
  ['Ownership & control', `Companies have cap tables. You can own shares directly, or through holding companies, funds and subsidiaries. <b>Economic ownership</b> multiplies through each layer; <b>voting control</b> counts all votes of companies you control. Above 50% of votes you choose the board, the CEO and policy. Dual-class shares carry ten votes each. Circular structures (A owns B owns A) are not allowed. The Ownership Tree shows the whole structure.`],
  ['Cash pockets', `Personal cash, holding-company cash, subsidiary cash and fund cash are separate. Cash moves up by dividends — paid pro rata to all shareholders, taxed when it reaches a person — and down by capital injections, which buy new shares if you are not the sole owner. Subsidiaries keep an operating minimum. Negative personal cash is covered by a credit line against your shares.`],
  ['Capital allocation', `Every January your CEOs submit capital requests. CEOs are optimistic; your holding-company CFO provides a more sober estimate. Compare every use of money — projects, acquisitions, buybacks, debt repayment, dividends, the index fund — against your hurdle rate. The Capital Allocation Record tracks what each decision is worth today, by category, with multiples and IRRs.`],
  ['Financials & valuation', `Companies earn revenue from business lines in markets. Share depends on product quality versus the industry frontier, brand, price, distribution and regional presence. Costs are materials, labor, overhead, R&D and marketing; capital-intensive businesses need capacity. Valuations use industry multiples of revenue, EBITDA or book value, adjusted for growth, interest rates and sentiment. Public companies trade on the market; private values are estimates.`],
  ['Debt & credit', `Debt amplifies returns and risk. Ratings from Prime to Distressed depend on leverage and coverage; they set spreads and borrowing limits. Floating debt resets with the policy rate. Covenants cap leverage; maturities must be repaid or refinanced — and in a credit crisis, refinancing may be impossible. Companies that run out of cash and credit enter bankruptcy, where creditors usually take the equity.`],
  ['Mergers & acquisitions', `Open a deal from any company page or the target screen. Build the model (price, stock, earnout, buyer and target debt, synergies), hire advisors, and offer. Sellers weigh price, form of payment, certainty, how you treat management and their memory of you. They may accept, counter, reject, or take a rival bid. After acceptance you run diligence, regulators may review concentration, public shareholders vote, then the deal closes and integration begins. Public companies can be approached with a hostile tender offer. You can also sell businesses through auctions, list them in IPOs, carve out lines and spin off subsidiaries.`],
  ['Public markets', `Stocks move on results versus expectations, guidance, sentiment and interest rates. Earnings reactions list their drivers — click Why? on any price. Crossing 5%, 10%, 20% and 30% of a company is disclosed. Activists and short sellers target companies too. Controlled public companies can buy back stock, issue new shares and pay dividends.`],
  ['People', `Executives have attributes — strategy, operations, capital allocation, finance, leadership, M&A, turnaround and industry expertise — and a track record. Hire from the market or poach at a premium; set pay; choose how much autonomy each CEO gets. Boards judge CEOs on results; rivals poach good ones. Plan successions before CEOs retire.`],
  ['Funds & alternative assets', `Commit to private-equity and venture funds as a limited partner, buy the index or credit fund, back startups in funding rounds, or launch your own fund as general partner and earn fees and carry. Real-estate companies buy, develop and sell properties valued by cap rates. Sports franchises earn media, tickets and sponsorship — and championships lift their value.`],
  ['Rivals & the world', `Dozens of rival billionaires run their own empires with distinct styles, remember how you treated them, and compete for deals. The economy cycles through expansion, slowdown, recession, crisis and recovery; emerging industries appear over decades and disrupt older ones.`],
  ['Family & succession', `You age. Name a successor and a structure — single heir, equal split, family trust, professional management, foundation or sale. When you die or retire, play continues as your heir. Family members build readiness by working in the business; disinterested ones may want to sell. Estate taxes are simplified and optional; nothing here is legal or tax advice.`],
  ['Delegation & automation', `Settings & Delegation decides what reaches you: approval thresholds, automatic refinancing, CEO hiring and auto-pause triggers. Hands-off companies set their own operating policy within those rules.`],
  ['Keyboard', `<b>Space</b> run/pause · <b>1–4</b> speed · <b>.</b> +1 day · <b>W</b> week · <b>M</b> month · <b>Q</b> quarter · <b>Y</b> year · <b>N</b> next event · <b>/</b> search · <b>H</b> command · <b>I</b> inbox · <b>T</b> tasks · <b>C</b> companies · <b>O</b> ownership tree · <b>A</b> capital · <b>D</b> deals · <b>G</b> targets · <b>S</b> stocks · <b>E</b> economy · <b>R</b> rivals · <b>F</b> net worth · <b>X</b> executives · <b>K</b> calendar · <b>Backspace</b> back · <b>Esc</b> close.`],
  ['About the simulation', `All companies, people, funds, outlets and events in the Fictional Universe are invented. In Real + Fictional mode: ${esc(REAL_LABEL)} Political and governmental matters are abstracted to regulation and macro conditions. Taxes are simplified. Economic numbers are game parameters.`],
];
VIEWS.help = () => {
  const T = tabs('helpv', [['man', 'Manual'], ['gl', 'Glossary']], 'man'); const q = (F('help').q || '').toLowerCase();
  return page('Help', 'How the game works', '<button class="btn" data-a="tutrestart">Getting-started guide</button>', T.html + (T.cur === 'man' ? HELP.map(([h, b]) => card(esc(h), `<div class="prose small">${b}</div>`)).join('') : `<div class="row" style="margin-bottom:10px">${fq('help', 'Find a term…')}</div>${card('Glossary', Object.entries(TERMS).filter(([k, [n, d]]) => !q || (n + d).toLowerCase().includes(q)).sort((a, b) => a[1][0].localeCompare(b[1][0])).map(([k, [n, d]]) => `<div style="margin-bottom:10px"><b>${esc(n)}</b><div class="small muted">${esc(d)}</div></div>`).join(''))}`));
};
// aliases used by engine-generated messages and recommendations
ACTIONS.sell = (a, el) => { if (UI.modal) UI.modal = null; ACTIONS.cosell(a, el); };
</script>
